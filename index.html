{id:"k7",a:"ana",te:"A",title:"Analysis ohne Hilfsmittel: Ganzrationale Funktion",pts:10,min:20,intro:"Gegeben ist $f(x)=x^{3}-6x^{2}+9x$ mit $x\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"fn",x:[-0.6,4.6],y:[-2,6],f:[{e:"x**3-6*x**2+9*x",t:"f",lx:4.2}],p:[[1,4,"H","ur"],[3,0,"T","dr"]],cap:"Graph von $f$"},parts:[
{op:"Bestimmen",q:"Bestimmen Sie die Nullstellen von $f$.",pts:2,mod:"$f(x)=x\\cdot(x^{2}-6x+9)=x\\cdot(x-3)^{2}$.\nAlso $x=0$ oder $x=3$. Die Stelle $x=3$ ist eine doppelte Nullstelle.",cr:[["Ausklammern von $x$ und binomische Formel erkannt",1],["Beide Nullstellen $x=0$ und $x=3$",1]],tip:"Nach dem Ausklammern von $x$ ist die quadratische Gleichung noch nicht fertig."},
{op:"Berechnen",q:"Berechnen Sie die Koordinaten der Extrempunkte von $f$ und bestimmen Sie deren Art.",pts:4,mod:"$f'(x)=3x^{2}-12x+9=3\\cdot(x-1)\\cdot(x-3)$, also $f'(x)=0$ für $x=1$ oder $x=3$.\n$f''(x)=6x-12$. Es gilt $f''(1)=-6<0$ und $f''(3)=6>0$.\nAlso Hochpunkt $H(1\\,|\\,4)$ und Tiefpunkt $T(3\\,|\\,0)$.",cr:[["$f'(x)$ korrekt und gleich 0 gesetzt",1],["$x=1$ und $x=3$",1],["Art mit $f''$ (oder Vorzeichenwechsel) begründet",1],["$y$-Werte: $H(1\\,|\\,4)$ und $T(3\\,|\\,0)$",1]],tip:"Die $y$-Koordinate steht in $f(x)$, nicht in $f'(x)$."},
{op:"Berechnen",q:"Der Graph von $f$ schließt mit der $x$-Achse im Intervall $[0;\\,3]$ eine Fläche ein. Berechnen Sie ihren Inhalt.",pts:4,mod:"Im Intervall $[0;\\,3]$ liegt der Graph oberhalb der $x$-Achse ($f(x)=x\\cdot(x-3)^{2}\\geq0$).\n$A=\\displaystyle\\int_{0}^{3}(x^{3}-6x^{2}+9x)\\,dx=\\left[\\dfrac{x^{4}}{4}-2x^{3}+\\dfrac{9}{2}x^{2}\\right]_{0}^{3}=\\dfrac{81}{4}-54+\\dfrac{81}{2}=\\dfrac{27}{4}$.",cr:[["Begründung, dass $f\\geq0$ im Intervall ist",1],["Stammfunktion korrekt",1],["Grenzen eingesetzt",1],["Ergebnis $\\frac{27}{4}=6{,}75$ Flächeneinheiten",1]],tip:"Ohne die Aussage über das Vorzeichen von $f$ fehlt die Begründung, warum das Integral der Flächeninhalt ist."}
]},
{id:"k8",a:"ana",te:"A",title:"Analysis ohne Hilfsmittel: Produkt mit e-Funktion",pts:10,min:20,intro:"Gegeben ist $f(x)=(x+1)\\cdot e^{-x}$ mit $x\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"fn",x:[-1.5,5],y:[-2.5,1.3],f:[{e:"(x+1)*exp(-x)",t:"f",lx:3.6}],p:[[0,1,"H","ur"]],cap:"Graph von $f$"},parts:[
{op:"Bestimmen",q:"Bestimmen Sie $f'(x)$ und vereinfachen Sie.",pts:2,mod:"Produktregel mit $u=x+1$ und $v=e^{-x}$:\n$f'(x)=1\\cdot e^{-x}+(x+1)\\cdot(-e^{-x})=e^{-x}\\cdot(1-x-1)=-x\\cdot e^{-x}$.",cr:[["Produktregel mit innerer Ableitung $-1$",1],["Zusammengefasst zu $-x\\cdot e^{-x}$",1]],tip:"Das Vorzeichen von $(e^{-x})'=-e^{-x}$ wird oft vergessen."},
{op:"Zeigen",q:"Zeigen Sie, dass der Graph von $f$ genau einen Extrempunkt hat, und bestimmen Sie dessen Art und Koordinaten.",pts:3,mod:"$f'(x)=-x\\cdot e^{-x}=0$ gilt nur für $x=0$, da $e^{-x}>0$ ist.\nFür $x<0$ ist $f'(x)>0$, für $x>0$ ist $f'(x)<0$. Das Vorzeichen wechselt von $+$ nach $-$: Hochpunkt.\n$f(0)=1$, also $H(0\\,|\\,1)$.",cr:[["$e^{-x}>0$ genutzt und $x=0$ als einzige Lösung",1],["Art über Vorzeichenwechsel von $f'$ begründet",1],["Koordinaten $H(0\\,|\\,1)$",1]],tip:"„Genau einen“ verlangt, dass du auch die Eindeutigkeit begründest."},
{op:"Zeigen",q:"Zeigen Sie, dass $F(x)=-(x+2)\\cdot e^{-x}$ eine Stammfunktion von $f$ ist.",pts:3,mod:"Produktregel: $F'(x)=-1\\cdot e^{-x}-(x+2)\\cdot(-e^{-x})=e^{-x}\\cdot(-1+x+2)=(x+1)\\cdot e^{-x}=f(x)$.",cr:[["$F$ mit der Produktregel abgeleitet",1],["Innere Ableitung bei $e^{-x}$ beachtet",1],["Ergebnis stimmt mit $f(x)$ überein (Schluss formuliert)",1]],tip:"Bei „Zeigen Sie“ muss am Ende die Gleichheit $F'(x)=f(x)$ ausdrücklich stehen."},
{op:"Berechnen",q:"Berechnen Sie $\\displaystyle\\int_{0}^{2}f(x)\\,dx$ und geben Sie das Ergebnis exakt an.",pts:2,mod:"$\\displaystyle\\int_{0}^{2}f(x)\\,dx=F(2)-F(0)=-4e^{-2}-(-2)=2-4e^{-2}\\approx1{,}46$.",cr:[["$F(2)-F(0)$ angesetzt",1],["Exaktes Ergebnis $2-4e^{-2}$",1]],tip:"$F(0)=-2$: Das Minuszeichen vor der Klammer beim Einsetzen beachten."}
]},
{id:"k9",a:"ana",te:"A",title:"Analysis ohne Hilfsmittel: Symmetrie und Tangente",pts:10,min:20,intro:"Gegeben ist $f(x)=x^{4}-4x^{2}$ mit $x\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"fn",x:[-2.4,2.4],y:[-5,8],f:[{e:"x**4-4*x**2",t:"f",lx:2.0},{e:"-4*x+1",t:"t",lx:-1.3,c:1}],p:[[1,-3,"P","dr"]],cap:"Graph von $f$ und die Tangente $t$ im Punkt $P$"},parts:[
{op:"Begründen",q:"Begründen Sie, dass der Graph von $f$ symmetrisch zur $y$-Achse ist.",pts:2,mod:"$f(-x)=(-x)^{4}-4\\cdot(-x)^{2}=x^{4}-4x^{2}=f(x)$ für alle $x\\in\\mathbb{R}$.\nAlso ist der Graph achsensymmetrisch zur $y$-Achse.",cr:[["$f(-x)$ korrekt berechnet",1],["$f(-x)=f(x)$ als Schluss auf die Symmetrie formuliert",1]],tip:"Nur auf „gerade Exponenten“ zu verweisen reicht nicht. Die Rechnung mit $f(-x)$ gehört dazu."},
{op:"Bestimmen",q:"Bestimmen Sie die Nullstellen von $f$.",pts:2,mod:"$f(x)=x^{2}\\cdot(x^{2}-4)=0$ ergibt $x=0$ (doppelt) oder $x^{2}=4$, also $x=\\pm2$.",cr:[["$x^{2}$ ausgeklammert",1],["Alle drei Nullstellen $x=-2$, $x=0$, $x=2$",1]],tip:"Die Nullstelle $x=0$ geht beim Teilen durch $x^{2}$ verloren. Besser ausklammern."},
{op:"Bestimmen",q:"Bestimmen Sie die Wendestellen von $f$.",pts:3,mod:"$f'(x)=4x^{3}-8x$ und $f''(x)=12x^{2}-8$.\n$f''(x)=0$ ergibt $x^{2}=\\dfrac{2}{3}$, also $x=\\pm\\sqrt{\\dfrac{2}{3}}$.\nWegen $f'''(x)=24x\\neq0$ an diesen Stellen sind es Wendestellen.",cr:[["$f''(x)=12x^{2}-8$",1],["Beide Lösungen $x=\\pm\\sqrt{\\frac{2}{3}}$",1],["Hinreichende Bedingung geprüft ($f'''\\neq0$)",1]],tip:"Eine Wendestelle braucht neben $f''(x)=0$ auch die hinreichende Bedingung."},
{op:"Bestimmen",q:"Bestimmen Sie die Gleichung der Tangente an den Graphen von $f$ im Punkt $P(1\\,|\\,-3)$.",pts:3,mod:"$f'(1)=4-8=-4$.\nTangente: $y=-4\\cdot(x-1)+(-3)=-4x+1$.",cr:[["Steigung $f'(1)=-4$",1],["Punkt-Steigungs-Form angesetzt",1],["Tangente $t(x)=-4x+1$",1]],tip:"Steigung und Punkt nicht verwechseln: $f'(1)$ ist die Steigung, $f(1)=-3$ der $y$-Wert."}
]},
{id:"k10",a:"geo",te:"A",title:"Geometrie ohne Hilfsmittel: Rechtwinkliges Dreieck",pts:10,min:20,intro:"Gegeben sind die Punkte $A(2\\,|\\,1\\,|\\,3)$, $B(4\\,|\\,3\\,|\\,2)$ und $C(4\\,|\\,0\\,|\\,5)$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",parts:[
{op:"Zeigen",q:"Zeigen Sie, dass das Dreieck $ABC$ bei $A$ einen rechten Winkel hat.",pts:2,mod:"$\\overrightarrow{AB}=\\begin{pmatrix}2\\\\2\\\\-1\\end{pmatrix}$ und $\\overrightarrow{AC}=\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}$.\n$\\overrightarrow{AB}\\cdot\\overrightarrow{AC}=4-2-2=0$. Also stehen die Vektoren senkrecht aufeinander.",cr:[["Verbindungsvektoren korrekt bestimmt",1],["Skalarprodukt $=0$ berechnet und gefolgert",1]],tip:"Verbindungsvektor immer „Spitze minus Fuß“: $\\overrightarrow{AB}=B-A$."},
{op:"Berechnen",q:"Berechnen Sie den Flächeninhalt des Dreiecks $ABC$.",pts:2,mod:"$|\\overrightarrow{AB}|=\\sqrt{4+4+1}=3$ und $|\\overrightarrow{AC}|=\\sqrt{4+1+4}=3$.\nWegen des rechten Winkels bei $A$ gilt $A_{\\Delta}=\\dfrac{1}{2}\\cdot3\\cdot3=\\dfrac{9}{2}$.",cr:[["Beide Seitenlängen berechnet",1],["Flächeninhalt $\\frac{9}{2}$ mit Begründung über den rechten Winkel",1]],tip:"Die Formel $\\frac12\\cdot g\\cdot h$ gilt hier nur wegen des rechten Winkels. Das erwähnen."},
{op:"Bestimmen",q:"Der Punkt $D$ ergänzt das Dreieck $ABC$ zu einem Quadrat $ABDC$. Bestimmen Sie die Koordinaten von $D$.",pts:2,mod:"$\\overrightarrow{OD}=\\overrightarrow{OB}+\\overrightarrow{AC}=\\begin{pmatrix}4\\\\3\\\\2\\end{pmatrix}+\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}=\\begin{pmatrix}6\\\\2\\\\4\\end{pmatrix}$.\nAlso $D(6\\,|\\,2\\,|\\,4)$.",cr:[["Ansatz $\\overrightarrow{OD}=\\overrightarrow{OB}+\\overrightarrow{AC}$ (oder gleichwertig)",1],["Koordinaten $D(6\\,|\\,2\\,|\\,4)$",1]],tip:""},
{op:"Bestimmen",q:"Bestimmen Sie eine Koordinatengleichung der Ebene $E$, die durch $A$, $B$ und $C$ verläuft.",pts:4,mod:"Normalenvektor $\\vec{n}=\\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}$ mit $\\vec{n}\\cdot\\overrightarrow{AB}=0$ und $\\vec{n}\\cdot\\overrightarrow{AC}=0$:\n$2a+2b-c=0$ und $2a-b+2c=0$. Subtraktion: $3b-3c=0$, also $b=c$. Mit $b=c=2$ folgt $a=-1$.\n$\\vec{n}=\\begin{pmatrix}-1\\\\2\\\\2\\end{pmatrix}$. Einsetzen von $A$: $-2+2+6=6$.\n$E:\\ -x_{1}+2x_{2}+2x_{3}=6$.\nProbe: $B$: $-4+6+4=6$ und $C$: $-4+0+10=6$.",cr:[["Ansatz $\\vec{n}\\cdot\\overrightarrow{AB}=0$ und $\\vec{n}\\cdot\\overrightarrow{AC}=0$",1],["LGS korrekt gelöst, Normalenvektor $\\begin{pmatrix}-1\\\\2\\\\2\\end{pmatrix}$ (oder Vielfaches)",1],["Konstante $6$ durch Einsetzen eines Punktes",1],["Probe mit $B$ und $C$ oder gleichwertige Kontrolle",1]],tip:"Ohne Probe verschenkt man leicht Punkte durch Vorzeichenfehler."}
]},
{id:"k11",a:"geo",te:"A",title:"Geometrie ohne Hilfsmittel: Ebene, Abstand, Gerade",pts:10,min:20,intro:"Gegeben sind die Ebene $E:\\ 2x_{1}-2x_{2}+x_{3}=9$, der Punkt $P(1\\,|\\,1\\,|\\,0)$ und die Gerade $g:\\ \\vec{x}=t\\cdot\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ mit $t\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",parts:[
{op:"Berechnen",q:"Berechnen Sie den Abstand des Punktes $P$ von der Ebene $E$.",pts:2,mod:"Mit $\\vec{n}=\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}$ und $|\\vec{n}|=3$ gilt $d=\\dfrac{|2\\cdot1-2\\cdot1+0-9|}{3}=\\dfrac{9}{3}=3$.",cr:[["Hessesche Normalenform bzw. Abstandsformel mit $|\\vec{n}|=3$ angesetzt",1],["Abstand $3$",1]],tip:"Der Betrag im Zähler und die Länge des Normalenvektors im Nenner nicht vergessen."},
{op:"Bestimmen",q:"Bestimmen Sie den Lotfußpunkt $F$ des Lotes von $P$ auf $E$.",pts:3,mod:"Lotgerade: $\\vec{x}=\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+s\\cdot\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}$.\nEinsetzen in $E$: $2\\cdot(1+2s)-2\\cdot(1-2s)+s=9$, also $9s=9$ und $s=1$.\n$F(3\\,|\\,-1\\,|\\,1)$. Probe: $6+2+1=9$.",cr:[["Lotgerade mit Richtungsvektor $\\vec{n}$ aufgestellt",1],["Einsetzen in $E$ und $s=1$",1],["Lotfußpunkt $F(3\\,|\\,-1\\,|\\,1)$",1]],tip:"Der Richtungsvektor der Lotgeraden ist der Normalenvektor der Ebene."},
{op:"Bestimmen",q:"Bestimmen Sie die Koordinaten des Punktes $P'$, der durch Spiegelung von $P$ an $E$ entsteht.",pts:2,mod:"$\\overrightarrow{OP'}=\\overrightarrow{OP}+2\\cdot\\overrightarrow{PF}=\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+2\\cdot\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}=\\begin{pmatrix}5\\\\-3\\\\2\\end{pmatrix}$.\nAlso $P'(5\\,|\\,-3\\,|\\,2)$.",cr:[["Ansatz mit $\\overrightarrow{PF}$ verdoppelt",1],["$P'(5\\,|\\,-3\\,|\\,2)$",1]],tip:""},
{op:"Zeigen",q:"Zeigen Sie, dass $g$ parallel zu $E$ verläuft und nicht in $E$ liegt. Berechnen Sie den Abstand von $g$ zu $E$.",pts:3,mod:"Richtungsvektor $\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ und Normalenvektor $\\begin{pmatrix}2\\\\-2\\\\1\\end{pmatrix}$: $2-4+2=0$. Also $g\\parallel E$.\nAufpunkt $O(0\\,|\\,0\\,|\\,0)$ erfüllt $0\\neq9$, daher liegt $g$ nicht in $E$.\nDer Abstand von $g$ zu $E$ ist der Abstand von $O$ zu $E$: $d=\\dfrac{9}{3}=3$.",cr:[["Skalarprodukt $=0$ gezeigt",1],["Punktprobe: Aufpunkt liegt nicht in $E$",1],["Abstand $3$",1]],tip:"Parallelität allein reicht nicht: Ob $g$ in $E$ liegt, muss mit einer Punktprobe geklärt werden."}
]},
{id:"k12",a:"geo",te:"A",title:"Geometrie ohne Hilfsmittel: Zwei Geraden",pts:10,min:20,intro:"Gegeben sind die Geraden $g:\\ \\vec{x}=\\begin{pmatrix}1\\\\2\\\\0\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\-1\\\\2\\end{pmatrix}$ und $h:\\ \\vec{x}=\\begin{pmatrix}1\\\\-1\\\\5\\end{pmatrix}+s\\cdot\\begin{pmatrix}2\\\\1\\\\-1\\end{pmatrix}$ mit $r,s\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",parts:[
{op:"Zeigen",q:"Zeigen Sie, dass sich $g$ und $h$ schneiden, und bestimmen Sie den Schnittpunkt $S$.",pts:3,mod:"Gleichsetzen: $1+r=1+2s$, $2-r=-1+s$, $2r=5-s$.\nAus der ersten Gleichung: $r=2s$. In die zweite: $2-2s=-1+s$, also $s=1$ und $r=2$.\nDritte Gleichung: $2\\cdot2=4=5-1$. Erfüllt, das LGS ist lösbar.\n$S(3\\,|\\,0\\,|\\,4)$.",cr:[["Gleichsetzen und LGS aufgestellt",1],["$r=2$ und $s=1$ bestimmt",1],["Probe in der dritten Gleichung und $S(3\\,|\\,0\\,|\\,4)$",1]],tip:"Die dritte Gleichung muss als Probe geprüft werden. Sonst ist der Schnitt nicht gezeigt."},
{op:"Berechnen",q:"Berechnen Sie den Schnittwinkel von $g$ und $h$.",pts:3,mod:"$\\cos\\varphi=\\dfrac{|\\vec{u}\\cdot\\vec{v}|}{|\\vec{u}|\\cdot|\\vec{v}|}=\\dfrac{|2-1-2|}{\\sqrt{6}\\cdot\\sqrt{6}}=\\dfrac{1}{6}$.\n$\\varphi=\\cos^{-1}\\left(\\dfrac{1}{6}\\right)\\approx80{,}4^{\\circ}$.",cr:[["Formel mit Betrag im Zähler",1],["Skalarprodukt und Längen korrekt",1],["$\\varphi\\approx80{,}4^{\\circ}$",1]],tip:"Ohne den Betrag im Zähler erhält man ggf. den stumpfen Winkel. Der Schnittwinkel ist höchstens $90^{\\circ}$."},
{op:"Bestimmen",q:"Der Punkt $Q(5\\,|\\,a\\,|\\,3)$ liegt auf $h$. Bestimmen Sie $a$.",pts:2,mod:"Erste Koordinate: $1+2s=5$ ergibt $s=2$.\nDann $a=-1+s=1$ und dritte Koordinate: $5-2=3$. Passt.",cr:[["Parameter $s=2$ aus einer Koordinate",1],["$a=1$ mit Kontrolle der dritten Koordinate",1]],tip:""},
{op:"Bestimmen",q:"Der Punkt $R(2\\,|\\,1\\,|\\,k)$ liegt auf $g$. Bestimmen Sie $k$.",pts:2,mod:"Erste Koordinate: $1+r=2$ ergibt $r=1$.\nZweite Koordinate: $2-1=1$. Passt. Dritte Koordinate: $k=2\\cdot1=2$.",cr:[["Parameter $r=1$ und zweite Koordinate geprüft",1],["$k=2$",1]],tip:""}
]},
{id:"k13",a:"sto",te:"A",title:"Stochastik ohne Hilfsmittel: Urne ohne Zurücklegen",pts:10,min:20,intro:"Eine Urne enthält 4 rote und 6 blaue Kugeln. Es werden zwei Kugeln nacheinander ohne Zurücklegen gezogen. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"tree",L1:[["R","4/10"],["B","6/10"]],L2:[[["R","3/9"],["B","6/9"]],[["R","4/9"],["B","5/9"]]],cap:"Baumdiagramm zum zweifachen Ziehen ohne Zurücklegen"},parts:[
{op:"Zeichnen",q:"Zeichnen Sie ein beschriftetes Baumdiagramm zu diesem Zufallsexperiment (siehe Skizze zur Kontrolle).",pts:2,mod:"Erste Stufe: $P(R)=\\dfrac{4}{10}$ und $P(B)=\\dfrac{6}{10}$.\nZweite Stufe nach $R$: $\\dfrac{3}{9}$ und $\\dfrac{6}{9}$. Zweite Stufe nach $B$: $\\dfrac{4}{9}$ und $\\dfrac{5}{9}$.",cr:[["Erste Stufe korrekt",1],["Zweite Stufe mit veränderten Anzahlen (ohne Zurücklegen)",1]],tip:"Ohne Zurücklegen ändern sich die Wahrscheinlichkeiten in der zweiten Stufe."},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass beide Kugeln die gleiche Farbe haben.",pts:2,mod:"$P=P(RR)+P(BB)=\\dfrac{4}{10}\\cdot\\dfrac{3}{9}+\\dfrac{6}{10}\\cdot\\dfrac{5}{9}=\\dfrac{12}{90}+\\dfrac{30}{90}=\\dfrac{42}{90}=\\dfrac{7}{15}$.",cr:[["Pfadregel und Summenregel (zwei Pfade)",1],["Ergebnis $\\frac{7}{15}$",1]],tip:""},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass mindestens eine rote Kugel gezogen wird.",pts:2,mod:"Gegenereignis „keine rote Kugel“: $P(BB)=\\dfrac{6}{10}\\cdot\\dfrac{5}{9}=\\dfrac{30}{90}=\\dfrac{1}{3}$.\n$P(\\text{mindestens eine rote})=1-\\dfrac{1}{3}=\\dfrac{2}{3}$.",cr:[["Gegenereignis erkannt",1],["Ergebnis $\\frac{2}{3}$",1]],tip:"Bei „mindestens“ ist fast immer das Gegenereignis der kürzere Weg."},
{op:"Bestimmen",q:"Die zweite gezogene Kugel ist blau. Bestimmen Sie die Wahrscheinlichkeit, dass die erste Kugel rot war.",pts:4,mod:"$P(B_2)=P(RB)+P(BB)=\\dfrac{4}{10}\\cdot\\dfrac{6}{9}+\\dfrac{6}{10}\\cdot\\dfrac{5}{9}=\\dfrac{24}{90}+\\dfrac{30}{90}=\\dfrac{54}{90}=\\dfrac{3}{5}$.\n$P_{B_2}(R_1)=\\dfrac{P(R_1\\cap B_2)}{P(B_2)}=\\dfrac{24/90}{54/90}=\\dfrac{4}{9}$.",cr:[["Bedingte Wahrscheinlichkeit $P_{B_2}(R_1)$ richtig angesetzt",1],["$P(B_2)=\\frac{3}{5}$ über beide Pfade",1],["$P(R_1\\cap B_2)=\\frac{24}{90}$",1],["Ergebnis $\\frac{4}{9}$",1]],tip:"Die Bedingung steht im Nenner: Es wird durch die Wahrscheinlichkeit des bekannten Ereignisses geteilt."}
]},
{id:"k14",a:"sto",te:"A",title:"Stochastik ohne Hilfsmittel: Elfmeterschießen",pts:10,min:20,intro:"Ein Spieler trifft bei einem Elfmeter mit der Wahrscheinlichkeit $p=0{,}7$. Er schießt zehnmal, die Schüsse sind voneinander unabhängig. $X$ ist die Anzahl der Treffer. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"bars",n:10,p:0.7,from:2,to:10,hi:[7],cap:"Verteilung von $X$ (Histogramm, $k=7$ hervorgehoben)"},parts:[
{op:"Angeben",q:"Geben Sie einen Term an, mit dem die Wahrscheinlichkeit für genau 7 Treffer berechnet werden kann.",pts:2,mod:"$X$ ist binomialverteilt mit $n=10$ und $p=0{,}7$.\n$P(X=7)=\\dbinom{10}{7}\\cdot0{,}7^{7}\\cdot0{,}3^{3}$.",cr:[["Binomialverteilung mit $n=10$, $p=0{,}7$ erkannt",1],["Term mit Binomialkoeffizient und beiden Potenzen",1]],tip:"Die Exponenten müssen zusammen $n=10$ ergeben: $7+3$."},
{op:"Angeben",q:"Geben Sie einen Term für die Wahrscheinlichkeit von mindestens 9 Treffern an.",pts:2,mod:"$P(X\\geq9)=P(X=9)+P(X=10)=\\dbinom{10}{9}\\cdot0{,}7^{9}\\cdot0{,}3+0{,}7^{10}$.",cr:[["Zwei Fälle $X=9$ und $X=10$",1],["Beide Terme korrekt",1]],tip:"„Mindestens 9“ heißt 9 oder 10, nicht nur 9."},
{op:"Berechnen",q:"Berechnen Sie den Erwartungswert und die Standardabweichung von $X$. Die Wurzel darf stehen bleiben.",pts:2,mod:"$\\mu=n\\cdot p=10\\cdot0{,}7=7$.\n$\\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}=\\sqrt{10\\cdot0{,}7\\cdot0{,}3}=\\sqrt{2{,}1}$.",cr:[["$\\mu=7$",1],["$\\sigma=\\sqrt{2{,}1}$",1]],tip:""},
{op:"Bestimmen",q:"Der Spieler möchte mit mindestens $99\\,\\%$ Wahrscheinlichkeit wenigstens einmal treffen. Stellen Sie dazu eine Ungleichung auf und bestimmen Sie die kleinste Anzahl $n$ an Schüssen, ohne den Taschenrechner zu verwenden.",pts:4,mod:"Gegenereignis „kein Treffer“: $P(X\\geq1)=1-0{,}3^{n}\\geq0{,}99$, also $0{,}3^{n}\\leq0{,}01$.\n$0{,}3^{3}=0{,}027>0{,}01$ und $0{,}3^{4}=0{,}0081\\leq0{,}01$.\nDa $0{,}3^{n}$ mit wachsendem $n$ fällt, genügen $n=4$ Schüsse.",cr:[["Ansatz über das Gegenereignis $1-0{,}3^{n}$",1],["Ungleichung $0{,}3^{n}\\leq0{,}01$",1],["$n=3$ und $n=4$ von Hand überprüft",1],["Ergebnis $n=4$ mit Begründung der Monotonie",1]],tip:"Bei „kleinste Anzahl“ muss auch der Wert davor als nicht ausreichend gezeigt werden."}
]},
{id:"k15",a:"sto",te:"A",title:"Stochastik ohne Hilfsmittel: Vierfeldertafel",pts:10,min:20,intro:"An einer Schule gilt: $55\\,\\%$ der Schüler sind weiblich ($F$), $40\\,\\%$ sind in einem Sportverein ($S$). $18\\,\\%$ aller Schüler sind weiblich und in einem Sportverein. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",parts:[
{op:"Vervollständigen",q:"Stellen Sie eine vollständige Vierfeldertafel auf.",pts:3,mod:"$P(F)=0{,}55$, $P(\\overline{F})=0{,}45$, $P(S)=0{,}40$, $P(\\overline{S})=0{,}60$.\n$P(F\\cap S)=0{,}18$, daher $P(F\\cap\\overline{S})=0{,}55-0{,}18=0{,}37$.\n$P(\\overline{F}\\cap S)=0{,}40-0{,}18=0{,}22$ und $P(\\overline{F}\\cap\\overline{S})=0{,}45-0{,}22=0{,}23$.",cr:[["Randwerte mit Gegenwahrscheinlichkeiten",1],["Zwei Felder aus Differenzen ($0{,}37$ und $0{,}22$)",1],["Letztes Feld $0{,}23$ und Summenprobe",1]],tip:"Zeilen- und Spaltensummen kontrollieren: Alles muss zusammen $1$ ergeben."},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass ein weiblicher Schüler in einem Sportverein ist.",pts:2,mod:"$P_F(S)=\\dfrac{P(F\\cap S)}{P(F)}=\\dfrac{0{,}18}{0{,}55}=\\dfrac{18}{55}\\approx0{,}33$.",cr:[["Formel für die bedingte Wahrscheinlichkeit mit $P(F)$ im Nenner",1],["Ergebnis $\\frac{18}{55}\\approx0{,}33$",1]],tip:"Die Bedingung (weiblich) steht im Nenner."},
{op:"Untersuchen",q:"Untersuchen Sie, ob die Ereignisse $F$ und $S$ stochastisch unabhängig sind.",pts:3,mod:"Unabhängigkeit bedeutet $P(F\\cap S)=P(F)\\cdot P(S)$.\n$P(F)\\cdot P(S)=0{,}55\\cdot0{,}40=0{,}22$, aber $P(F\\cap S)=0{,}18$.\nDie Werte sind verschieden, also sind $F$ und $S$ nicht stochastisch unabhängig.",cr:[["Kriterium $P(F\\cap S)=P(F)\\cdot P(S)$ genannt",1],["Beide Seiten berechnet",1],["Schluss „nicht unabhängig“ formuliert",1]],tip:"Das Kriterium muss genannt werden. Nur die Zahlen zu vergleichen reicht nicht."},
{op:"Berechnen",q:"Es werden 100 Schüler zufällig ausgewählt. Berechnen Sie den Erwartungswert und die Standardabweichung der Anzahl der Schüler im Sportverein (Wurzel darf stehen bleiben).",pts:2,mod:"Anzahl ist binomialverteilt mit $n=100$ und $p=0{,}4$.\n$\\mu=100\\cdot0{,}4=40$ und $\\sigma=\\sqrt{100\\cdot0{,}4\\cdot0{,}6}=\\sqrt{24}$.",cr:[["$\\mu=40$",1],["$\\sigma=\\sqrt{24}$",1]],tip:""}
]},

/* ================= Teil B: mit Hilfsmittel  ================= */
{id:"k16",a:"ana",te:"B",title:"Analysis mit Hilfsmittel: Zufluss in einen Teich",pts:15,min:45,intro:"In einen Teich fließt Wasser. Für $0\\leq t\\leq12$ wird die Zuflussrate durch $f(t)=8t\\cdot e^{-0{,}4t}$ beschrieben ($t$ in Stunden, $f(t)$ in $\\frac{m^{3}}{h}$). Zu Beginn ($t=0$) enthält der Teich $10\\,m^{3}$ Wasser.",g:{k:"fn",x:[0,12],y:[0,9],f:[{e:"8*x*exp(-0.4*x)",t:"f",lx:9.5}],hl:[3],p:[[2.5,7.358,"H","ur"]],cap:"Zuflussrate $f$ in $\\frac{m^{3}}{h}$, gestrichelt: $3$"},parts:[
{op:"Zeigen",q:"Zeigen Sie, dass die Zuflussrate zur Zeit $t=2{,}5$ maximal ist, und geben Sie den maximalen Wert an.",pts:3,mod:"$f'(t)=8\\cdot e^{-0{,}4t}\\cdot(1-0{,}4t)$. Mit $e^{-0{,}4t}>0$ folgt $f'(t)=0$ für $t=2{,}5$.\nFür $t<2{,}5$ ist $f'>0$, für $t>2{,}5$ ist $f'<0$: Hochpunkt. Randwerte: $f(0)=0$ und $f(12)\\approx0{,}8$, kleiner als $f(2{,}5)$.\n$f(2{,}5)=20\\cdot e^{-1}\\approx7{,}36\\ \\dfrac{m^{3}}{h}$.",cr:[["$f'(t)$ mit Produkt- und Kettenregel",1],["$t=2{,}5$ und Art (Vorzeichenwechsel) begründet",1],["Maximalwert $\\approx7{,}36\\ \\frac{m^{3}}{h}$ mit Einheit",1]],tip:"Bei Intervallaufgaben auch die Randwerte vergleichen. Hier sind sie kleiner."},
{op:"Berechnen",q:"Berechnen Sie, wie viel Wasser in den ersten 5 Stunden zufließt.",pts:3,mod:"$\\displaystyle\\int_{0}^{5}8t\\cdot e^{-0{,}4t}\\,dt=\\left[-8\\cdot(2{,}5t+6{,}25)\\cdot e^{-0{,}4t}\\right]_{0}^{5}=50-150e^{-2}\\approx29{,}70$.\nIn den ersten 5 Stunden fließen etwa $29{,}7\\,m^{3}$ zu.",cr:[["Integral der Zuflussrate angesetzt",1],["Stammfunktion bzw. Rechnung korrekt",1],["Ergebnis $\\approx29{,}7\\,m^{3}$ mit Einheit",1]],tip:"Das Integral einer Rate ist eine Menge. Die Einheit ist $m^{3}$, nicht $\\frac{m^{3}}{h}$."},
{op:"Bestimmen",q:"Bestimmen Sie den Zeitpunkt, zu dem die Zuflussrate am stärksten abnimmt, und die zugehörige Änderungsrate.",pts:4,mod:"$f''(t)=8\\cdot e^{-0{,}4t}\\cdot(0{,}16t-0{,}8)$.\n$f''(t)=0$ ergibt $t=5$. Für $t<5$ ist $f''<0$, für $t>5$ ist $f''>0$. Also hat $f'$ bei $t=5$ ein Minimum.\nDie Änderungsrate ist $f'(5)=-8e^{-2}\\approx-1{,}08\\ \\dfrac{m^{3}}{h^{2}}$. Die Randwerte $f'(0)=8$ und $f'(12)\\approx-0{,}25$ sind größer.",cr:[["$f''(t)$ korrekt",1],["$t=5$ bestimmt",1],["Art begründet: $f'$ hat dort ein Minimum",1],["$f'(5)\\approx-1{,}08$ (stärkste Abnahme)",1]],tip:"Die „stärkste Abnahme von $f$“ ist das Minimum von $f'$, also eine Wendestelle von $f$. Nicht $f'$ und $f''$ verwechseln."},
{op:"Bestimmen",q:"Zusätzlich fließen ständig $3\\,\\frac{m^{3}}{h}$ aus dem Teich ab. Bestimmen Sie, zu welchem Zeitpunkt der Teich am meisten Wasser enthält, und wie viel Wasser dann enthalten ist.",pts:5,mod:"Wassermenge: $B(t)=10+\\displaystyle\\int_{0}^{t}f(u)\\,du-3t$ mit $B'(t)=f(t)-3$.\n$f(t)=3$ hat die Lösungen $t_{1}\\approx0{,}45$ und $t_{2}\\approx7{,}48$.\nFür $t<t_{1}$ ist $B'<0$, zwischen $t_{1}$ und $t_{2}$ ist $B'>0$, danach wieder $B'<0$. Bei $t_{2}$ liegt ein lokales Maximum.\nRandwerte: $B(0)=10$ und $B(12)\\approx21{,}6$. Beide sind kleiner als $B(t_{2})\\approx27{,}54$.\nNach etwa $7{,}48$ Stunden ist der Teich am vollsten, mit etwa $27{,}5\\,m^{3}$.",cr:[["Ansatz: $B(t)$ bzw. $B'(t)=f(t)-3$",1],["Beide Lösungen von $f(t)=3$ bestimmt",1],["Art über das Vorzeichen von $B'$ begründet (Maximum bei $t_{2}$)",1],["Randwerte verglichen",1],["$t\\approx7{,}48\\,h$ und $B\\approx27{,}5\\,m^{3}$",1]],tip:"Die Gleichung $f(t)=3$ hat zwei Lösungen. Nur eine ist das Maximum. Die andere ist ein Minimum."}
]},
{id:"k17",a:"ana",te:"B",title:"Analysis mit Hilfsmittel: Funktionenschar mit Ortskurve",pts:15,min:45,intro:"Für jedes $a>0$ ist die Funktion $f_{a}$ gegeben durch $f_{a}(x)=x\\cdot e^{-ax}$ mit $x\\in\\mathbb{R}$.",g:{k:"fn",x:[-0.5,6],y:[-1.5,1],f:[{e:"x*exp(-0.5*x)",t:"a=0,5",lx:5.2},{e:"x*exp(-x)",t:"a=1",lx:3.3},{e:"x*exp(-2*x)",t:"a=2",lx:1.2}],cap:"Graphen von $f_{a}$ für $a=0{,}5$, $a=1$ und $a=2$"},parts:[
{op:"Untersuchen",q:"Untersuchen Sie $f_{a}$ auf Nullstellen und auf das Verhalten für $x\\to\\infty$ und $x\\to-\\infty$.",pts:3,mod:"$f_{a}(x)=0$ ergibt $x=0$, da $e^{-ax}>0$ ist. Einzige Nullstelle: $x=0$.\n$x\\to\\infty$: $e^{-ax}$ fällt schneller, als $x$ wächst, also $f_{a}(x)\\to0$.\n$x\\to-\\infty$: $x\\to-\\infty$ und $e^{-ax}\\to\\infty$, also $f_{a}(x)\\to-\\infty$.",cr:[["Nullstelle $x=0$ mit Begründung $e^{-ax}>0$",1],["$x\\to\\infty$: Grenzwert $0$ begründet",1],["$x\\to-\\infty$: Grenzwert $-\\infty$ begründet",1]],tip:"Bei $x\\to\\infty$ nicht einfach „$\\infty\\cdot0$“ schreiben, sondern mit dem Wachstumsvergleich begründen."},
{op:"Bestimmen",q:"Bestimmen Sie die Koordinaten des Hochpunktes $H_{a}$ des Graphen von $f_{a}$ in Abhängigkeit von $a$.",pts:4,mod:"$f_{a}'(x)=(1-ax)\\cdot e^{-ax}$ und $f_{a}''(x)=(a^{2}x-2a)\\cdot e^{-ax}$.\n$f_{a}'(x)=0$ ergibt $x=\\dfrac{1}{a}$. $f_{a}''\\left(\\dfrac{1}{a}\\right)=-a\\cdot e^{-1}<0$: Hochpunkt.\n$f_{a}\\left(\\dfrac{1}{a}\\right)=\\dfrac{1}{a}\\cdot e^{-1}$, also $H_{a}\\left(\\dfrac{1}{a}\\,\\Big|\\,\\dfrac{1}{a\\cdot e}\\right)$.",cr:[["$f_{a}'(x)=(1-ax)e^{-ax}$",1],["$x=\\frac{1}{a}$",1],["Art über $f_{a}''$ begründet",1],["$y$-Wert $\\frac{1}{ae}$",1]],tip:"Der Parameter $a$ wird wie eine Zahl behandelt. Er darf in der Lösung stehen bleiben."},
{op:"Bestimmen",q:"Alle Hochpunkte $H_{a}$ liegen auf einer Kurve. Bestimmen Sie deren Gleichung.",pts:3,mod:"$x=\\dfrac{1}{a}$ ergibt $a=\\dfrac{1}{x}$. Einsetzen in $y=\\dfrac{1}{a\\cdot e}$: $y=\\dfrac{x}{e}$.\nDie Ortskurve ist die Halbgerade $y=\\dfrac{1}{e}\\cdot x$ mit $x>0$.",cr:[["Koordinaten $x$ und $y$ als Funktion von $a$ notiert",1],["Parameter $a$ eliminiert",1],["Gleichung $y=\\frac{x}{e}$ mit Bereich $x>0$",1]],tip:"Der Bereich ($x>0$, weil $a>0$) gehört zur Ortskurve dazu."},
{op:"Bestimmen",q:"Bestimmen Sie die Wendestelle von $f_{a}$.",pts:2,mod:"$f_{a}''(x)=0$ ergibt $a^{2}x-2a=0$, also $x=\\dfrac{2}{a}$.\nDas Vorzeichen von $f_{a}''$ wechselt dort von $-$ nach $+$, also liegt eine Wendestelle vor.",cr:[["$f_{a}''(x)=0$ gelöst: $x=\\frac{2}{a}$",1],["Vorzeichenwechsel von $f_{a}''$ bzw. $f_{a}'''\\neq0$ genannt",1]],tip:""},
{op:"Bestimmen",q:"Für $a=1$ schließt der Graph von $f_{1}$ mit der $x$-Achse und der Geraden $x=b$ ($b>0$) eine Fläche ein. Bestimmen Sie $b$ so, dass der Flächeninhalt $0{,}9$ beträgt.",pts:3,mod:"$A(b)=\\displaystyle\\int_{0}^{b}x\\cdot e^{-x}\\,dx=\\left[-(x+1)\\cdot e^{-x}\\right]_{0}^{b}=1-(b+1)\\cdot e^{-b}$.\n$1-(b+1)\\cdot e^{-b}=0{,}9$ ergibt $(b+1)\\cdot e^{-b}=0{,}1$. Numerisch: $b\\approx3{,}89$.",cr:[["Flächeninhalt als Integral mit Stammfunktion",1],["Gleichung $1-(b+1)e^{-b}=0{,}9$ aufgestellt",1],["$b\\approx3{,}89$",1]],tip:"Gleichungen mit $b$ im Exponenten und davor lösen nur Näherungsverfahren. Das Verfahren in der Lösung nennen."}
]},
{id:"k18",a:"ana",te:"B",title:"Analysis mit Hilfsmittel: Gezeiten",pts:15,min:45,intro:"Der Wasserstand in einem Hafen wird für $0\\leq t\\leq12$ durch $h(t)=3+1{,}5\\cdot\\sin\\left(\\dfrac{\\pi}{6}\\cdot t\\right)$ beschrieben ($t$ in Stunden, $h(t)$ in Metern). Es wird im Bogenmaß gerechnet.",g:{k:"fn",x:[0,12],y:[0,5.2],f:[{e:"3+1.5*sin(PI*x/6)",t:"h",lx:9.5}],hl:[4,3.5],cap:"Wasserstand $h$ in Metern, gestrichelt: $4\\,m$ und $3{,}5\\,m$"},parts:[
{op:"Angeben",q:"Geben Sie den höchsten und den niedrigsten Wasserstand an.",pts:2,mod:"Die Funktion schwankt um die Mittellage $3$ mit der Amplitude $1{,}5$.\nHöchster Wasserstand: $4{,}5\\,m$. Niedrigster Wasserstand: $1{,}5\\,m$.",cr:[["Höchster Wasserstand $4{,}5\\,m$",1],["Niedrigster Wasserstand $1{,}5\\,m$",1]],tip:"Mittellage plus bzw. minus Amplitude. Einheit nicht vergessen."},
{op:"Berechnen",q:"Berechnen Sie, zu welchen Zeitpunkten im Intervall $0\\leq t\\leq12$ der Wasserstand $4\\,m$ beträgt.",pts:4,mod:"$3+1{,}5\\cdot\\sin\\left(\\dfrac{\\pi}{6}t\\right)=4$ ergibt $\\sin\\left(\\dfrac{\\pi}{6}t\\right)=\\dfrac{2}{3}$.\nErste Lösung: $\\dfrac{\\pi}{6}t=\\sin^{-1}\\left(\\dfrac{2}{3}\\right)\\approx0{,}7297$, also $t\\approx1{,}39$.\nZweite Lösung (Symmetrie der Sinuskurve): $\\dfrac{\\pi}{6}t=\\pi-0{,}7297\\approx2{,}4119$, also $t\\approx4{,}61$.\nDie nächsten Lösungen liegen erst bei $t>12$.",cr:[["Gleichung nach $\\sin(\\ldots)=\\frac{2}{3}$ umgestellt",1],["Erste Lösung $t\\approx1{,}39$",1],["Zweite Lösung über $\\pi-x$ gefunden",1],["Zweite Lösung $t\\approx4{,}61$ und Intervall geprüft",1]],tip:"Die Sinusgleichung hat im Intervall zwei Lösungen. Die zweite ist ein beliebter Punktverlust."},
{op:"Bestimmen",q:"Bestimmen Sie die maximale Änderungsrate des Wasserstandes und geben Sie einen Zeitpunkt an, zu dem sie auftritt.",pts:3,mod:"$h'(t)=1{,}5\\cdot\\dfrac{\\pi}{6}\\cdot\\cos\\left(\\dfrac{\\pi}{6}t\\right)=\\dfrac{\\pi}{4}\\cdot\\cos\\left(\\dfrac{\\pi}{6}t\\right)$.\nDer Kosinus ist höchstens $1$, also ist die maximale Änderungsrate $\\dfrac{\\pi}{4}\\approx0{,}79\\ \\dfrac{m}{h}$. Sie tritt z. B. bei $t=0$ und $t=12$ auf.",cr:[["$h'(t)$ mit innerer Ableitung $\\frac{\\pi}{6}$",1],["Maximum des Kosinus als Begründung",1],["Wert $\\frac{\\pi}{4}\\approx0{,}79\\ \\frac{m}{h}$ und Zeitpunkt",1]],tip:"Die innere Ableitung $\\frac{\\pi}{6}$ vergisst man leicht."},
{op:"Berechnen",q:"Berechnen Sie die mittlere Wasserhöhe im Zeitraum $0\\leq t\\leq6$.",pts:3,mod:"$\\bar{h}=\\dfrac{1}{6-0}\\displaystyle\\int_{0}^{6}h(t)\\,dt=\\dfrac{1}{6}\\cdot\\left[3t-\\dfrac{9}{\\pi}\\cdot\\cos\\left(\\dfrac{\\pi}{6}t\\right)\\right]_{0}^{6}=\\dfrac{1}{6}\\cdot\\left(18+\\dfrac{18}{\\pi}\\right)=3+\\dfrac{3}{\\pi}\\approx3{,}95$.\nDie mittlere Wasserhöhe beträgt etwa $3{,}95\\,m$.",cr:[["Mittelwertformel mit Faktor $\\frac{1}{b-a}$",1],["Integral korrekt berechnet",1],["Ergebnis $\\approx3{,}95\\,m$ mit Einheit",1]],tip:"Den Faktor $\\frac{1}{b-a}$ nicht vergessen, sonst erhält man nur die Fläche."},
{op:"Bestimmen",q:"Ein Schiff darf nur einlaufen, wenn der Wasserstand mindestens $3{,}5\\,m$ beträgt. Bestimmen Sie, wie lange pro Tide (Periode) das Schiff einlaufen darf.",pts:3,mod:"$h(t)\\geq3{,}5$ ergibt $\\sin\\left(\\dfrac{\\pi}{6}t\\right)\\geq\\dfrac{1}{3}$.\nGrenzen: $t_{1}=\\dfrac{6}{\\pi}\\cdot\\sin^{-1}\\left(\\dfrac{1}{3}\\right)\\approx0{,}65$ und $t_{2}=6-t_{1}\\approx5{,}35$.\nDauer: $t_{2}-t_{1}\\approx4{,}70$ Stunden.",cr:[["Ungleichung $\\sin(\\ldots)\\geq\\frac{1}{3}$",1],["Beide Grenzen $0{,}65$ und $5{,}35$",1],["Dauer $\\approx4{,}70\\,h$",1]],tip:"Bei Ungleichungen mit Sinus liegt der gesuchte Bereich zwischen den beiden Lösungen der zugehörigen Gleichung."}
]},
{id:"k19",a:"geo",te:"B",title:"Geometrie mit Hilfsmittel: Haus mit Satteldach",pts:15,min:45,intro:"Ein Haus hat eine rechteckige Grundfläche $ABCD$ mit $A(0\\,|\\,0\\,|\\,0)$, $B(8\\,|\\,0\\,|\\,0)$, $C(8\\,|\\,6\\,|\\,0)$ und $D(0\\,|\\,6\\,|\\,0)$. Die Wände sind $3\\,m$ hoch: $E(0\\,|\\,0\\,|\\,3)$, $F(8\\,|\\,0\\,|\\,3)$, $G(8\\,|\\,6\\,|\\,3)$ und $H(0\\,|\\,6\\,|\\,3)$. Der Dachfirst liegt zwischen $P(0\\,|\\,3\\,|\\,5)$ und $Q(8\\,|\\,3\\,|\\,5)$. Eine Längeneinheit entspricht $1\\,m$.",g:{k:"solid",V:{A:[0,0,0],B:[0,8,0],C:[6,8,0],D:[6,0,0],E:[0,0,3],F:[0,8,3],G:[6,8,3],H:[6,0,3],P:[3,0,5],Q:[3,8,5]},E:[["A","B"],["B","C"],["C","D",1],["D","A",1],["A","E"],["B","F"],["C","G"],["D","H",1],["E","F"],["F","G"],["G","H"],["H","E"],["P","Q"],["E","P"],["F","Q"],["G","Q"],["H","P"]],lab:{A:"dl",B:"dr",C:"dr",D:"ur",E:"dl",F:"dr",G:"dr",H:"ur",P:"ul",Q:"ur"},face:["E","F","Q","P"],cap:"Haus mit Satteldach, die vordere Dachfläche $EFQP$ ist hervorgehoben"},parts:[
{op:"Zeigen",q:"Zeigen Sie, dass die vordere Dachfläche $EFQP$ ein Rechteck ist.",pts:3,mod:"$\\overrightarrow{EF}=\\begin{pmatrix}8\\\\0\\\\0\\end{pmatrix}$, $\\overrightarrow{PQ}=\\begin{pmatrix}8\\\\0\\\\0\\end{pmatrix}$. Also $\\overrightarrow{EF}=\\overrightarrow{PQ}$: Das Viereck ist ein Parallelogramm.\n$\\overrightarrow{EP}=\\begin{pmatrix}0\\\\3\\\\2\\end{pmatrix}$ und $\\overrightarrow{EF}\\cdot\\overrightarrow{EP}=0+0+0=0$.\nEin Parallelogramm mit einem rechten Winkel ist ein Rechteck.",cr:[["Gegenseitenvektoren gleich: Parallelogramm",1],["Skalarprodukt $\\overrightarrow{EF}\\cdot\\overrightarrow{EP}=0$",1],["Schluss auf Rechteck formuliert",1]],tip:"Für ein Rechteck genügt „Parallelogramm plus ein rechter Winkel“. Alle vier Winkel zu prüfen ist nicht nötig."},
{op:"Bestimmen",q:"Bestimmen Sie eine Koordinatengleichung der Ebene $E_{D}$, in der die Dachfläche $EFQP$ liegt.",pts:3,mod:"Richtungsvektoren: $\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ und $\\overrightarrow{EP}=\\begin{pmatrix}0\\\\3\\\\2\\end{pmatrix}$. Normalenvektor $\\vec{n}=\\begin{pmatrix}0\\\\b\\\\c\\end{pmatrix}$ mit $3b+2c=0$: $\\vec{n}=\\begin{pmatrix}0\\\\-2\\\\3\\end{pmatrix}$.\nEinsetzen von $E(0\\,|\\,0\\,|\\,3)$: $9$.\n$E_{D}:\\ -2x_{2}+3x_{3}=9$. Probe mit $Q$: $-6+15=9$.",cr:[["Zwei Richtungsvektoren der Ebene",1],["Normalenvektor $\\begin{pmatrix}0\\\\-2\\\\3\\end{pmatrix}$ (oder Vielfaches)",1],["Gleichung $-2x_{2}+3x_{3}=9$ mit Probe",1]],tip:"Die Probe immer hinschreiben."},
{op:"Berechnen",q:"Berechnen Sie den Neigungswinkel der Dachfläche gegen die Waagerechte.",pts:3,mod:"Die Waagerechte hat den Normalenvektor $\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$.\n$\\cos\\alpha=\\dfrac{|\\vec{n}\\cdot\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}|}{|\\vec{n}|\\cdot1}=\\dfrac{3}{\\sqrt{13}}$, also $\\alpha\\approx33{,}7^{\\circ}$.\nKontrolle: Die Dachfläche steigt $2\\,m$ auf $3\\,m$ Breite: $\\tan\\alpha=\\dfrac{2}{3}$.",cr:[["Winkel zwischen den Normalenvektoren angesetzt",1],["$\\cos\\alpha=\\frac{3}{\\sqrt{13}}$",1],["$\\alpha\\approx33{,}7^{\\circ}$",1]],tip:"Der Winkel zwischen den Normalenvektoren ist hier der Neigungswinkel der Ebenen. Betrag im Zähler nicht vergessen."},
{op:"Bestimmen",q:"Im Mittelpunkt $M$ der Dachfläche $EFQP$ steht senkrecht zur Dachfläche eine $1{,}5\\,m$ lange Antenne, die vom Haus weg zeigt. Bestimmen Sie die Koordinaten der Antennenspitze.",pts:4,mod:"$M$ ist der Mittelpunkt der Diagonale $FP$: $M(4\\,|\\,1{,}5\\,|\\,4)$.\nDie Antenne zeigt in Richtung von $\\vec{n}=\\begin{pmatrix}0\\\\-2\\\\3\\end{pmatrix}$ (nach vorn und oben, vom Haus weg).\nEinheitsvektor: $\\vec{n}_{0}=\\dfrac{1}{\\sqrt{13}}\\cdot\\begin{pmatrix}0\\\\-2\\\\3\\end{pmatrix}$.\nSpitze: $\\overrightarrow{OS}=\\overrightarrow{OM}+1{,}5\\cdot\\vec{n}_{0}\\approx\\begin{pmatrix}4\\\\0{,}67\\\\5{,}25\\end{pmatrix}$.",cr:[["Mittelpunkt $M(4\\,|\\,1{,}5\\,|\\,4)$",1],["Richtung: Normalenvektor mit der richtigen Orientierung (vom Haus weg)",1],["Normierung auf Länge $1{,}5$",1],["Spitze $S(4\\,|\\,0{,}67\\,|\\,5{,}25)$",1]],tip:"Die Richtung des Normalenvektors prüfen: Eine Antenne, die durchs Dach ins Haus zeigt, ist falsch."},
{op:"Berechnen",q:"Berechnen Sie den Flächeninhalt der vorderen Dachfläche.",pts:2,mod:"$|\\overrightarrow{EF}|=8$ und $|\\overrightarrow{EP}|=\\sqrt{0+9+4}=\\sqrt{13}$.\n$A=8\\cdot\\sqrt{13}\\approx28{,}84\\,m^{2}$.",cr:[["Beide Seitenlängen $8$ und $\\sqrt{13}$",1],["Flächeninhalt $\\approx28{,}84\\,m^{2}$ mit Einheit",1]],tip:"Nicht die Grundfläche $8\\cdot3$ nehmen. Die Dachfläche ist wegen der Neigung größer."}
]},
{id:"k20",a:"geo",te:"B",title:"Geometrie mit Hilfsmittel: Flugbahnen",pts:15,min:45,intro:"Zwei Flugzeuge bewegen sich geradlinig. Die Koordinaten sind in Kilometern angegeben, $x_{3}$ ist die Höhe über dem Boden ($x_{3}=0$), $t$ in Minuten. Flugzeug $A$ bewegt sich auf $g:\\ \\vec{x}=\\begin{pmatrix}-4\\\\-2\\\\3\\end{pmatrix}+t\\cdot\\begin{pmatrix}2\\\\1\\\\-0{,}5\\end{pmatrix}$, Flugzeug $B$ auf $h:\\ \\vec{x}=\\begin{pmatrix}-2\\\\-3\\\\1{,}5\\end{pmatrix}+t\\cdot\\begin{pmatrix}2\\\\2\\\\0\\end{pmatrix}$ ($t\\geq0$).",parts:[
{op:"Zeigen",q:"Zeigen Sie, dass sich die Flugbahnen $g$ und $h$ in einem Punkt $S$ schneiden, und geben Sie $S$ an.",pts:3,mod:"Gleichsetzen mit verschiedenen Parametern $r$ (für $g$) und $s$ (für $h$):\n$-4+2r=-2+2s$, $-2+r=-3+2s$, $3-0{,}5r=1{,}5$.\nDritte Gleichung: $r=3$. Erste: $2=-2+2s$, also $s=2$. Zweite: $-2+3=1$ und $-3+4=1$. Passt.\n$S(2\\,|\\,1\\,|\\,1{,}5)$. $A$ erreicht $S$ bei $t=3$, $B$ bei $t=2$.",cr:[["Parameter getrennt benannt und LGS aufgestellt",1],["Lösung $r=3$, $s=2$ mit Probe in allen drei Gleichungen",1],["$S(2\\,|\\,1\\,|\\,1{,}5)$",1]],tip:"Zum Schneiden braucht man zwei verschiedene Parameter. Nur bei gleichem Parameter wäre es eine Kollision."},
{op:"Beurteilen",q:"Beurteilen Sie, ob die Flugzeuge zusammenstoßen, wenn beide gleichzeitig starten.",pts:2,mod:"Flugzeug $A$ ist bei $S$ zur Zeit $t=3$, Flugzeug $B$ aber schon bei $t=2$.\nDie Flugzeuge sind nie gleichzeitig in $S$. Es gibt keinen Zusammenstoß.",cr:[["Verschiedene Zeitpunkte $3$ und $2$ verglichen",1],["Schluss: kein Zusammenstoß",1]],tip:"Schnittpunkt der Bahnen heißt nicht Kollision. Der Zeitpunkt entscheidet."},
{op:"Bestimmen",q:"Bestimmen Sie den kleinsten Abstand der beiden Flugzeuge voneinander und den Zeitpunkt, zu dem er auftritt.",pts:5,mod:"Differenzvektor zur gleichen Zeit $t$: $h(t)-g(t)=\\begin{pmatrix}2\\\\t-1\\\\0{,}5t-1{,}5\\end{pmatrix}$.\nAbstand: $d(t)^{2}=4+(1-t)^{2}+(1{,}5-0{,}5t)^{2}$.\n$\\dfrac{d}{dt}d^{2}=-2(1-t)-(1{,}5-0{,}5t)=2{,}5t-3{,}5=0$ ergibt $t=1{,}4$. Es ist ein Minimum, da die quadratische Funktion nach oben geöffnet ist.\n$d(1{,}4)^{2}=4+0{,}16+0{,}64=4{,}8$, also $d=\\sqrt{4{,}8}\\approx2{,}19\\,km$.\nNach $1{,}4$ Minuten sind die Flugzeuge am nächsten, mit $2{,}19\\,km$ Abstand.",cr:[["Differenzvektor zur gleichen Zeit $t$ aufgestellt",1],["Abstandsfunktion $d(t)$ oder $d(t)^{2}$",1],["Ableitung gleich 0: $t=1{,}4$",1],["Minimum begründet",1],["Abstand $\\approx2{,}19\\,km$ mit Einheit",1]],tip:"Das Quadrat des Abstandes zu minimieren ist einfacher und liefert dieselbe Stelle."},
{op:"Berechnen",q:"Berechnen Sie den Winkel, unter dem sich die Flugbahnen schneiden.",pts:3,mod:"$\\cos\\varphi=\\dfrac{|\\begin{pmatrix}2\\\\1\\\\-0{,}5\\end{pmatrix}\\cdot\\begin{pmatrix}2\\\\2\\\\0\\end{pmatrix}|}{\\sqrt{5{,}25}\\cdot\\sqrt{8}}=\\dfrac{6}{\\sqrt{42}}\\approx0{,}926$.\n$\\varphi\\approx22{,}2^{\\circ}$.",cr:[["Formel mit Betrag im Zähler",1],["Skalarprodukt $6$ und Längen $\\sqrt{5{,}25}$, $\\sqrt{8}$",1],["$\\varphi\\approx22{,}2^{\\circ}$",1]],tip:""},
{op:"Bestimmen",q:"Flugzeug $A$ sinkt weiter. Bestimmen Sie, wann und wo es den Boden erreicht, und berechnen Sie den Winkel seiner Flugbahn gegen den Boden.",pts:2,mod:"$3-0{,}5t=0$ ergibt $t=6$. Aufsetzpunkt: $\\begin{pmatrix}-4\\\\-2\\\\3\\end{pmatrix}+6\\cdot\\begin{pmatrix}2\\\\1\\\\-0{,}5\\end{pmatrix}=\\begin{pmatrix}8\\\\4\\\\0\\end{pmatrix}$, also $(8\\,|\\,4\\,|\\,0)$.\nWinkel gegen den Boden: $\\tan\\alpha=\\dfrac{0{,}5}{\\sqrt{2^{2}+1^{2}}}=\\dfrac{0{,}5}{\\sqrt{5}}$, also $\\alpha\\approx12{,}6^{\\circ}$.",cr:[["$t=6$ und Aufsetzpunkt $(8\\,|\\,4\\,|\\,0)$",1],["Winkel $\\approx12{,}6^{\\circ}$",1]],tip:"Der Winkel zum Boden ist der Winkel zur waagerechten Bewegung, nicht zur $x_{1}$-Achse."}
]},
{id:"k21",a:"geo",te:"B",title:"Geometrie mit Hilfsmittel: Ebenenschar",pts:15,min:45,intro:"Für jedes $a\\in\\mathbb{R}$ ist eine Ebene $E_{a}:\\ x_{1}+a\\cdot x_{2}+2x_{3}=4+2a$ gegeben.",parts:[
{op:"Zeigen",q:"Zeigen Sie, dass der Punkt $P(4\\,|\\,2\\,|\\,0)$ in jeder Ebene $E_{a}$ liegt.",pts:2,mod:"Einsetzen von $P$: $4+a\\cdot2+2\\cdot0=4+2a$. Die Gleichung ist für jedes $a$ erfüllt.",cr:[["$P$ in die Gleichung eingesetzt",1],["Aussage „für alle $a$“ formuliert",1]],tip:"Die Rechnung muss für beliebiges $a$ erfolgen. Ein einzelner Wert für $a$ zeigt nichts."},
{op:"Bestimmen",q:"Bestimmen Sie den Wert von $a$, für den $E_{a}$ parallel zur $x_{2}$-Achse verläuft.",pts:2,mod:"Normalenvektor $\\begin{pmatrix}1\\\\a\\\\2\\end{pmatrix}$ und Richtungsvektor der $x_{2}$-Achse $\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}$.\nParallel bedeutet $\\vec{n}\\cdot\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}=a=0$. Es folgt $a=0$.",cr:[["Bedingung Normalenvektor senkrecht zur Achsenrichtung",1],["$a=0$",1]],tip:""},
{op:"Bestimmen",q:"Alle Ebenen $E_{a}$ haben eine Gerade gemeinsam. Bestimmen Sie eine Gleichung dieser Geraden.",pts:4,mod:"Umformung: $x_{1}+2x_{3}-4+a\\cdot(x_{2}-2)=0$. Das gilt für alle $a$ genau dann, wenn $x_{1}+2x_{3}=4$ und $x_{2}=2$ gelten.\nWähle $x_{3}=t$: $x_{1}=4-2t$, $x_{2}=2$.\n$g:\\ \\vec{x}=\\begin{pmatrix}4\\\\2\\\\0\\end{pmatrix}+t\\cdot\\begin{pmatrix}-2\\\\0\\\\1\\end{pmatrix}$.",cr:[["Terme mit $a$ gesammelt",1],["Beide Bedingungen $x_{1}+2x_{3}=4$ und $x_{2}=2$",1],["Parameter gewählt und gelöst",1],["Geradengleichung korrekt",1]],tip:"Alternativ: Schnitt zweier Ebenen, z. B. $a=0$ und $a=1$. Das Ergebnis ist dieselbe Gerade."},
{op:"Bestimmen",q:"Bestimmen Sie den Wert von $a$, für den der Abstand des Ursprungs von der Ebene $E_{a}$ am größten ist, und berechnen Sie diesen Abstand.",pts:5,mod:"Abstand: $d(a)=\\dfrac{|4+2a|}{\\sqrt{1+a^{2}+4}}=\\dfrac{|4+2a|}{\\sqrt{5+a^{2}}}$.\nAbleitung von $d(a)^{2}=\\dfrac{(4+2a)^{2}}{5+a^{2}}$: Zähler $2\\cdot(4+2a)\\cdot(10-4a)$. Nullstellen: $a=-2$ (dort ist $d=0$, ein Minimum) und $a=2{,}5$.\nFür $a=2{,}5$ wechselt das Vorzeichen von $+$ nach $-$: Maximum. $d(2{,}5)=\\dfrac{9}{\\sqrt{11{,}25}}\\approx2{,}68$.\nFür $a\\to\\pm\\infty$ gilt $d\\to2$, kleiner als der Maximalwert.",cr:[["Abstandsfunktion $d(a)$ mit Betrag und $|\\vec{n}|$",1],["Ableitung bestimmt",1],["Nullstellen $a=-2$ und $a=2{,}5$, passende ausgewählt",1],["Maximum begründet (Vorzeichenwechsel oder Verhalten im Unendlichen)",1],["Abstand $\\approx2{,}68$",1]],tip:"Die Stelle $a=-2$ ist ein Minimum (Ebene durch den Ursprung). Nicht blind die erste Nullstelle nehmen."},
{op:"Begründen",q:"Begründen Sie, dass die Ebene $x_{2}=2$ zwar die Gerade $g$ enthält, aber nicht zur Schar gehört.",pts:2,mod:"Die Ebene $x_{2}=2$ hat den Normalenvektor $\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}$. Bei jeder Ebene $E_{a}$ ist die erste Koordinate des Normalenvektors $1$, nie $0$.\nAlso kann $x_{2}=2$ für kein $a$ als $E_{a}$ geschrieben werden. Sie enthält aber $g$, denn alle Punkte von $g$ haben $x_{2}=2$.",cr:[["Normalenvektoren verglichen (erste Koordinate $1\\neq0$)",1],["$g$ liegt in $x_{2}=2$ erkannt",1]],tip:""}
]},
{id:"k22",a:"sto",te:"B",title:"Stochastik mit Hilfsmittel: Retouren im Onlinehandel",pts:15,min:45,intro:"Ein Onlinehändler hat eine Retourenquote von $12\\,\\%$. Die Retouren der Bestellungen werden als voneinander unabhängig angenommen. In einer Stichprobe von 50 Bestellungen ist $X$ die Anzahl der Retouren.",g:{k:"bars",n:50,p:0.12,from:0,to:13,hi:[6],cap:"Verteilung von $X\\sim B(50;\\,0{,}12)$, der wahrscheinlichste Wert ist hervorgehoben"},parts:[
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass genau 6 Bestellungen retourniert werden.",pts:2,mod:"$X\\sim B(50;\\,0{,}12)$.\n$P(X=6)=\\dbinom{50}{6}\\cdot0{,}12^{6}\\cdot0{,}88^{44}\\approx0{,}1712$.",cr:[["Binomialverteilung mit $n=50$, $p=0{,}12$ angesetzt",1],["$P(X=6)\\approx0{,}171$",1]],tip:""},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass mindestens 10 Bestellungen retourniert werden.",pts:2,mod:"$P(X\\geq10)=1-P(X\\leq9)\\approx1-0{,}9292=0{,}0708$.",cr:[["Gegenereignis $1-P(X\\leq9)$ (nicht $1-P(X\\leq10)$)",1],["$P(X\\geq10)\\approx0{,}071$",1]],tip:"Typischer Fehler: $1-P(X\\leq10)$ ergibt die Wahrscheinlichkeit für mindestens 11."},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass die Anzahl der Retouren höchstens eine Standardabweichung vom Erwartungswert abweicht.",pts:3,mod:"$\\mu=50\\cdot0{,}12=6$ und $\\sigma=\\sqrt{50\\cdot0{,}12\\cdot0{,}88}\\approx2{,}30$.\nIntervall $[\\mu-\\sigma;\\,\\mu+\\sigma]=[3{,}70;\\,8{,}30]$. Ganze Zahlen: $4\\leq X\\leq8$.\n$P(4\\leq X\\leq8)=P(X\\leq8)-P(X\\leq3)\\approx0{,}7263$.",cr:[["$\\mu=6$ und $\\sigma\\approx2{,}30$",1],["Intervall auf ganze Zahlen $4\\leq X\\leq8$ umgerechnet",1],["$P(4\\leq X\\leq8)\\approx0{,}726$",1]],tip:"Bei diskreten Verteilungen die Grenzen auf ganze Zahlen runden: 3,70 gehört zur 4."},
{op:"Bestimmen",q:"Bestimmen Sie die kleinste Anzahl an Bestellungen, bei der mit mindestens $95\\,\\%$ Wahrscheinlichkeit mindestens eine Retoure auftritt.",pts:3,mod:"$P(X\\geq1)=1-0{,}88^{n}\\geq0{,}95$ ergibt $0{,}88^{n}\\leq0{,}05$.\n$n\\geq\\dfrac{\\ln(0{,}05)}{\\ln(0{,}88)}\\approx23{,}43$. Der Logarithmus von $0{,}88$ ist negativ, daher dreht sich das Ungleichheitszeichen um.\nKleinste Anzahl: $n=24$. Probe: $1-0{,}88^{23}\\approx0{,}947<0{,}95$ und $1-0{,}88^{24}\\approx0{,}953$.",cr:[["Ansatz $1-0{,}88^{n}\\geq0{,}95$",1],["Logarithmieren und Umdrehen des Zeichens",1],["$n=24$ mit Probe",1]],tip:"Das Ergebnis immer aufrunden und mit $n-1$ gegenprüfen."},
{op:"Berechnen",q:"Jede Retoure kostet den Händler $8\\,€$. Berechnen Sie die erwarteten Kosten bei 200 Bestellungen.",pts:2,mod:"Erwartete Anzahl: $200\\cdot0{,}12=24$ Retouren.\nErwartete Kosten: $24\\cdot8\\,€=192\\,€$.",cr:[["Erwartungswert $24$ der Retouren",1],["Kosten $192\\,€$ mit Einheit",1]],tip:""},
{op:"Begründen",q:"Begründen Sie, dass bei 50 Bestellungen die Anzahl 6 der wahrscheinlichste Wert von $X$ ist.",pts:3,mod:"Für binomialverteilte $X$ ist der wahrscheinlichste Wert die größte ganze Zahl $k\\leq(n+1)\\cdot p=51\\cdot0{,}12=6{,}12$, also $k=6$.\nKontrolle mit den Nachbarwerten: $P(X=5)\\approx0{,}1674$, $P(X=6)\\approx0{,}1712$ und $P(X=7)\\approx0{,}1467$. Der Wert bei $k=6$ ist am größten.",cr:[["Kriterium oder Quotientenvergleich genannt",1],["$(n+1)\\cdot p=6{,}12$ führt zu $k=6$",1],["Kontrolle mit den Nachbarwerten",1]],tip:"Der Erwartungswert ist nicht immer der wahrscheinlichste Wert. Hier fällt beides zufällig auf 6."}
]},
{id:"k23",a:"sto",te:"B",title:"Stochastik mit Hilfsmittel: Müslipackungen",pts:15,min:45,intro:"Eine Maschine füllt Müsli in Packungen mit der Nennmenge $500\\,g$. Die Füllmenge $X$ (in Gramm) ist normalverteilt mit $\\mu=500$ und $\\sigma=4$.",g:{k:"norm",mu:500,s:4,shade:[null,495],ticks:[488,492,496,500,504,508,512],cap:"$X\\sim N(500;\\,4^{2})$, markiert ist $P(X<495)$"},parts:[
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass eine Packung weniger als $495\\,g$ enthält.",pts:2,mod:"$P(X<495)=\\Phi\\left(\\dfrac{495-500}{4}\\right)=\\Phi(-1{,}25)\\approx0{,}1056$.",cr:[["Ansatz mit Normalverteilung ($\\mu=500$, $\\sigma=4$)",1],["$P(X<495)\\approx0{,}106$",1]],tip:"Als Streuung gehört $\\sigma$ (nicht $\\sigma^{2}$) in die Rechnung."},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass die Füllmenge zwischen $496\\,g$ und $504\\,g$ liegt.",pts:2,mod:"Das Intervall ist $\\mu\\pm\\sigma$.\n$P(496\\leq X\\leq504)=\\Phi(1)-\\Phi(-1)\\approx0{,}6827$.",cr:[["Differenz der Verteilungsfunktionswerte",1],["$P\\approx0{,}683$ (und Hinweis: $\\sigma$-Umgebung)",1]],tip:""},
{op:"Bestimmen",q:"Der Hersteller will den Mittelwert $\\mu$ so einstellen, dass bei $\\sigma=4$ nur $2\\,\\%$ der Packungen weniger als $500\\,g$ enthalten. Bestimmen Sie $\\mu$.",pts:3,mod:"$P(X<500)=0{,}02$ bedeutet $\\Phi\\left(\\dfrac{500-\\mu}{4}\\right)=0{,}02$.\n$\\Phi^{-1}(0{,}02)\\approx-2{,}054$, also $\\dfrac{500-\\mu}{4}=-2{,}054$.\n$\\mu=500+4\\cdot2{,}054\\approx508{,}2\\,g$.",cr:[["Ansatz $\\Phi\\left(\\frac{500-\\mu}{4}\\right)=0{,}02$",1],["Quantil $-2{,}054$",1],["$\\mu\\approx508{,}2\\,g$",1]],tip:"Das Quantil ist negativ, weil $0{,}02<0{,}5$ ist. Beim Umstellen auf das Vorzeichen achten."},
{op:"Bestimmen",q:"Alternativ soll bei $\\mu=502$ nur $1\\,\\%$ der Packungen weniger als $500\\,g$ enthalten. Bestimmen Sie $\\sigma$.",pts:3,mod:"$\\Phi\\left(\\dfrac{500-502}{\\sigma}\\right)=0{,}01$, also $\\dfrac{-2}{\\sigma}=\\Phi^{-1}(0{,}01)\\approx-2{,}326$.\n$\\sigma=\\dfrac{2}{2{,}326}\\approx0{,}86\\,g$.",cr:[["Ansatz mit $\\Phi\\left(\\frac{-2}{\\sigma}\\right)=0{,}01$",1],["Quantil $-2{,}326$",1],["$\\sigma\\approx0{,}86\\,g$",1]],tip:""},
{op:"Berechnen",q:"Es werden 200 Packungen (mit $\\mu=500$, $\\sigma=4$) zufällig geprüft. Berechnen Sie die erwartete Anzahl der Packungen mit weniger als $495\\,g$.",pts:2,mod:"Die Anzahl ist binomialverteilt mit $n=200$ und $p\\approx0{,}1056$.\n$E=200\\cdot0{,}1056\\approx21{,}1$. Erwartet werden etwa $21$ Packungen.",cr:[["Binomialverteilung mit $p$ aus Teilaufgabe a)",1],["$E\\approx21{,}1$",1]],tip:""},
{op:"Beurteilen",q:"Ein Mitarbeiter behauptet: „Mindestens $90\\,\\%$ der Packungen enthalten mindestens $495\\,g$.“ Beurteilen Sie die Aussage für $\\mu=500$ und $\\sigma=4$.",pts:3,mod:"$P(X\\geq495)=1-P(X<495)\\approx1-0{,}1056=0{,}8944$.\nDas sind etwa $89{,}4\\,\\%$ und damit weniger als $90\\,\\%$. Die Aussage ist falsch.",cr:[["Gegenwahrscheinlichkeit $1-P(X<495)$",1],["$P(X\\geq495)\\approx0{,}894$",1],["Beurteilung: Aussage falsch, mit Vergleich zu $90\\,\\%$",1]],tip:"Bei „Beurteilen“ gehört ein klares Urteil mit Begründung in die Antwort, nicht nur eine Zahl."}
]},
{id:"k24",a:"sto",te:"B",title:"Stochastik mit Hilfsmittel: Zwei Maschinen",pts:15,min:45,intro:"In einem Werk stellt Maschine $M_{1}$ $60\\,\\%$ der Bauteile her, Maschine $M_{2}$ die übrigen $40\\,\\%$. Von den Teilen aus $M_{1}$ sind $3\\,\\%$ Ausschuss, von den Teilen aus $M_{2}$ sind $8\\,\\%$ Ausschuss.",g:{k:"tree",L1:[["M1","0,6"],["M2","0,4"]],L2:[[["A","0,03"],["nicht A","0,97"]],[["A","0,08"],["nicht A","0,92"]]],cap:"Baumdiagramm: $M_{1}$, $M_{2}$ und Ausschuss $A$"},parts:[
{op:"Zeichnen",q:"Zeichnen Sie ein vollständiges, beschriftetes Baumdiagramm (siehe Skizze zur Kontrolle) und berechnen Sie die Wahrscheinlichkeiten der vier Pfade.",pts:3,mod:"Erste Stufe: $M_{1}$ mit $0{,}6$ und $M_{2}$ mit $0{,}4$. Zweite Stufe: Ausschuss $A$ mit $0{,}03$ bzw. $0{,}08$.\nPfade: $M_{1}\\cap A$: $0{,}018$; $M_{1}\\cap\\overline{A}$: $0{,}582$; $M_{2}\\cap A$: $0{,}032$; $M_{2}\\cap\\overline{A}$: $0{,}368$. Summe: $1$.",cr:[["Erste Stufe richtig beschriftet",1],["Zweite Stufe mit bedingten Wahrscheinlichkeiten",1],["Pfadwahrscheinlichkeiten mit Summenprobe $1$",1]],tip:"Die Äste der zweiten Stufe müssen jeweils $1$ ergeben."},
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit, dass ein zufällig gewähltes Bauteil Ausschuss ist.",pts:2,mod:"$P(A)=0{,}6\\cdot0{,}03+0{,}4\\cdot0{,}08=0{,}018+0{,}032=0{,}05$.",cr:[["Beide Pfade zu $A$ addiert",1],["$P(A)=0{,}05$",1]],tip:""},
{op:"Berechnen",q:"Ein Bauteil ist Ausschuss. Berechnen Sie die Wahrscheinlichkeit, dass es von $M_{2}$ stammt.",pts:3,mod:"$P_{A}(M_{2})=\\dfrac{P(M_{2}\\cap A)}{P(A)}=\\dfrac{0{,}032}{0{,}05}=0{,}64$.\nObwohl $M_{2}$ nur $40\\,\\%$ der Teile herstellt, stammen $64\\,\\%$ der Ausschussteile von $M_{2}$.",cr:[["Formel von Bayes bzw. bedingte Wahrscheinlichkeit richtig angesetzt",1],["$P(M_{2}\\cap A)=0{,}032$ und $P(A)=0{,}05$",1],["Ergebnis $0{,}64$",1]],tip:"Die Fragerichtung dreht sich um: nicht „Ausschuss, wenn $M_{2}$“, sondern „$M_{2}$, wenn Ausschuss“."},
{op:"Berechnen",q:"Es werden 20 Bauteile zufällig entnommen. Berechnen Sie die Wahrscheinlichkeit, dass mindestens 2 davon Ausschuss sind.",pts:3,mod:"Die Anzahl $Y$ der Ausschussteile ist binomialverteilt mit $n=20$ und $p=0{,}05$.\n$P(Y\\geq2)=1-P(Y=0)-P(Y=1)=1-0{,}95^{20}-20\\cdot0{,}05\\cdot0{,}95^{19}\\approx0{,}2642$.",cr:[["Binomialverteilung mit $p=0{,}05$ aus Teilaufgabe b)",1],["Gegenereignis $1-P(Y\\leq1)$",1],["$P(Y\\geq2)\\approx0{,}264$",1]],tip:"Die Ausschussquote $p=0{,}05$ stammt aus b). Nicht mit $0{,}03$ oder $0{,}08$ rechnen."},
{op:"Bestimmen",q:"Wie viele Bauteile müssen mindestens entnommen werden, damit mit einer Wahrscheinlichkeit von mindestens $99\\,\\%$ mindestens ein Ausschussteil dabei ist?",pts:4,mod:"$P(Y\\geq1)=1-0{,}95^{n}\\geq0{,}99$ ergibt $0{,}95^{n}\\leq0{,}01$.\n$n\\geq\\dfrac{\\ln(0{,}01)}{\\ln(0{,}95)}\\approx89{,}78$.\nEs müssen mindestens $n=90$ Bauteile entnommen werden.\nProbe: $1-0{,}95^{89}\\approx0{,}9896<0{,}99$ und $1-0{,}95^{90}\\approx0{,}9901\\geq0{,}99$.",cr:[["Ansatz über das Gegenereignis",1],["Ungleichung $0{,}95^{n}\\leq0{,}01$",1],["Logarithmus, Zeichen gedreht: $n\\geq89{,}78$",1],["Aufgerundet auf $n=90$ mit Probe",1]],tip:"Immer aufrunden: Bei $89$ Teilen reicht es noch nicht."}
]}
);

/* Aufgaben-Generator: Vorlagen mit Zufallsparametern. Jede Vorlage rechnet die Lösung
   in geschlossener Form und prüft sie zusätzlich numerisch (chk). Im Test müssen beide übereinstimmen. */
var GEN=[],GR=String.raw;
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pk(a){return a[Math.floor(Math.random()*a.length)]}
function nz(a,b){var x;do{x=ri(a,b)}while(!x);return x}
function rd(x,d){var m=Math.pow(10,d);var r=Math.round(x*m)/m;return Math.abs(r)<1e-12?0:r}
function N(x,d){x=rd(x,d==null?8:d);var s=d==null?String(x):x.toFixed(d);if(s.indexOf("e")>=0)s=x.toFixed(8);return s.replace(".","{,}")}
function W(x,d){return x<0?"("+N(x,d)+")":N(x,d)}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}
function FR(n,d){var g=gcd(n,d);n/=g;d/=g;if(d<0){n=-n;d=-d}return d===1?String(n):(n<0?"-":"")+"\\frac{"+Math.abs(n)+"}{"+d+"}"}
function SG(x){return x<0?"-":"+"}
function AB(x){return Math.abs(x)}
function poly(cs,v){v=v||"x";var n=cs.length-1,s="";cs.forEach(function(c,i){var e=n-i;if(!c)return;var ab=Math.abs(c),m=(ab===1&&e>0)?"":N(ab),xs=e===0?"":(e===1?v:v+"^{"+e+"}");s+=(c<0?"-":(s?"+":""))+m+xs});return s||"0"}
function pj(cs){var n=cs.length-1;return cs.map(function(c,i){return "("+c+")*x**"+(n-i)}).join("+")}
function pv(cs,x){var r=0;cs.forEach(function(c){r=r*x+c});return r}
function pd(cs){var n=cs.length-1,r=[];for(var i=0;i<n;i++)r.push(cs[i]*(n-i));return r}
function lin(a,b,v){v=v||"x";return poly([a,b],v)}
function V3(a,b,c){return "\\begin{pmatrix}"+a+"\\\\"+b+"\\\\"+c+"\\end{pmatrix}"}
function PT(n,a,b,c){return n+"("+a+"\\,|\\,"+b+"\\,|\\,"+c+")"}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function len(a){return Math.sqrt(dot(a,a))}
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]]}
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]}
function vmul(k,a){return [k*a[0],k*a[1],k*a[2]]}
function vtx(a){return V3(a[0],a[1],a[2])}
function ptx(n,a){return PT(n,a[0],a[1],a[2])}
function sperm(v){var p=pk([[0,1,2],[0,2,1],[1,0,2],[1,2,0],[2,0,1],[2,1,0]]);return {p:p,s:[pk([1,-1]),pk([1,-1]),pk([1,-1])]}}
function sapply(m,v){return [m.s[0]*v[m.p[0]],m.s[1]*v[m.p[1]],m.s[2]*v[m.p[2]]]}
/* numerische Kontrollwerkzeuge (unabhängig von den Formeln der Vorlagen) */
function integ(f,a,b){var n=4000,h=(b-a)/n,s=f(a)+f(b);for(var i=1;i<n;i++)s+=f(a+i*h)*(i%2?4:2);return s*h/3}
function dif(f,x){var h=1e-5;return(f(x+h)-f(x-h))/(2*h)}
function bis(f,a,b){var fa=f(a);for(var i=0;i<200;i++){var m=(a+b)/2,fm=f(m);if((fa<0)===(fm<0)){a=m;fa=fm}else b=m}return (a+b)/2}
function argext(f,a,b,mx){var best=a,bv=f(a),n=20000;for(var i=1;i<=n;i++){var x=a+(b-a)*i/n,y=f(x);if(mx?y>bv:y<bv){bv=y;best=x}}return best}

    return ex({q:GR`Gegeben ist $F(x)=\displaystyle\int_{1}^{x}\left(${poly(f,"t")}\right)dt$. Berechnen Sie $F(${X})$.`,
      h:"Bilde eine Stammfunktion von $f$ und setze $x=1$ und $x="+X+"$ ein.",
      e:GR`Stammfunktion $G(t)=${poly([a,b,c,0],"t")}$. $F(${X})=G(${X})-G(1)=${F(X)}-${W(F(1))}=${v}$.`,
      p:"Die untere Grenze $1$ nicht vergessen. $F(1)=0$, aber $G(1)$ ist nicht null.",
      _chk:integ(function(t){return pv(f,t)},1,X)},num(v,0))}
  var d=ri(-2,3),k=ri(1,4),x0=ri(1,3),f2=function(t){return t*t*t-k*t+d},v2=f2(x0);
  return ex({q:GR`Gegeben ist $F(x)=\displaystyle\int_{0}^{x}\left(t^{3}-${k}t${d>=0?"+":""}${d}\right)dt$. Berechnen Sie $F'(${x0})$.`,
    h:"Hauptsatz: Die Ableitung einer Integralfunktion ist der Integrand.",
    e:GR`Nach dem Hauptsatz gilt $F'(x)=x^{3}-${k}x${d>=0?"+":""}${d}$. $F'(${x0})=${v2}$.`,
    p:"Man muss nicht integrieren. $F'(x)=f(x)$.",
    _chk:dif(function(x){return integ(f2,0,x)},x0)},num(v2,0))});

T("a31","ana","Steckbriefaufgabe","A",3,"Bestimmen",function(){

  return ex({q:GR`Der Graph einer ganzrationalen Funktion $f$ dritten Grades ist punktsymmetrisch zum Ursprung, hat an der Stelle $x=${m}$ eine waagerechte Tangente und verläuft durch $P(1\,|\,${y1})$. Bestimmen Sie $f(${x1})$.`,
    h:"Punktsymmetrie zum Ursprung heißt $f(x)=ax^{3}+cx$. Stelle zwei Gleichungen mit $f(1)$ und $f'("+m+")=0$ auf.",

    p:"Bei Punktsymmetrie fallen die geraden Potenzen weg. Danach hat man nur noch zwei Unbekannte.",

T("a32","ana","Funktionseigenschaften","A",1,"Untersuchen",function(){
  var kind=ri(0,2),a=ri(1,4),c=ri(1,3),cs,f,ans;
  if(kind===0){cs=[1,0,-a,0,c];f=function(x){return x*x*x*x-a*x*x+c};ans=0}
  else if(kind===1){cs=[1,0,a,0];f=function(x){return x*x*x+a*x};ans=1}
  else{cs=[1,a,0,0];f=function(x){return x*x*x+a*x*x};ans=2}
  var sym=Math.abs(f(1.7)-f(-1.7))<1e-9?0:(Math.abs(f(1.7)+f(-1.7))<1e-9?1:2);
  var o=["achsensymmetrisch zur $y$-Achse","punktsymmetrisch zum Ursprung","weder achsen- noch punktsymmetrisch","achsensymmetrisch zur $x$-Achse"];
  return ex({q:GR`Welche Symmetrie hat der Graph von $f(x)=${poly(cs)}$?`,
    o:o,c:ans,h:"Setze $-x$ ein und vergleiche $f(-x)$ mit $f(x)$ und $-f(x)$.",
    e:kind===0?"Nur gerade Exponenten (und eine Konstante): $f(-x)=f(x)$. Das ist Achsensymmetrie zur $y$-Achse.":kind===1?"Nur ungerade Exponenten: $f(-x)=-f(x)$. Das ist Punktsymmetrie zum Ursprung.":"Gerade und ungerade Exponenten gemischt: weder $f(-x)=f(x)$ noch $f(-x)=-f(x)$.",
    p:"Zum Begründen $f(-x)$ wirklich ausrechnen und mit $f(x)$ bzw. $-f(x)$ vergleichen.",
    _dev:sym===ans?0:1})});

var QUAD=[[1,2,2,3],[2,3,6,7],[1,4,8,9],[4,4,7,9],[2,6,9,11],[6,6,7,11],[3,4,12,13],[2,5,14,15],[8,9,12,17]];
var ORTH=[[[2,2,1],[-2,1,2],3],[[1,2,2],[2,1,-2],3],[[2,3,6],[3,-6,2],7],[[1,2,2],[2,-2,1],3]];
function qv(){var q=pk(QUAD),m=sperm(),v=sapply(m,[q[0],q[1],q[2]]);return {v:v,d:q[3]}}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function det3(a,b,c){return dot(a,cross(b,c))}
function rv(lo,hi){return [ri(lo,hi),ri(lo,hi),ri(lo,hi)]}
function rnz(lo,hi){var v;do{v=rv(lo,hi)}while(!v[0]&&!v[1]&&!v[2]);return v}
function isz(v){return !v[0]&&!v[1]&&!v[2]}
function lcm(a,b){return a*b/gcd(a,b)}
function trm(c,v,first){if(!c)return"";var ab=Math.abs(c),m=ab===1?"":String(ab);return (c<0?"-":(first?"":"+"))+m+v}
function eqn(row,rhs){var s="",f=true;for(var i=0;i<3;i++){var t=trm(row[i],"x_{"+(i+1)+"}",f);if(t){s+=t;f=false}}return s+"="+rhs}
function EQ(n,D){return eqn(n,D)}
function xk(i){return "x_{"+(i+1)+"}"}
function cmp(v,i){return v[i]}
function lageCls(A,u,B,w){var c=cross(u,w);if(isz(c)){return isz(cross(vsub(B,A),u))?0:1}return Math.abs(det3(vsub(B,A),u,w))<1e-9?2:3}

T("g08","geo","Lagebeziehungen","A",2,"Untersuchen",function(){

  case"ucorr":t=U.run&&U.run.q[U.run.i];if(!t)break;askCorr("u"+t.id,SYSK+"\n\nAufgabe ("+t.op+"): "+t.q+"\nMusterlösung und Erklärung: "+(t.e||"")+(t.t==="num"?"\nErwartetes Ergebnis: "+t.v+(t.u?" "+t.u:""):"")+"\n\nKorrigiere die Fotos.",U.ph["u"+t.id]);break;
  case"kcorr":var kz=kById(S.run.id),ki=+v,kp=kz.parts[ki],kk2="k"+kz.id+"_"+ki,bl=(U.ph[kk2]&&U.ph[kk2].length)?U.ph[kk2]:U.ph.kall;
    askCorr(kk2,SYSK+"\n\nKlausur „"+kz.title+"“. Teilaufgabe "+String.fromCharCode(97+ki)+") ("+kp.op+", "+kp.pts+" P.): "+kp.q+"\nMusterlösung: "+kp.mod+"\nBewertungskriterien:\n"+klCrit(kz,ki)+(S.run.ans[ki]?"\nGetippte Lösung des Schülers: "+S.run.ans[ki]:"")+"\n\nDie Fotos können mehrere Teilaufgaben enthalten. Beurteile nur diese Teilaufgabe. Beende deine Antwort mit genau einer letzten Zeile im Format PUNKTE: 1,0,1 mit einer Zahl pro Kriterium in der obigen Reihenfolge (1 = erfüllt, 0 = nicht erfüllt).",bl,function(txt){
      var m=/PUNKTE:\s*([01](?:\s*,\s*[01])*)/i.exec(txt||"");if(m){U.kap[kk2]=m[1].split(",").map(function(x){return +x.trim()});var ab=$("#ka-"+kk2);if(ab)ab.hidden=false}});break;
  case"kapply":var ka="k"+S.run.id+"_"+v,vals=U.kap[ka];if(vals)vals.forEach(function(x,j){var cb=document.querySelector('.kc[data-p="'+v+'"][data-j="'+j+'"]');if(cb)cb.checked=!!x});break;
  case"extopic":toggle(ensureExam().topics,v);save();render(true);break;
  case"resetprog":if(U.del.rp){S.box={};S.hist=[];S.days={};S.rounds={};S.klaus=[];S.run=null;U.run=null;U.cur=null;U.kl={stage:"pick",mins:{}};U.del={};save()}else{U.del.rp=true}render(true);break;
  case"resetkl":if(U.del.rk){S.klaus=[];S.run=null;U.kl={stage:"pick",mins:{}};U.del={};save()}else{U.del.rk=true}render(true);break;
  case"reset":if(U.del.reset){S=def();save();U.del={};U.run=null}else U.del.reset=true;render(true);break;
  case"kstart":var kk=kById(v),mm=Math.max(5,Math.min(300,+(U.kl.mins[v]||kk.min)));S.run={id:v,start:Date.now(),mins:mm,ans:{}};save();U.kl.stage="run";render();window.scrollTo(0,0);break;
  case"kend":if(!U.del.kend){U.del.kend=true;render(true);return}U.del.kend=false;S.run.end=Date.now();save();U.kl.stage="grade";render();window.scrollTo(0,0);break;
  case"ksave":var kx=kById(S.run.id),parts=kx.parts.map(function(p){return{op:p.op,got:0,max:p.pts,tip:p.tip}});
    [].forEach.call(document.querySelectorAll(".kc"),function(e){if(e.checked){var pi=+e.getAttribute("data-p"),cj=+e.getAttribute("data-j");parts[pi].got+=kx.parts[pi].cr[cj][1]}});
    var tot=parts.reduce(function(s,p){return s+p.got},0),mx=parts.reduce(function(s,p){return s+p.max},0),secs=((S.run.end||Date.now())-S.run.start)/1000,td=today();
    U.kl.result={title:kx.title,got:tot,max:mx,parts:parts,secs:secs,mins:S.run.mins};
    S.klaus.push({id:kx.id,got:tot,max:mx,t:Date.now(),secs:Math.round(secs)});
    parts.forEach(function(p){S.hist.push({i:"k:"+kx.id,ok:p.got/p.max>=.6?1:0,d:td,a:kx.a,g:"Klausur",x:""})});
    S.days[td]=(S.days[td]||0)+parts.length;if(S.hist.length>600)S.hist=S.hist.slice(-600);
    S.run=null;save();U.kl.stage="result";render();window.scrollTo(0,0);break;

  case"tsend":U.tin=$("#tin").value;sendTutor();break;
  case"tstop":if(U.abort)U.abort.abort();break;
  case"tnew":U.tut=[];render(true);break;

});
document.addEventListener("input",function(ev){
  var el=ev.target,m=el.getAttribute&&el.getAttribute("data-m");
  if(m){U[m][el.getAttribute("data-k")]=el.value;return}
  var ai=el.getAttribute&&el.getAttribute("data-a-in");
  if(ai==="kans"&&S.run){S.run.ans[el.getAttribute("data-v")]=el.value;lsSet()}
  else if(ai==="kmin"){U.kl.mins[el.getAttribute("data-v")]=+el.value}
  else if(ai==="abi"){S.abi=el.value;save()}
  else if(ai==="exn"){ensureExam().name=el.value;save()}
  else if(ai==="exd"){ensureExam().date=el.value;save()}
  else if(ai==="aim"){S.aim=el.value;save()}
  if(el.id==="kq"){U.kq=el.value;$("#klist").innerHTML=cardsHTML()}
  if(el.id==="tin")U.tin=el.value});
document.addEventListener("change",function(ev){
  var el=ev.target,m=el.getAttribute&&el.getAttribute("data-m");
  if(el.getAttribute&&el.getAttribute("data-restore")&&el.files&&el.files[0]){var fr=new FileReader();fr.onload=function(){try{var o=JSON.parse(fr.result);if(!o||o.v!==2||typeof o.box!=="object")throw 0;S=o;lsSet();U.run=null;U.cur=null;U.bk="Fortschritt wiederhergestellt."}catch(e){U.bk="Diese Datei passt nicht zur App."}render(true)};fr.readAsText(el.files[0]);el.value="";return}
  if(el.getAttribute&&el.getAttribute("data-ph-in")){addPhotos(el.getAttribute("data-ph-in"),el.files);el.value="";return}
  if(el.getAttribute&&el.getAttribute("data-a-in")==="abi"){render(true);return}
  if(el.getAttribute&&el.getAttribute("data-a-in")==="goal"){S.rg=+el.value;save();render(true);return}
  var kf=el.getAttribute&&el.getAttribute("data-kf");
  if(kf){U.kl[kf]=el.value;render(true);return}
  var f=el.getAttribute&&el.getAttribute("data-f");
  if(f){U.f[f]=el.value;if(f==="a")U.f.tg="";U.note="";render(true)}});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.id==="num"){var b=$('[data-a="num"]');if(b)b.click()}});
