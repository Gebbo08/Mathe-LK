{id:"s28",a:"sto",t:"mc",tg:"Histogramme",op:"Beschreiben",te:"A",lv:2,q:"Das Histogramm zeigt die Verteilung von $X\\sim B(10;\\,0{,}3)$. Welche Aussage ist richtig?",o:["Der wahrscheinlichste Wert ist $k=3$, der lange Ausläufer liegt rechts","Der wahrscheinlichste Wert ist $k=5$, das Histogramm ist symmetrisch","Der wahrscheinlichste Wert ist $k=7$, der lange Ausläufer liegt links","Der wahrscheinlichste Wert ist $k=0{,}3$"],c:0,h:"Vergleiche mit $\\mu=n\\cdot p$. Bei $p<0{,}5$ ist die Verteilung nach rechts ausgezogen.",e:"$\\mu=10\\cdot0{,}3=3$, und die höchste Säule steht bei $k=3$. Wegen $p<0{,}5$ ist das Histogramm nicht symmetrisch, der lange Ausläufer liegt rechts. $k$ ist immer ganzzahlig.",p:"Das Maximum liegt (fast) beim Erwartungswert.",g:{k:"bars",n:10,p:0.3,from:0,to:10,cap:"Histogramm von $B(10;\\,0{,}3)$"}},
{id:"s29",a:"sto",t:"mc",tg:"Histogramme",op:"Angeben",te:"A",lv:2,q:"$X$ ist $B(8;\\,0{,}5)$-verteilt. Die markierten Säulen im Histogramm gehören zu einem Ereignis. Welcher Term gibt die markierte Wahrscheinlichkeit an?",o:["$P(2\\leq X\\leq5)$","$P(2<X<5)$","$P(X\\geq2)$","$P(X\\leq5)$"],c:0,h:"Zähle die markierten Werte: von welchem $k$ bis zu welchem?",e:"Markiert sind $k=2,3,4,5$. Das ist $P(2\\leq X\\leq5)=P(X\\leq5)-P(X\\leq1)$.",p:"Beachte, ob die Grenzen mitzählen ($\\leq$) oder nicht ($<$).",g:{k:"bars",n:8,p:0.5,from:0,to:8,hi:[2,3,4,5],cap:"Histogramm von $B(8;\\,0{,}5)$ mit markiertem Ereignis"}},
{id:"s30",a:"sto",t:"num",tg:"Normalverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist normalverteilt mit $\\mu=50$ und $\\sigma=8$. Berechnen Sie $P(X\\leq58)$ (vier Nachkommastellen). Die Fläche ist markiert.",v:0.8413,tol:0.0005,h:"58 liegt genau $1\\sigma$ über $\\mu$.",e:"$P(X\\leq58)=\\Phi(1)\\approx0{,}8413$.",p:"Ansatz notieren, dann das Ergebnis mit dem Hilfsmittel.",gg:"`Normal(50, 8, 58, true)`.",g:{k:"norm",mu:50,s:8,shade:[null,58],ticks:[34,42,50,58,66],cap:"Dichtefunktion von $N(50;\\,8^{2})$"}},
{id:"s31",a:"sto",t:"num",tg:"Normalverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist normalverteilt mit $\\mu=50$ und $\\sigma=8$. Berechnen Sie $P(40\\leq X\\leq60)$ (vier Nachkommastellen).",v:0.7887,tol:0.0005,h:"$P(a\\leq X\\leq b)=F(b)-F(a)$.",e:"$P(40\\leq X\\leq60)=F(60)-F(40)\\approx0{,}8943-0{,}1057=0{,}7887$.",p:"Es müssen zwei Wahrscheinlichkeiten voneinander abgezogen werden.",gg:"`Normal(50,8,60,true) - Normal(50,8,40,true)`.",g:{k:"norm",mu:50,s:8,shade:[40,60],ticks:[34,40,50,60,66],cap:"Markiert ist $P(40\\leq X\\leq60)$"}},
{id:"s32",a:"sto",t:"mc",tg:"Normalverteilung",op:"Beschreiben",te:"A",lv:2,q:"Die Abbildung zeigt die Dichtefunktionen zweier normalverteilter Zufallsgrößen $X_1$ (blau) und $X_2$ (rot). Welche Aussage über die Parameter ist richtig?",o:["$\\mu_1<\\mu_2$ und $\\sigma_1<\\sigma_2$","$\\mu_1<\\mu_2$ und $\\sigma_1>\\sigma_2$","$\\mu_1>\\mu_2$ und $\\sigma_1<\\sigma_2$","$\\mu_1=\\mu_2$ und $\\sigma_1<\\sigma_2$"],c:0,h:"Das Maximum liegt bei $\\mu$. Je breiter und flacher die Kurve, desto größer $\\sigma$.",e:"Die blaue Kurve hat ihr Maximum weiter links ($\\mu_1<\\mu_2$) und ist schmaler und höher ($\\sigma_1<\\sigma_2$).",p:"Hohe schmale Kurve heißt kleines $\\sigma$, nicht großes.",g:{k:"norm",mu:40,s:4,c2:{mu:60,s:8},t1:"X₁",t2:"X₂",ticks:[20,30,40,50,60,70,80],cap:"Dichtefunktionen von $X_1$ (blau) und $X_2$ (rot)"}},
{id:"s33",a:"sto",t:"num",tg:"Baumdiagramm",op:"Berechnen",te:"A",lv:2,q:"Für die Ereignisse $A$ und $B$ gilt das abgebildete Baumdiagramm. Berechnen Sie $P(B)$.",v:0.5,tol:0.0001,h:"Welche beiden Pfade enden bei $B$?",e:"$P(B)=0{,}6\\cdot0{,}7+0{,}4\\cdot0{,}2=0{,}42+0{,}08=0{,}5$.",p:"Beide Pfade zu $B$ addieren, nicht nur den ersten.",g:{k:"tree",L1:[["A",0.6],["Ā",0.4]],L2:[[["B",0.7],["B̄",0.3]],[["B",0.2],["B̄",0.8]]],cap:"Baumdiagramm mit den Ereignissen $A$ und $B$"}},
{id:"s34",a:"sto",t:"num",tg:"Bedingte Wahrscheinlichkeit",op:"Berechnen",te:"A",lv:3,q:"Für die Ereignisse $A$ und $B$ gilt das abgebildete Baumdiagramm. Berechnen Sie $P_B(A)$.",v:0.84,tol:0.001,h:"$P_B(A)=\\dfrac{P(A\\cap B)}{P(B)}$. Berechne zuerst $P(B)$.",e:"$P(A\\cap B)=0{,}6\\cdot0{,}7=0{,}42$. $P(B)=0{,}42+0{,}4\\cdot0{,}2=0{,}5$. $P_B(A)=\\dfrac{0{,}42}{0{,}5}=0{,}84$.",p:"Die Bedingung $B$ steht im Nenner und hinter dem senkrechten Strich. Nicht $P_A(B)=0{,}7$ angeben.",g:{k:"tree",L1:[["A",0.6],["Ā",0.4]],L2:[[["B",0.7],["B̄",0.3]],[["B",0.2],["B̄",0.8]]],cap:"Baumdiagramm mit den Ereignissen $A$ und $B$"}},
{id:"s35",a:"sto",t:"num",tg:"Pfadregeln",op:"Berechnen",te:"A",lv:2,q:"Eine Urne enthält 3 rote (R) und 2 blaue (B) Kugeln. Es wird zweimal ohne Zurücklegen gezogen. Berechnen Sie die Wahrscheinlichkeit für zwei Kugeln **verschiedener** Farbe.",v:0.6,tol:0.0001,h:"Zwei Pfade: erst R dann B, und erst B dann R.",e:"$P=\\dfrac{3}{5}\\cdot\\dfrac{2}{4}+\\dfrac{2}{5}\\cdot\\dfrac{3}{4}=0{,}3+0{,}3=0{,}6$.",p:"Beide Reihenfolgen berücksichtigen.",g:{k:"tree",L1:[["R","3/5"],["B","2/5"]],L2:[[["R","2/4"],["B","2/4"]],[["R","3/4"],["B","1/4"]]],cap:"Ziehen ohne Zurücklegen"}},
{id:"s36",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist binomialverteilt mit $n=30$ und $p=0{,}15$. Berechnen Sie $P(X\\geq5)$ (vier Nachkommastellen).",v:0.4755,tol:0.0003,h:"Gegenereignis: $P(X\\geq5)=1-P(X\\leq4)$.",e:"$P(X\\geq5)=1-P(X\\leq4)\\approx1-0{,}5245=0{,}4755$.",p:"„Mindestens 5“ heißt $1-P(X\\leq4)$, nicht $1-P(X\\leq5)$.",gg:"`1 - Binomial(30, 0.15, 4, true)`. Oder direkt: `Binomial(30, 0.15, 5…30)` (die drei Punkte `…` stehen für „bis“)."},
{id:"s37",a:"sto",t:"num",tg:"σ-Regeln",op:"Berechnen",te:"B",lv:3,q:"$X$ ist binomialverteilt mit $n=200$ und $p=0{,}4$. Berechnen Sie die Wahrscheinlichkeit, dass $X$ im Intervall $[\\mu-2\\sigma;\\,\\mu+2\\sigma]$ liegt (vier Nachkommastellen).",v:0.9489,tol:0.0005,h:"$\\mu$ und $\\sigma$ bestimmen. Die Intervallgrenzen sind keine ganzen Zahlen: Welche ganzen Zahlen liegen im Intervall?",e:"$\\mu=80$, $\\sigma=\\sqrt{200\\cdot0{,}4\\cdot0{,}6}\\approx6{,}93$. Intervall $[66{,}14;\\,93{,}86]$, also $k=67,\\dots,93$. $P(67\\leq X\\leq93)\\approx0{,}9489$. Das passt zur $2\\sigma$-Regel ($\\approx95\\,\\%$).",p:"Grenzen **ein**schließen: untere Grenze aufrunden, obere abrunden.",gg:"`Binomial(200, 0.4, 67…93)`. Die Grenzen vorher mit `80 - 2 sqrt(200*0.4*0.6)` und `80 + 2 sqrt(200*0.4*0.6)` bestimmen."},
{id:"s38",a:"sto",t:"num",tg:"Normalverteilung",op:"Bestimmen",te:"B",lv:3,q:"$X$ ist normalverteilt mit $\\mu=100$ und $\\sigma=15$. Bestimmen Sie die Zahl $x$ mit $P(X\\leq x)=0{,}9$ (zwei Nachkommastellen).",v:119.22,tol:0.02,h:"Umkehraufgabe: Gesucht ist die Stelle zu einer gegebenen Wahrscheinlichkeit.",e:"Mit der Umkehrfunktion der Verteilungsfunktion erhält man $x\\approx119{,}22$. Probe: $P(X\\leq119{,}22)\\approx0{,}9$.",p:"Probe mit der Verteilungsfunktion nicht vergessen.",gg:"`InversNormal(100, 15, 0.9)`. Probe: `Normal(100, 15, 119.22, true)`.",g:{k:"norm",mu:100,s:15,shade:[null,119.22],ticks:[55,70,85,100,119.22,130,145],cap:"Gesucht ist die Grenze, links davon liegt die Fläche $0{,}9$"}},
{id:"s39",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:3,q:"Die Zufallsgröße $X$ hat die abgebildete Verteilung ($E(X)=1{,}6$). Berechnen Sie die Standardabweichung $\\sigma$ (vier Nachkommastellen).",v:0.9165,tol:0.001,h:"$\\mathrm{Var}(X)=E(X^{2})-\\mu^{2}$ und $\\sigma=\\sqrt{\\mathrm{Var}(X)}$.",e:"$E(X^{2})=0\\cdot0{,}1+1\\cdot0{,}4+4\\cdot0{,}3+9\\cdot0{,}2=3{,}4$. $\\mathrm{Var}(X)=3{,}4-1{,}6^{2}=0{,}84$. $\\sigma=\\sqrt{0{,}84}\\approx0{,}9165$.",p:"Aus der Varianz noch die Wurzel ziehen.",g:{k:"bars",v:[[0,0.1],[1,0.4],[2,0.3],[3,0.2]],cap:"Verteilung von $X$: $P(0)=0{,}1$, $P(1)=0{,}4$, $P(2)=0{,}3$, $P(3)=0{,}2$"}},
{id:"s40",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"B",lv:3,q:"Ein Bauteil ist mit Wahrscheinlichkeit $p=0{,}05$ defekt. Bestimmen Sie, wie viele Bauteile man mindestens prüfen muss, damit mit mindestens $95\\,\\%$ Wahrscheinlichkeit mindestens ein defektes dabei ist.",v:59,tol:0.0001,h:"$1-0{,}95^{n}\\geq0{,}95$.",e:"$0{,}95^{n}\\leq0{,}05$ ergibt $n\\geq\\dfrac{\\ln(0{,}05)}{\\ln(0{,}95)}\\approx58{,}4$. Also $n=59$.",p:"Relationszeichen beim Teilen durch $\\ln(0{,}95)<0$ drehen. Aufrunden.",gg:"`InversBinomialMinimumVersuche(0.05, 0.05, 0)` liefert das kleinste $n$ mit $P(X\\leq0)\\leq0{,}05$. Reihenfolge der Argumente: kumulierte Wahrscheinlichkeit, Erfolgswahrscheinlichkeit, Trefferzahl."},
{id:"s41",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"A",lv:3,q:"Für eine binomialverteilte Zufallsgröße gilt $\\mu=12$ und $\\sigma^{2}=7{,}2$. Bestimmen Sie $n$.",v:30,tol:0.0001,h:"$\\mu=n\\cdot p$ und $\\sigma^{2}=n\\cdot p\\cdot(1-p)$. Teile die zweite durch die erste Gleichung.",e:"$\\dfrac{\\sigma^{2}}{\\mu}=1-p=\\dfrac{7{,}2}{12}=0{,}6$, also $p=0{,}4$. Dann $n=\\dfrac{\\mu}{p}=\\dfrac{12}{0{,}4}=30$.",p:"Erst $p$ bestimmen, dann $n$.",gg:"`Löse({n p = 12, n p (1-p) = 7.2}, {n, p})`."},
{id:"s42",a:"sto",t:"mc",tg:"Binomialverteilung",op:"Angeben",te:"A",lv:2,q:"Eine Zufallsgröße $X$ ist $B(20;\\,0{,}1)$-verteilt. Welcher Term gibt die Wahrscheinlichkeit für **genau 2** Treffer an?",o:["$\\dbinom{20}{2}\\cdot0{,}1^{2}\\cdot0{,}9^{18}$","$\\dbinom{20}{2}\\cdot0{,}1^{18}\\cdot0{,}9^{2}$","$0{,}1^{2}\\cdot0{,}9^{18}$","$\\dbinom{20}{18}\\cdot0{,}1^{2}\\cdot0{,}9^{2}$"],c:0,h:"Bernoulli-Formel: Anzahl der Pfade, Treffer-Faktoren, Nichttreffer-Faktoren.",e:"2 Treffer mit $p=0{,}1$ und 18 Nichttreffer mit $1-p=0{,}9$. Dazu der Binomialkoeffizient $\\binom{20}{2}$ für die Anordnungen.",p:"Die Exponenten müssen zusammen $n=20$ ergeben. Den Binomialkoeffizienten nicht vergessen."}
];

var K=[
{id:"k1",a:"ana",te:"A",title:"Analysis ohne Hilfsmittel",pts:10,min:20,intro:"Gegeben ist $f(x)=x^{2}\\cdot e^{-x}$ mit $x\\in\\mathbb{R}$. Keine Hilfsmittel außer Formelsammlung und Zeichengeräten.",g:{k:"fn",x:[-1,8],y:[-0.2,0.8],f:[{e:"x**2*exp(-x)",t:"f",lx:5}],cap:"Graph von $f$"},parts:[
{op:"Bestimmen",q:"Bestimmen Sie $f'(x)$ und klammern Sie $e^{-x}$ aus.",pts:3,mod:"Produktregel mit $u=x^{2}$, $v=e^{-x}$. Kettenregel: $v'=-e^{-x}$.\n$f'(x)=2x\\cdot e^{-x}+x^{2}\\cdot(-e^{-x})=x\\cdot(2-x)\\cdot e^{-x}$.",cr:[["Produktregel angesetzt ($u$, $v$, $u'$, $v'$)",1],["Innere Ableitung $-1$ bei $e^{-x}$ beachtet",1],["Ergebnis korrekt und ausgeklammert",1]],tip:"Das Minuszeichen bei $(e^{-x})'$ wird oft vergessen."},
{op:"Berechnen",q:"Berechnen Sie die Extremstellen von $f$ und bestimmen Sie deren Art.",pts:4,mod:"$f'(x)=0\\Leftrightarrow x\\cdot(2-x)\\cdot e^{-x}=0$. Wegen $e^{-x}>0$ folgt $x=0$ oder $x=2$.\nVorzeichen von $f'$: für $x<0$ negativ, für $0<x<2$ positiv, für $x>2$ negativ.\nAlso Tiefpunkt $T(0\\,|\\,0)$ und Hochpunkt $H(2\\,|\\,4e^{-2})$.",cr:[["$e^{-x}>0$ begründet und Nullstellen von $f'$ gesucht",1],["$x=0$ und $x=2$",1],["Art begründet (Vorzeichenwechsel von $f'$ oder $f''$)",1],["$y$-Werte $T(0\\,|\\,0)$ und $H(2\\,|\\,4e^{-2})$",1]],tip:"Die Art der Extremstelle nicht nur behaupten, sondern mit $f''$ oder dem Vorzeichenwechsel begründen."},
{op:"Begründen",q:"Begründen Sie, dass $f(x)$ für $x\\to\\infty$ gegen 0 strebt.",pts:3,mod:"$f(x)=\\dfrac{x^{2}}{e^{x}}$. Die Exponentialfunktion wächst für $x\\to\\infty$ schneller als jede Potenz von $x$. Daher geht der Quotient gegen 0. Die $x$-Achse ist waagerechte Asymptote.",cr:[["Umformung $f(x)=\\frac{x^{2}}{e^{x}}$",1],["Wachstumsvergleich: $e^{x}$ wächst schneller als $x^{2}$",1],["Grenzwert 0 bzw. Asymptote genannt",1]],tip:"Ein Grenzwert braucht eine Begründung, nicht nur das Ergebnis."}
]},
{id:"k2",a:"geo",te:"A",title:"Geometrie ohne Hilfsmittel",pts:10,min:20,intro:"Gegeben sind die Ebene $E:\\ 2x_1-x_2+2x_3=9$ und der Punkt $P(1\\,|\\,1\\,|\\,1)$.",parts:[
{op:"Berechnen",q:"Berechnen Sie den Abstand von $P$ zur Ebene $E$.",pts:3,mod:"$\\vec n=\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}$, $|\\vec n|=\\sqrt{4+1+4}=3$.\n$d=\\dfrac{|2\\cdot1-1+2\\cdot1-9|}{3}=\\dfrac{|3-9|}{3}=2$.",cr:[["Formel bzw. Ansatz mit $|\\vec n|$",1],["$|\\vec n|=3$ korrekt",1],["Einsetzen und Ergebnis $d=2$",1]],tip:"Das „$-9$“ nicht vergessen: $|3-9|$, nicht $|3|$."},
{op:"Bestimmen",q:"Bestimmen Sie den Lotfußpunkt $F$ des Lotes von $P$ auf $E$.",pts:4,mod:"Lotgerade: $\\vec x=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+r\\cdot\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}$.\nIn $E$: $2(1+2r)-(1-r)+2(1+2r)=3+9r=9$, also $r=\\frac{2}{3}$.\n$F(\\frac{7}{3}\\,|\\,\\frac{1}{3}\\,|\\,\\frac{7}{3})$.",cr:[["Lotgerade mit Richtung $\\vec n$ aufgestellt",1],["In $E$ eingesetzt",1],["$r=\\frac{2}{3}$",1],["$F(\\frac{7}{3}\\,|\\,\\frac{1}{3}\\,|\\,\\frac{7}{3})$",1]],tip:"Probe: $|\\overrightarrow{PF}|=r\\cdot|\\vec n|=\\frac{2}{3}\\cdot3=2$ stimmt mit dem Abstand überein."},
{op:"Begründen",q:"Die Gerade $g$ verläuft durch $P$ mit dem Richtungsvektor $\\vec u=\\begin{pmatrix}1\\\\2\\\\0\\end{pmatrix}$. Begründen Sie, dass $g$ parallel zu $E$ verläuft und nicht in $E$ liegt.",pts:3,mod:"$\\vec n\\cdot\\vec u=2\\cdot1+(-1)\\cdot2+2\\cdot0=0$. Also ist $g$ parallel zu $E$ oder liegt in $E$.\n$P$ liegt auf $g$, aber $2\\cdot1-1+2\\cdot1=3\\neq9$. $P$ liegt nicht in $E$. Also liegt $g$ nicht in $E$ und ist echt parallel zu $E$.",cr:[["$\\vec n\\cdot\\vec u=0$ berechnet und gedeutet",1],["Aufpunkt in $E$ eingesetzt ($3\\neq9$)",1],["Schluss: echt parallel",1]],tip:"Zwei Schritte: Richtung und Aufpunkt."}
]},
{id:"k3",a:"sto",te:"A",title:"Stochastik ohne Hilfsmittel",pts:10,min:20,intro:"Ein Glücksrad hat die Trefferwahrscheinlichkeit $p=0{,}25$. Es wird viermal gedreht. $X$ gibt die Anzahl der Treffer an. $X$ wird als binomialverteilt angenommen.",g:{k:"bars",n:4,p:0.25,from:0,to:4,cap:"Verteilung von $X\\sim B(4;\\,0{,}25)$"},parts:[
{op:"Berechnen",q:"Berechnen Sie die Wahrscheinlichkeit für genau einen Treffer.",pts:3,mod:"$P(X=1)=\\dbinom{4}{1}\\cdot0{,}25\\cdot0{,}75^{3}=4\\cdot0{,}25\\cdot0{,}421875=0{,}421875\\approx42{,}2\\,\\%$.",cr:[["Binomialansatz mit $n=4$ und $p=0{,}25$",1],["Binomialkoeffizient 4",1],["Ergebnis $\\approx0{,}422$",1]],tip:"Die Potenzen $0{,}25^{k}$ und $0{,}75^{n-k}$: Die Exponenten summieren sich zu $n$."},
{op:"Angeben",q:"Geben Sie einen Term für $P(X\\geq3)$ an.",pts:2,mod:"$P(X\\geq3)=P(X=3)+P(X=4)=\\dbinom{4}{3}\\cdot0{,}25^{3}\\cdot0{,}75+0{,}25^{4}$.",cr:[["$P(X=3)$ korrekt",1],["$P(X=4)$ addiert",1]],tip:"„Mindestens 3“ sind die Werte 3 und 4, nicht nur 3."},
{op:"Bestimmen",q:"Bestimmen Sie den Erwartungswert und die Standardabweichung von $X$.",pts:2,mod:"$\\mu=4\\cdot0{,}25=1$. $\\sigma=\\sqrt{4\\cdot0{,}25\\cdot0{,}75}=\\sqrt{0{,}75}\\approx0{,}87$.",cr:[["$\\mu=n\\cdot p=1$",1],["$\\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}$ mit Einsetzen",1]],tip:""},
{op:"Beurteilen",q:"Beurteilen Sie die Aussage: „Mit einer Wahrscheinlichkeit von mehr als $50\\,\\%$ gibt es höchstens einen Treffer.“",pts:3,mod:"$P(X=0)=0{,}75^{4}\\approx0{,}316$. $P(X=1)\\approx0{,}422$. $P(X\\leq1)\\approx0{,}738>0{,}5$. Die Aussage ist richtig.",cr:[["$P(X=0)=0{,}75^{4}\\approx0{,}316$",1],["$P(X\\leq1)\\approx0{,}738$",1],["Urteil mit Begründung: größer als $0{,}5$, Aussage richtig",1]],tip:"Beurteilen verlangt ein Urteil und die Begründung dazu."}
]},
{id:"k4",a:"ana",te:"B",title:"Analysis mit Hilfsmittel: Medikament",pts:15,min:45,intro:"Die Konzentration eines Medikaments im Blut wird modelliert durch $k(t)=20\\cdot t\\cdot e^{-0{,}5t}$. Dabei ist $t$ die Zeit in Stunden nach der Einnahme und $k(t)$ die Konzentration in mg/l.",g:{k:"fn",x:[-0.5,12],y:[-2,16],f:[{e:"20*x*exp(-0.5*x)",t:"k",lx:9}],cap:"Konzentration $k(t)$ in mg/l, $t$ in Stunden"},parts:[
{op:"Bestimmen",q:"Bestimmen Sie den Zeitpunkt der höchsten Konzentration und deren Wert.",pts:4,mod:"$k'(t)=20\\cdot e^{-0{,}5t}\\cdot(1-0{,}5t)=0$ ergibt $t=2$.\nVorzeichenwechsel von $k'$ von $+$ nach $-$ (oder $k''(2)<0$): Maximum.\n$k(2)=\\dfrac{40}{e}\\approx14{,}7\\ \\text{mg/l}$.",cr:[["$k'$ korrekt (Produkt- und Kettenregel)",1],["$k'(t)=0$ ergibt $t=2$",1],["Maximum begründet (Vorzeichenwechsel oder $k''$)",1],["$k(2)\\approx14{,}7$ mg/l mit Einheit",1]],tip:"Einheit im Antwortsatz angeben."},
{op:"Bestimmen",q:"Bestimmen Sie, in welchem Zeitraum die Konzentration mindestens 5 mg/l beträgt.",pts:3,mod:"$k(t)=5$ liefert $t\\approx0{,}29$ und $t\\approx6{,}52$. Dazwischen ist $k(t)\\geq5$ (Graph oder $k(2)\\approx14{,}7$ prüfen).\nZeitraum: etwa $0{,}29\\,\\text{h}$ bis $6{,}52\\,\\text{h}$, also rund $6{,}2$ Stunden lang.",cr:[["Ansatz $k(t)=5$ bzw. Ungleichung",1],["Beide Lösungen $0{,}29$ und $6{,}52$",1],["Zeitraum im Sachzusammenhang angegeben ($\\approx6{,}2$ h)",1]],tip:"Es gibt zwei Lösungen. Den Graphen oder einen Testwert zur Prüfung nutzen."},
{op:"Berechnen",q:"Berechnen Sie die mittlere Konzentration in den ersten 6 Stunden.",pts:4,mod:"Mittelwert $=\\dfrac{1}{6-0}\\cdot\\displaystyle\\int_{0}^{6}k(t)\\,dt\\approx\\dfrac{64{,}07}{6}\\approx10{,}7\\ \\text{mg/l}$.",cr:[["Formel für den Mittelwert $\\frac{1}{b-a}\\int$",1],["Integral mit den Grenzen 0 und 6 angesetzt",1],["Integralwert $\\approx64{,}07$",1],["Ergebnis $\\approx10{,}7$ mg/l",1]],tip:"Das Integral allein ist nicht der Mittelwert: durch die Länge des Intervalls teilen."},

var CARDS=[
["Abstand Punkt–Ebene","Für $E:\\ ax_1+bx_2+cx_3=d$ und $P(p_1\\,|\\,p_2\\,|\\,p_3)$ gilt:\n$$d(P,E)=\\frac{|a\\,p_1+b\\,p_2+c\\,p_3-d|}{\\sqrt{a^{2}+b^{2}+c^{2}}}$$Beispiel: $E:\\ x_1+2x_2+2x_3=3$, $Q(1\\,|\\,1\\,|\\,1)$ ergibt $d=\\frac{|5-3|}{3}=\\frac{2}{3}$."],
["Produkt- und Kettenregel","$$(u\\cdot v)'=u'\\cdot v+u\\cdot v'\\qquad\\big(f(g(x))\\big)'=f'(g(x))\\cdot g'(x)$$Beispiel: $\\big(x\\cdot e^{-2x}\\big)'=e^{-2x}+x\\cdot(-2)\\cdot e^{-2x}=e^{-2x}\\cdot(1-2x)$."],
["Extremstellen","Notwendig: $f'(x_0)=0$.\nHinreichend: $f''(x_0)<0$ ergibt Hochpunkt, $f''(x_0)>0$ ergibt Tiefpunkt.\nAlternativ: Vorzeichenwechsel von $f'$ (von $+$ nach $-$: Hochpunkt)."],
["Wendestellen","Notwendig: $f''(x_0)=0$.\nHinreichend: $f'''(x_0)\\neq0$ oder Vorzeichenwechsel von $f''$.\nStärkste Zu- oder Abnahme von $f$: Extremum von $f'$, also Wendestelle von $f$."],
["Integral und Hauptsatz","$$\\int_{a}^{b}f(x)\\,dx=F(b)-F(a)$$$J(x)=\\displaystyle\\int_{a}^{x}f(t)\\,dt$ hat die Ableitung $J'(x)=f(x)$.\nMittelwert von $f$ auf $[a;b]$: $\\ \\dfrac{1}{b-a}\\displaystyle\\int_{a}^{b}f(x)\\,dx$."],
["Fläche zwischen Graphen","Schnittstellen $x_1<x_2$ aus $f(x)=g(x)$ bestimmen.\n$$A=\\int_{x_1}^{x_2}\\big|f(x)-g(x)\\big|\\,dx$$Liegt $f$ oberhalb von $g$: $A=\\int_{x_1}^{x_2}\\big(f(x)-g(x)\\big)dx$. Wechselt das Vorzeichen, Teilintervalle bilden oder den Betrag integrieren."],
["Sinusfunktion","$f(x)=a\\cdot\\sin\\big(b\\,(x-c)\\big)+d$\nAmplitude $|a|$, Periode $\\dfrac{2\\pi}{b}$, Mittellinie $y=d$, Verschiebung in $x$-Richtung um $c$.\nWertebereich: $[d-|a|;\\ d+|a|]$."],
["Logarithmus und e-Funktion","$\\ln(x)$ hat $D=\\,]0;\\infty[$ und die Ableitung $\\dfrac{1}{x}$.\n$\\ln(a\\cdot b)=\\ln(a)+\\ln(b)$, $\\ \\ln(a^{r})=r\\cdot\\ln(a)$.\n$e^{x}=c$ ergibt $x=\\ln(c)$. Es gilt $e^{x}>0$ für alle $x$."],
["Steckbriefaufgaben","Ganzrationale Funktion vom Grad $n$ hat $n+1$ Koeffizienten, braucht also $n+1$ Bedingungen.\nPunkt $(x_0\\,|\\,y_0)$: $f(x_0)=y_0$. Extrempunkt: zusätzlich $f'(x_0)=0$. Wendepunkt: $f''(x_0)=0$. Waagerechte Tangente: $f'(x_0)=0$. Symmetrie zur $y$-Achse: nur gerade Exponenten."],
["Skalarprodukt und Winkel","$$\\vec a\\cdot\\vec b=a_1b_1+a_2b_2+a_3b_3\\qquad\\cos\\varphi=\\frac{\\vec a\\cdot\\vec b}{|\\vec a|\\cdot|\\vec b|}$$$\\vec a\\cdot\\vec b=0$ genau dann, wenn $\\vec a\\perp\\vec b$. Länge: $|\\vec a|=\\sqrt{a_1^{2}+a_2^{2}+a_3^{2}}$."],
["Schnittwinkel","Gerade–Gerade: $\\cos\\varphi=\\dfrac{|\\vec u\\cdot\\vec v|}{|\\vec u|\\cdot|\\vec v|}$\nGerade–Ebene: $\\sin\\alpha=\\dfrac{|\\vec u\\cdot\\vec n|}{|\\vec u|\\cdot|\\vec n|}$\nEbene–Ebene: $\\cos\\varphi=\\dfrac{|\\vec n_1\\cdot\\vec n_2|}{|\\vec n_1|\\cdot|\\vec n_2|}$"],
["Lagebeziehung Gerade–Ebene","$\\vec u\\cdot\\vec n\\neq0$: genau ein Schnittpunkt (Gerade in $E$ einsetzen, $r$ bestimmen).\n$\\vec u\\cdot\\vec n=0$: Aufpunkt in $E$ einsetzen. Stimmt es, liegt $g$ in $E$. Sonst ist $g$ echt parallel."],
["Lagebeziehung Gerade–Gerade","Richtungsvektoren parallel? Dann identisch oder echt parallel (Aufpunkt prüfen).\nNicht parallel? Gleichsetzen: eine Lösung ergibt einen Schnittpunkt, keine Lösung ergibt windschief."],
["Ebenengleichungen","Parameterform: $\\vec x=\\vec p+r\\cdot\\vec u+s\\cdot\\vec v$\nNormalenform: $\\vec n\\cdot(\\vec x-\\vec p)=0$\nKoordinatenform: $ax_1+bx_2+cx_3=d$ mit $\\vec n=\\begin{pmatrix}a\\\\b\\\\c\\end{pmatrix}$.\nVon Parameter- zur Koordinatenform: $\\vec n$ aus $\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$ (LGS), dann Aufpunkt einsetzen."],
["Lotfußpunkt und Spiegelung","Lotgerade durch $P$ mit Richtung $\\vec n$, Schnitt mit $E$ ergibt den Lotfußpunkt $F$.\nSpiegelpunkt: $\\overrightarrow{OP'}=\\overrightarrow{OP}+2\\cdot\\overrightarrow{PF}$."],
["Binomialverteilung","$$P(X=k)=\\binom{n}{k}\\cdot p^{k}\\cdot(1-p)^{n-k}$$$\\mu=n\\cdot p$, $\\ \\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}$\nMindestens $k$: $P(X\\geq k)=1-P(X\\leq k-1)$."],
["Bedingte Wahrscheinlichkeit","$$P_A(B)=\\frac{P(A\\cap B)}{P(A)}$$Pfadregel: Wahrscheinlichkeiten entlang eines Pfades multiplizieren, Pfade addieren.\nUnabhängig: $P(A\\cap B)=P(A)\\cdot P(B)$."],
["Normalverteilung und σ-Regeln","Glockenkurve symmetrisch um $\\mu$, Breite durch $\\sigma$.\nEtwa $68\\,\\%$ in $\\mu\\pm\\sigma$, $95\\,\\%$ in $\\mu\\pm2\\sigma$, $99{,}7\\,\\%$ in $\\mu\\pm3\\sigma$.\n$P(a\\leq X\\leq b)=F(b)-F(a)$ mit der Verteilungsfunktion $F$."],
["Erwartungswert und Varianz","$$E(X)=\\sum x_i\\cdot P(x_i)\\qquad\\mathrm{Var}(X)=\\sum(x_i-\\mu)^{2}\\cdot P(x_i)=E(X^{2})-\\mu^{2}$$Standardabweichung $\\sigma=\\sqrt{\\mathrm{Var}(X)}$."],
["Aufbau der Prüfung (Leistungskurs)","Laut Abiturvorgaben 2027 in euren Unterlagen:\nTeil 1 ohne Hilfsmittel: 4 Pflichtaufgaben (2 Analysis, 1 Vektorielle Geometrie, 1 Stochastik) und 2 Wahlpflichtaufgaben aus 6. Teil 2 mit Hilfsmittel (WTR oder CAS/MMS): 3 Aufgaben, je eine pro Sachgebiet. Die Lehrkraft wählt eine von zwei Analysisaufgaben.\nArbeitszeit einschließlich Auswahlzeit: 300 Minuten. Zugelassen sind eine Formelsammlung oder das „Dokument mit mathematischen Formeln“ und ein Wörterbuch."]
];

{id:"a45",a:"ana",t:"num",tg:"Substitution",op:"Bestimmen",te:"A",lv:2,q:"Bestimmen Sie die größte Nullstelle von $f(x)=x^{4}-5x^{2}+4$.",v:2,tol:0.0001,h:"Setze $z=x^{2}$. Dann steht dort eine quadratische Gleichung in $z$.",e:"$z=x^{2}$: $z^{2}-5z+4=0$ ergibt $z_1=1$ und $z_2=4$. Rücksubstitution: $x=\\pm1$ oder $x=\\pm2$. Die größte Nullstelle ist $x=2$.",p:"Nach dem Lösen in $z$ die Rücksubstitution nicht vergessen. Jedes positive $z$ liefert zwei Lösungen $\\pm\\sqrt{z}$.",gg:"`Löse(x^4 - 5x^2 + 4 = 0, x)` liefert alle vier Nullstellen direkt."},
{id:"a46",a:"ana",t:"num",tg:"Substitution",op:"Bestimmen",te:"A",lv:3,q:"Bestimmen Sie die positive Lösung der Gleichung $e^{2x}-3e^{x}+2=0$ (vier Nachkommastellen).",v:0.6931,tol:0.0006,h:"Setze $z=e^{x}$. Beachte $e^{2x}=(e^{x})^{2}$.",e:"$z=e^{x}$: $z^{2}-3z+2=0$ ergibt $z_1=1$ und $z_2=2$. Rücksubstitution: $e^{x}=1$ gibt $x=0$, $e^{x}=2$ gibt $x=\\ln(2)\\approx0{,}6931$.",p:"$e^{x}=z$ ist immer positiv. Ein negatives $z$ hätte keine Lösung.",gg:"`Löse(e^(2x) - 3e^x + 2 = 0, x)`. Die Eulersche Zahl tippst du als `e`."},
{id:"a47",a:"ana",t:"mc",tg:"Ortskurve",op:"Bestimmen",te:"A",lv:2,q:"Gegeben ist die Schar $f_t(x)=-x^{2}+2tx$ mit $t\\in\\mathbb{R}$. Alle Hochpunkte liegen auf einer Kurve. Welche Gleichung hat diese Ortskurve?",o:["$y=x^{2}$","$y=-x^{2}$","$y=2x^{2}$","$y=t^{2}$"],c:0,h:"Bestimme den Hochpunkt $H_t$ in Abhängigkeit von $t$. Dann $t$ aus der $x$-Koordinate in die $y$-Koordinate einsetzen.",e:"$f_t'(x)=-2x+2t=0$ ergibt $x=t$. $f_t(t)=-t^{2}+2t^{2}=t^{2}$. Also $H_t(t\\,|\\,t^{2})$. Mit $x=t$ folgt $y=x^{2}$.",p:"Die Ortskurve darf kein $t$ mehr enthalten. Genau das prüft der Operator „Bestimmen“ hier.",g:{k:"fn",x:[-1,4.5],y:[-1,10],f:[{e:"-(x**2)+2*1*x",t:"t=1",lx:2.3},{e:"-(x**2)+2*2*x",t:"t=2",lx:3.6},{e:"-(x**2)+2*3*x",t:"t=3",lx:3.95}],p:[[1,1,"H","u"],[2,4,"H","u"],[3,9,"H","l"]],cap:"Drei Graphen der Schar mit ihren Hochpunkten"}},
{id:"a48",a:"ana",t:"mc",tg:"Ortskurve",op:"Bestimmen",te:"A",lv:3,q:"Für $t>0$ hat $f_t(x)=x^{3}-3tx$ einen Tiefpunkt. Welche Gleichung hat die Ortskurve aller Tiefpunkte (für $x>0$)?",o:["$y=-2x^{3}$","$y=-2x^{2}$","$y=x^{3}-3x$","$y=2x^{3}$"],c:0,h:"$f_t'(x)=0$ gibt $x$ in Abhängigkeit von $t$. Löse nach $t$ auf und setze ein.",e:"$f_t'(x)=3x^{2}-3t=0$ ergibt $x=\\sqrt{t}$ (Tiefpunkt, da $f_t''(\\sqrt{t})=6\\sqrt{t}>0$). $y=t\\sqrt{t}-3t\\sqrt{t}=-2t\\sqrt{t}$. Aus $x=\\sqrt{t}$ folgt $t=x^{2}$, also $y=-2x^{2}\\cdot x=-2x^{3}$.",p:"Zuerst $t=x^{2}$ aus der $x$-Koordinate gewinnen, erst dann in $y$ einsetzen."},
{id:"a49",a:"ana",t:"num",tg:"Umkehrfunktion",op:"Berechnen",te:"A",lv:2,q:"Die Funktion $f(x)=x^{2}+1$ ist für $x\\geq0$ umkehrbar. Berechnen Sie $f^{-1}(10)$.",v:3,tol:0.0001,h:"$f^{-1}(10)$ ist die Stelle $x$ mit $f(x)=10$.",e:"$x^{2}+1=10$ ergibt $x^{2}=9$. Wegen $x\\geq0$ gilt $x=3$. Die Umkehrfunktion ist $f^{-1}(x)=\\sqrt{x-1}$, also $f^{-1}(10)=3$.",p:"Den Definitionsbereich $x\\geq0$ beachten, sonst gibt es zwei Lösungen. Ohne diese Einschränkung ist $f$ nicht umkehrbar."},
{id:"a50",a:"ana",t:"num",tg:"Umkehrfunktion",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=e^{x}+1$. Berechnen Sie $f^{-1}(4)$ (vier Nachkommastellen).",v:1.0986,tol:0.0006,h:"Löse $e^{x}+1=4$ nach $x$ auf.",e:"$e^{x}=3$ ergibt $x=\\ln(3)\\approx1{,}0986$. Die Umkehrfunktion ist $f^{-1}(x)=\\ln(x-1)$ für $x>1$.",p:"Der Definitionsbereich der Umkehrfunktion ist der Wertebereich von $f$, hier $x>1$."},
{id:"a51",a:"ana",t:"mc",tg:"Umkehrfunktion",op:"Begründen",te:"A",lv:2,q:"Welche der Funktionen ist auf ganz $\\mathbb{R}$ umkehrbar?",o:["$f(x)=x^{3}$","$f(x)=x^{2}$","$f(x)=|x|$","$f(x)=\\sin(x)$"],c:0,h:"Umkehrbar heißt: Jeder $y$-Wert wird höchstens einmal angenommen (streng monoton).",e:"$x^{3}$ ist streng monoton steigend, also umkehrbar. $x^{2}$ und $|x|$ sind achsensymmetrisch, nehmen also Werte doppelt an. $\\sin(x)$ ist periodisch.",p:"Zum Begründen „streng monoton“ oder „jeder $y$-Wert nur einmal“ sagen. Ein einzelnes Beispiel reicht nicht."},
{id:"a52",a:"ana",t:"num",tg:"Potenzfunktionen",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=x^{\\frac{3}{2}}$ für $x\\geq0$. Berechnen Sie $f'(4)$.",v:3,tol:0.0001,h:"Potenzregel: $(x^{r})'=r\\cdot x^{r-1}$ auch für rationale Exponenten.",e:"$f'(x)=\\frac{3}{2}x^{\\frac{1}{2}}=\\frac{3}{2}\\sqrt{x}$. $f'(4)=\\frac{3}{2}\\cdot2=3$.",p:"Den Exponenten um 1 verkleinern: $\\frac{3}{2}-1=\\frac{1}{2}$. Danach $\\sqrt{x}$ an der Stelle $4$ einsetzen."},
{id:"a53",a:"ana",t:"num",tg:"Potenzfunktionen",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie $\\displaystyle\\int_{1}^{4}\\sqrt{x}\\,dx$ (vier Nachkommastellen).",v:4.6667,tol:0.0006,h:"Schreibe $\\sqrt{x}=x^{\\frac{1}{2}}$. Stammfunktion: Exponent um 1 erhöhen, durch den neuen Exponenten teilen.",e:"$\\displaystyle\\int_{1}^{4}x^{\\frac{1}{2}}\\,dx=\\Big[\\tfrac{2}{3}x^{\\frac{3}{2}}\\Big]_{1}^{4}=\\tfrac{2}{3}\\cdot8-\\tfrac{2}{3}\\cdot1=\\tfrac{14}{3}\\approx4{,}6667$.",p:"Durch $\\frac{3}{2}$ teilen heißt mit $\\frac{2}{3}$ multiplizieren.",g:{k:"fn",x:[-0.5,5],y:[-0.5,2.6],f:[{e:"sqrt(x)",t:"f",lx:4.4}],a:{i:0,from:1,to:4},cap:"Fläche unter $f(x)=\\sqrt{x}$ zwischen $1$ und $4$"}},
{id:"a54",a:"ana",t:"num",tg:"Ableitung",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie für $f(x)=x^{2}$ den Differenzenquotienten $\\dfrac{f(3+h)-f(3)}{h}$ und bestimmen Sie daraus die Steigung bei $x=3$ für $h\\to0$.",v:6,tol:0.0001,h:"Multipliziere $(3+h)^{2}$ aus und kürze das $h$.",e:"$\\dfrac{(3+h)^{2}-9}{h}=\\dfrac{6h+h^{2}}{h}=6+h$. Für $h\\to0$ strebt das gegen $6$. Also $f'(3)=6$.",p:"Erst kürzen, dann den Grenzwert bilden. Nicht $h=0$ in den ungekürzten Bruch einsetzen."},
{id:"a55",a:"ana",t:"num",tg:"Integral",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie für $f(x)=x^{2}$ auf $[0;2]$ die Untersumme mit $n=4$ gleich breiten Streifen.",v:1.75,tol:0.0001,h:"Streifenbreite $0{,}5$. Weil $f$ steigt, nimmst du jeweils den linken Funktionswert.",e:"Breite $0{,}5$. Linke Funktionswerte: $f(0)=0$, $f(0{,}5)=0{,}25$, $f(1)=1$, $f(1{,}5)=2{,}25$. Summe $3{,}5$. Untersumme $=0{,}5\\cdot3{,}5=1{,}75$.",p:"Bei steigender Funktion ist links die Untersumme, rechts die Obersumme. Bei fallender Funktion ist es umgekehrt."},
{id:"a56",a:"ana",t:"num",tg:"Integral",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie für $f(x)=x^{2}$ auf $[0;2]$ die Obersumme mit $n=4$ gleich breiten Streifen.",v:3.75,tol:0.0001,h:"Jetzt nimmst du die rechten Funktionswerte.",e:"Rechte Funktionswerte: $f(0{,}5)=0{,}25$, $f(1)=1$, $f(1{,}5)=2{,}25$, $f(2)=4$. Summe $7{,}5$. Obersumme $=0{,}5\\cdot7{,}5=3{,}75$. Der exakte Wert $\\frac{8}{3}\\approx2{,}67$ liegt zwischen $1{,}75$ und $3{,}75$.",p:"Die Streifenbreite $0{,}5$ erst am Ende ausklammern, dann gibt es weniger Rechenfehler."},
{id:"a57",a:"ana",t:"num",tg:"Rotationskörper",op:"Berechnen",te:"B",lv:2,ks:1,q:"Die Fläche unter dem Graphen von $f(x)=\\sqrt{x}$ zwischen $x=0$ und $x=4$ rotiert um die $x$-Achse. Berechnen Sie das Volumen des Körpers (vier Nachkommastellen).",v:25.1327,tol:0.001,u:"VE",h:"$V=\\pi\\int_{a}^{b}\\big(f(x)\\big)^{2}\\,dx$.",e:"$V=\\pi\\displaystyle\\int_{0}^{4}x\\,dx=\\pi\\Big[\\tfrac{x^{2}}{2}\\Big]_{0}^{4}=8\\pi\\approx25{,}1327$ VE.",p:"Die Funktion wird quadriert, nicht die Stammfunktion. $\\pi$ steht vor dem Integral.",gg:"`pi * Integral(f(x)^2, 0, 4)`. Das $\\pi$ tippst du als `pi`.",g:{k:"fn",x:[-0.5,5],y:[-0.5,2.6],f:[{e:"sqrt(x)",t:"f",lx:4.4}],a:{i:0,from:0,to:4},cap:"Diese Fläche rotiert um die $x$-Achse"}},
{id:"a58",a:"ana",t:"num",tg:"Rotationskörper",op:"Berechnen",te:"B",lv:3,ks:1,q:"Die Fläche unter $f(x)=e^{-x}$ zwischen $x=0$ und $x=1$ rotiert um die $x$-Achse. Berechnen Sie das Volumen (vier Nachkommastellen).",v:1.3582,tol:0.001,u:"VE",h:"$\\big(e^{-x}\\big)^{2}=e^{-2x}$.",e:"$V=\\pi\\displaystyle\\int_{0}^{1}e^{-2x}\\,dx=\\pi\\Big[-\\tfrac{1}{2}e^{-2x}\\Big]_{0}^{1}=\\tfrac{\\pi}{2}\\big(1-e^{-2}\\big)\\approx1{,}3582$ VE.",p:"Beim Quadrieren der Exponenten verdoppeln. Beim Integrieren durch $-2$ teilen.",gg:"`pi * Integral(e^(-x)^2, 0, 1)` oder bequemer `pi * Integral(e^(-2x), 0, 1)`."},
{id:"a59",a:"ana",t:"num",tg:"Uneigentliche Integrale",op:"Berechnen",te:"B",lv:3,ks:1,q:"Berechnen Sie $\\displaystyle\\int_{1}^{\\infty}\\dfrac{1}{x^{2}}\\,dx$.",v:1,tol:0.0001,h:"Ersetze $\\infty$ durch eine Grenze $b$ und lasse dann $b\\to\\infty$ gehen.",e:"$\\displaystyle\\int_{1}^{b}x^{-2}\\,dx=\\Big[-\\tfrac{1}{x}\\Big]_{1}^{b}=1-\\tfrac{1}{b}$. Für $b\\to\\infty$ strebt das gegen $1$.",p:"Den Grenzwert hinschreiben. Nur das Ergebnis „1“ ohne Rechnung reicht nicht.",gg:"`Integral(x^(-2), x, 1, infinity)`. Das Unendlich-Zeichen kannst du als `infinity` tippen."},
{id:"a60",a:"ana",t:"num",tg:"Exponentialfunktionen",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=3e^{2x+1}$. Berechnen Sie $f'(0)$ (vier Nachkommastellen).",v:16.3097,tol:0.002,h:"Kettenregel: Die innere Ableitung von $2x+1$ ist $2$.",e:"$f'(x)=3\\cdot2\\cdot e^{2x+1}=6e^{2x+1}$. $f'(0)=6e\\approx16{,}3097$.",p:"Den Faktor 2 aus der inneren Ableitung nicht vergessen. Das ist ein Klassiker bei der Kettenregel."},
{id:"a61",a:"ana",t:"num",tg:"Exponentialfunktionen",op:"Bestimmen",te:"A",lv:2,q:"Bestimmen Sie die Lösung der Gleichung $5e^{0{,}3t}=20$ (vier Nachkommastellen).",v:4.621,tol:0.001,h:"Erst durch 5 teilen, dann den natürlichen Logarithmus anwenden.",e:"$e^{0{,}3t}=4$. $0{,}3t=\\ln(4)$. $t=\\dfrac{\\ln(4)}{0{,}3}\\approx4{,}6210$.",p:"Erst die Gleichung nach $e^{\\dots}$ umstellen, dann $\\ln$ anwenden. Nicht den Faktor 5 mitlogarithmieren.",gg:"`Löse(5 e^(0.3 t) = 20, t)`."},
{id:"a62",a:"ana",t:"num",tg:"Exponentialfunktionen",op:"Bestimmen",te:"A",lv:2,q:"Der Bestand eines Stoffs nimmt nach $N(t)=200\\cdot e^{-0{,}1t}$ ab ($t$ in Stunden). Bestimmen Sie, nach wie vielen Stunden nur noch die Hälfte übrig ist (vier Nachkommastellen).",v:6.9315,tol:0.002,u:"Stunden",h:"Setze $N(t)=100$.",e:"$200e^{-0{,}1t}=100$ ergibt $e^{-0{,}1t}=\\frac{1}{2}$. $-0{,}1t=-\\ln(2)$. $t=10\\ln(2)\\approx6{,}9315$.",p:"Im Antwortsatz die Einheit nennen. Die Halbwertszeit hängt nicht vom Anfangswert ab."},
{id:"a63",a:"ana",t:"num",tg:"Zusammengesetzte Funktionen",op:"Berechnen",te:"B",lv:3,q:"Die Konzentration eines Medikaments im Blut wird durch $f(t)=20t\\cdot e^{-0{,}5t}$ beschrieben ($t$ in Stunden, $t\\geq0$). Berechnen Sie die maximale Konzentration (vier Nachkommastellen).",v:14.7152,tol:0.002,h:"Produktregel und Kettenregel. $f'(t)=0$ ergibt den Zeitpunkt des Maximums.",e:"$f'(t)=20e^{-0{,}5t}+20t\\cdot(-0{,}5)e^{-0{,}5t}=20e^{-0{,}5t}(1-0{,}5t)$. $f'(t)=0$ ergibt $t=2$. $f''(2)<0$, also Hochpunkt. $f(2)=40e^{-1}\\approx14{,}7152$. Randwerte: $f(0)=0$ und $f(t)\\to0$ für $t\\to\\infty$.",p:"Maximum nachweisen (zweite Ableitung oder Vorzeichenwechsel) und die Randwerte ansehen.",gg:"`f(t)=20 t e^(-0.5 t)`, dann `Löse(f'(t)=0, t)`. Der Wert: `f(2)`."},
{id:"a64",a:"ana",t:"num",tg:"Zusammengesetzte Funktionen",op:"Bestimmen",te:"B",lv:3,q:"Die Zuflussrate eines Beckens beträgt $g(t)=t\\cdot e^{-0{,}6t}$ ($t$ in Stunden ab 8:00 Uhr). Bestimmen Sie, wie viele Minuten nach 8:00 Uhr die Rate am größten ist.",v:100,tol:0.5,u:"Minuten",h:"$g'(t)=0$. Das Ergebnis ist in Stunden. Rechne am Ende in Minuten um.",e:"$g'(t)=e^{-0{,}6t}(1-0{,}6t)=0$ ergibt $t=\\frac{5}{3}$ Stunden $=100$ Minuten, also um 9:40 Uhr.",p:"Zeiträume und Zeitpunkte immer minutengenau angeben. Aus $1{,}67$ Stunden werden $1\\,\\text{h}\\,40\\,\\text{min}$, nicht $1\\,\\text{h}\\,67\\,\\text{min}$."},
{id:"a65",a:"ana",t:"num",tg:"Extremwertproblem",op:"Berechnen",te:"B",lv:3,q:"Eine zylinderförmige Dose soll $330\\,\\text{ml}$ fassen. Berechnen Sie, bei welchem Radius $r$ die Oberfläche am kleinsten ist (in cm, vier Nachkommastellen).",v:3.7449,tol:0.002,u:"cm",h:"Hauptbedingung: $O=2\\pi r^{2}+2\\pi rh$. Nebenbedingung: $\\pi r^{2}h=330$. Löse die Nebenbedingung nach $h$ auf.",e:"$h=\\dfrac{330}{\\pi r^{2}}$. Zielfunktion: $O(r)=2\\pi r^{2}+\\dfrac{660}{r}$. $O'(r)=4\\pi r-\\dfrac{660}{r^{2}}=0$ ergibt $r^{3}=\\dfrac{165}{\\pi}$, also $r\\approx3{,}7449$ cm. Dann ist $h=2r$. $O''>0$, also Minimum.",p:"Nur eine Variable in der Zielfunktion. Die Randwerte ($r\\to0$ und $r\\to\\infty$) mit „Oberfläche wird beliebig groß“ begründen.",gg:"`Löse(4 pi r - 660 / r^2 = 0, r)` oder `Extremum(2 pi r^2 + 660/r, 1, 10)`, der zweite Befehl ist im Prüfungsmodus möglicherweise gesperrt."},
{id:"a66",a:"ana",t:"num",tg:"Extremwertproblem",op:"Bestimmen",te:"B",lv:3,q:"Ein Betrieb hat den Erlös $E(x)=12x$ und die Kosten $K(x)=0{,}02x^{3}-0{,}6x^{2}+7x+30$ ($x$ in Mengeneinheiten, $0\\leq x\\leq40$). Bestimmen Sie die gewinnmaximale Menge (zwei Nachkommastellen).",v:23.54,tol:0.02,u:"ME",h:"Gewinn $G(x)=E(x)-K(x)$. Ableiten und null setzen.",e:"$G(x)=-0{,}02x^{3}+0{,}6x^{2}+5x-30$. $G'(x)=-0{,}06x^{2}+1{,}2x+5=0$ ergibt $x\\approx23{,}54$ (die Lösung $-3{,}54$ liegt außerhalb). $G(23{,}54)\\approx159{,}29$. Randwerte: $G(0)=-30$ und $G(40)=-150$. Also ist $23{,}54$ ME die gewinnmaximale Menge.",p:"Randwerte immer mit vergleichen und die Lösung außerhalb des Definitionsbereichs verwerfen.",gg:"`G(x)=12x-(0.02x^3-0.6x^2+7x+30)`, dann `Löse(G'(x)=0, x)`."},
{id:"g36",a:"geo",t:"num",tg:"LGS",op:"Bestimmen",te:"A",lv:2,q:"Lösen Sie das Gleichungssystem und geben Sie $z$ an: I: $x+y+z=6$, II: $2x-y+z=3$, III: $x+2y-z=2$.",v:3,tol:0.0001,h:"Addiere I und III, so fällt $z$ weg. Oder nutze das Gauß-Verfahren.",e:"I+III: $2x+3y=8$. II−I: $x-2y=-3$, also $x=2y-3$. Einsetzen: $4y-6+3y=8$ ergibt $y=2$, $x=1$. Aus I: $z=3$. Lösung: $(1\\,|\\,2\\,|\\,3)$.",p:"Probe in allen drei Gleichungen machen. Das sichert die Punkte bei Folgefehlern.",gg:"`Löse({x+y+z=6, 2x-y+z=3, x+2y-z=2}, {x,y,z})` oder mit der Matrix `Treppennormalform(...)`."},
{id:"g37",a:"geo",t:"mc",tg:"LGS",op:"Begründen",te:"A",lv:2,q:"Das System $x+y=3$ und $2x+2y=6$ mit zwei Unbekannten wird gelöst. Welche Aussage über die Lösungsmenge stimmt?",o:["Es gibt unendlich viele Lösungen.","Es gibt genau eine Lösung.","Es gibt keine Lösung.","Es gibt genau zwei Lösungen."],c:0,h:"Wie hängen die beiden Gleichungen zusammen?",e:"Die zweite Gleichung ist das Doppelte der ersten. Es bleibt nur $x+y=3$ übrig. Mit $y=t$ gilt $x=3-t$, also unendlich viele Lösungen.",p:"Beim Gauß-Verfahren führt eine Nullzeile $0=0$ zu unendlich vielen Lösungen, eine Zeile $0=1$ zu keiner Lösung."},
{id:"g38",a:"geo",t:"num",tg:"Lagebeziehungen",op:"Bestimmen",te:"B",lv:3,q:"Die Ebenen $E:\\ x_1+x_2+x_3=4$ und $F:\\ x_1-x_2+2x_3=2$ schneiden sich in einer Geraden $s$. Bestimmen Sie die $x_1$-Koordinate des Punktes von $s$ mit $x_3=4$.",v:-3,tol:0.0001,h:"Setze $x_3=4$ in beide Gleichungen ein. Dann bleibt ein System mit $x_1$ und $x_2$.",e:"$x_3=4$: I: $x_1+x_2=0$. II: $x_1-x_2=-6$. Addieren: $2x_1=-6$, also $x_1=-3$ und $x_2=3$. Allgemein: $x_3=t$ gibt $x_1=3-1{,}5t$, $x_2=1+0{,}5t$, die Schnittgerade ist $s:\\ \\vec x=\\begin{pmatrix}3\\\\1\\\\0\\end{pmatrix}+t\\cdot\\begin{pmatrix}-1{,}5\\\\0{,}5\\\\1\\end{pmatrix}$.",p:"Die Parameterdarstellung der Schnittgeraden aufschreiben, nicht nur Zahlen. Probe in beiden Ebenengleichungen.",gg:"`Löse({x_1+x_2+x_3=4, x_1-x_2+2x_3=2}, {x_1,x_2})` mit `x_3` als Parameter. Oder `Schnittpunkt(E, F)`, der Befehl ist im Prüfungsmodus möglicherweise gesperrt."},
{id:"g39",a:"geo",t:"num",tg:"Abstand Gerade–Gerade",op:"Berechnen",te:"B",lv:3,q:"Die Geraden $g:\\ \\vec x=r\\cdot\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ und $h:\\ \\vec x=\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+s\\cdot\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}$ sind windschief. Berechnen Sie ihren Abstand (vier Nachkommastellen).",v:0.7071,tol:0.001,u:"LE",h:"Suche einen Vektor $\\vec n$ mit $\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$. Projiziere dann einen Verbindungsvektor auf $\\vec n$.",e:"$\\vec n=\\begin{pmatrix}0\\\\1\\\\-1\\end{pmatrix}$ erfüllt $\\vec n\\cdot\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}=0$ und $\\vec n\\cdot\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}=1-1=0$. Verbindungsvektor von $O$ zu $(1\\,|\\,2\\,|\\,3)$. $d=\\dfrac{|\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}\\cdot\\vec n|}{|\\vec n|}=\\dfrac{|2-3|}{\\sqrt{2}}=\\dfrac{1}{\\sqrt{2}}\\approx0{,}7071$.",p:"Erst zeigen, dass die Geraden windschief sind: weder parallel noch ein Schnittpunkt. Dann erst den Abstand rechnen."},
{id:"s43",a:"sto",t:"mc",tg:"Simulation",op:"Angeben",te:"B",lv:2,q:"In GeoGebra sollen 20 Würfe eines fairen Würfels simuliert werden. Welcher Befehl erzeugt die Liste der Augenzahlen?",o:["Folge(Zufallszahl(1, 6), i, 1, 20)","Zufallszahl(1, 20)","Folge(Zufallszahl(1, 20), i, 1, 6)","Zufallszahl(6, 20)"],c:0,h:"Jeder Wurf ist eine Zufallszahl zwischen 1 und 6. Die Liste soll 20 Einträge haben.",e:"`Zufallszahl(1, 6)` liefert eine ganzzahlige Zufallszahl von 1 bis 6. `Folge(…, i, 1, 20)` wiederholt das 20-mal. Mit `ZähleWenn(x==6, Liste)` zählst du die Sechsen.",p:"Die Grenzen von `Zufallszahl` sind einschließlich. Bei einem Würfel also 1 und 6."},
{id:"s44",a:"sto",t:"mc",tg:"Simulation",op:"Begründen",te:"A",lv:3,q:"Die relative Häufigkeit einer Sechs wird bei $n$ Würfen simuliert. Was passiert mit der typischen Schwankung der relativen Häufigkeit, wenn man $n$ vervierfacht?",o:["Sie halbiert sich.","Sie viertelt sich.","Sie bleibt gleich.","Sie verdoppelt sich."],c:0,h:"Die Standardabweichung der relativen Häufigkeit ist $\\sqrt{\\dfrac{p(1-p)}{n}}$.",e:"Die Standardabweichung ist $\\sqrt{\\frac{p(1-p)}{n}}$. Bei $4n$ steht $\\sqrt{4n}=2\\sqrt{n}$ im Nenner. Die Schwankung halbiert sich also.",p:"Vierfache Menge heißt nur halbe Schwankung. Das erklärt, warum man viele Wiederholungen braucht."},
{id:"s45",a:"sto",t:"num",tg:"Erwartungswert",op:"Bestimmen",te:"A",lv:3,q:"Bei einem Spiel wird ein Würfel einmal geworfen. Bei einer 6 zahlt die Bank $5\\,€$ aus, bei einer 5 zahlt sie $1\\,€$ aus, sonst nichts. Bestimmen Sie den Einsatz, bei dem das Spiel fair ist.",v:1,tol:0.0001,u:"€",h:"Fair heißt: Der Erwartungswert der Auszahlung ist gleich dem Einsatz.",e:"$E=\\frac{1}{6}\\cdot5+\\frac{1}{6}\\cdot1+\\frac{4}{6}\\cdot0=1$. Der faire Einsatz beträgt $1\\,€$. Bei $2\\,€$ Einsatz verliert der Spieler im Mittel $1\\,€$ pro Spiel.",p:"Aufpassen: Auszahlung und Gewinn (Auszahlung minus Einsatz) sind verschiedene Zufallsgrößen."},
{id:"s46",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:2,q:"Die Zufallsgröße $X$ hat die Werte $0$, $1$, $2$ mit den Wahrscheinlichkeiten $0{,}5$, $0{,}3$ und $0{,}2$. Berechnen Sie den Erwartungswert $E(X)$.",v:0.7,tol:0.0001,h:"$E(X)=\\sum x_i\\cdot P(X=x_i)$.",e:"$E(X)=0\\cdot0{,}5+1\\cdot0{,}3+2\\cdot0{,}2=0{,}7$.",p:"Die Summe der Wahrscheinlichkeiten muss $1$ sein. Kurz prüfen: $0{,}5+0{,}3+0{,}2=1$."},
{id:"s47",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:3,q:"Die Zufallsgröße $X$ hat die Werte $0$, $1$, $2$ mit den Wahrscheinlichkeiten $0{,}5$, $0{,}3$ und $0{,}2$. Berechnen Sie die Standardabweichung $\\sigma$ (vier Nachkommastellen).",v:0.781,tol:0.0006,h:"$\\mathrm{Var}(X)=\\sum(x_i-\\mu)^{2}\\cdot P(X=x_i)$ mit $\\mu=0{,}7$.",e:"$\\mathrm{Var}(X)=0{,}5\\cdot0{,}49+0{,}3\\cdot0{,}09+0{,}2\\cdot1{,}69=0{,}61$. $\\sigma=\\sqrt{0{,}61}\\approx0{,}7810$.",p:"Am Ende die Wurzel ziehen. Die Varianz ist nicht die Standardabweichung."},
{id:"s48",a:"sto",t:"num",tg:"Vierfeldertafel",op:"Berechnen",te:"A",lv:2,q:"Es gilt $P(A)=0{,}4$, $P(B)=0{,}5$ und $P(A\\cap B)=0{,}3$. Berechnen Sie $P(\\overline{A}\\cap\\overline{B})$.",v:0.4,tol:0.0001,h:"Zeichne eine Vierfeldertafel. $P(\\overline{A}\\cap\\overline{B})=1-P(A\\cup B)$.",e:"$P(A\\cup B)=0{,}4+0{,}5-0{,}3=0{,}6$. $P(\\overline{A}\\cap\\overline{B})=1-0{,}6=0{,}4$.",p:"Nicht $P(A)+P(B)$ einfach addieren, den Schnitt einmal abziehen."},
{id:"s49",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:2,q:"Die Daten $4;\\,6;\\,7;\\,7;\\,11$ werden betrachtet. Berechnen Sie die Standardabweichung (teilen Sie die Summe der quadrierten Abweichungen durch $n$; vier Nachkommastellen).",v:2.2804,tol:0.001,h:"Erst den Mittelwert, dann die quadrierten Abweichungen.",e:"Mittelwert $\\bar{x}=\\frac{35}{5}=7$. Abweichungen quadriert: $9,\\,1,\\,0,\\,0,\\,16$, Summe $26$. Varianz $\\frac{26}{5}=5{,}2$. $\\sigma=\\sqrt{5{,}2}\\approx2{,}2804$.",p:"Beachte, ob in der Aufgabe durch $n$ oder durch $n-1$ geteilt wird. Hier ist es $n$."},
{id:"s50",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"B",lv:3,q:"Ein Bauteil ist mit $4\\,\\%$ Wahrscheinlichkeit defekt. Bestimmen Sie die kleinste Anzahl $n$ geprüfter Bauteile, sodass mit mindestens $95\\,\\%$ Wahrscheinlichkeit mindestens eines defekt ist.",v:74,tol:0.0001,h:"Gegenereignis: $P(X\\geq1)=1-0{,}96^{n}\\geq0{,}95$.",e:"$0{,}96^{n}\\leq0{,}05$. $n\\geq\\dfrac{\\ln(0{,}05)}{\\ln(0{,}96)}\\approx73{,}39$. Also $n=74$. Probe: $1-0{,}96^{74}\\approx0{,}9512\\geq0{,}95$ und $1-0{,}96^{73}\\approx0{,}9492<0{,}95$.",p:"Beim Teilen durch $\\ln(0{,}96)<0$ dreht sich das Relationszeichen. Am Ende aufrunden.",gg:"`NLöse(0.96^n = 0.05, n)` liefert $73{,}39$. Aufrunden auf $74$. Alternativ in der Tabellenkalkulation `1-0.96^n` für $n=70$ bis $80$."}
);

CARDS.push(
["Substitution","Für Gleichungen wie $x^{4}-5x^{2}+4=0$ oder $e^{2x}-3e^{x}+2=0$:\n1. $z$ einführen, zum Beispiel $z=x^{2}$ oder $z=e^{x}$.\n2. Die quadratische Gleichung in $z$ lösen.\n3. **Rücksubstitution:** $x=\\pm\\sqrt{z}$ bzw. $x=\\ln(z)$. Negative $z$ haben bei $e^{x}=z$ keine Lösung."],
["Ortskurve","Alle Extrem- oder Wendepunkte einer Schar $f_t$ liegen auf einer Kurve ohne $t$:\n1. Punkt in Abhängigkeit von $t$ bestimmen: $P_t(x(t)\\,|\\,y(t))$.\n2. $x=x(t)$ nach $t$ auflösen.\n3. In $y(t)$ einsetzen.\nBeispiel: $f_t(x)=-x^{2}+2tx$ hat $H_t(t\\,|\\,t^{2})$. Aus $x=t$ folgt $y=x^{2}$."],
["Exponentialfunktionen ableiten","Mit linearem Exponenten gilt:$$\\big(e^{kx+b}\\big)'=k\\cdot e^{kx+b}\\qquad\\int e^{kx+b}\\,dx=\\frac{1}{k}e^{kx+b}+c$$Beispiel: $f(x)=3e^{2x+1}$ hat $f'(x)=6e^{2x+1}$ und $F(x)=\\frac{3}{2}e^{2x+1}+c$.\nBeim Ableiten kommt der Faktor $k$ (innere Ableitung) davor, beim Integrieren steht $\\frac{1}{k}$."],
["Gauß-Verfahren","Zeilen so umformen, dass unten Nullen entstehen (Stufenform), dann von unten nach oben einsetzen.\nErlaubt: Zeilen vertauschen, mit Zahl $\\neq0$ multiplizieren, ein Vielfaches einer Zeile zu einer anderen addieren.\nErgebnis: Eine Lösung (alle Variablen festgelegt), **keine** Lösung (Zeile $0=1$) oder **unendlich viele** (Nullzeile $0=0$, ein Parameter bleibt)."],
["Schnittgerade und Abstand windschiefer Geraden","**Schnittgerade zweier Ebenen:** Beide Koordinatengleichungen als LGS lösen, eine Variable als Parameter $t$ wählen.\n**Abstand windschiefer Geraden** $g:\\ \\vec x=\\vec a+r\\vec u$ und $h:\\ \\vec x=\\vec b+s\\vec v$: Finde $\\vec n$ mit $\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$. Dann$$d=\\frac{|(\\vec b-\\vec a)\\cdot\\vec n|}{|\\vec n|}.$$"],
["Rotationsvolumen","Rotiert die Fläche unter $f$ zwischen $a$ und $b$ um die $x$-Achse, gilt$$V=\\pi\\int_{a}^{b}\\big(f(x)\\big)^{2}\\,dx.$$Beispiel: $f(x)=\\sqrt{x}$ auf $[0;4]$ ergibt $V=\\pi\\int_{0}^{4}x\\,dx=8\\pi$.\nHinweis: Rotationskörper stehen nicht in den Fokussierungen 2027, kamen aber in eurem Kurs vor."]
);

{id:"n01",a:"ana",t:"num",tg:"Exponentialfunktionen",op:"Berechnen",te:"B",lv:2,q:"Die Masse einer radioaktiven Probe nimmt nach $m(t)=80\\cdot e^{-0{,}05t}$ ab ($t$ in Tagen, $m$ in mg). Berechnen Sie die Halbwertszeit (zwei Nachkommastellen).",v:13.86,tol:0.006,u:"Tage",h:"Setze $m(t)=40$, also die Hälfte von $80$.",e:"$80\\cdot e^{-0{,}05t}=40$ ergibt $e^{-0{,}05t}=\\dfrac{1}{2}$. Logarithmieren: $-0{,}05t=\\ln\\left(\\dfrac{1}{2}\\right)=-\\ln(2)$. Also $t=\\dfrac{\\ln(2)}{0{,}05}\\approx13{,}86$ Tage.",p:"Die Halbwertszeit hängt nicht vom Anfangswert $80$ ab. Man setzt auf die Hälfte, nicht auf $0$.",gg:"`Löse(80 exp(-0.05 t) = 40, t)`",g:{k:"fn",x:[0,40],y:[0,90],f:[{e:"80*exp(-0.05*x)",t:"m",lx:30}],hl:[40],p:[[13.86,40,"","ur"]],cap:"Verlauf der Masse $m$, gestrichelt: die Hälfte der Anfangsmasse"}},
{id:"n02",a:"ana",t:"num",tg:"Kettenregel",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=\\ln(x^{2}+1)$. Berechnen Sie $f'(1)$.",v:1,tol:0.0001,h:"Äußere Funktion $\\ln(z)$, innere Funktion $z=x^{2}+1$.",e:"$f'(x)=\\dfrac{1}{x^{2}+1}\\cdot2x=\\dfrac{2x}{x^{2}+1}$. Also $f'(1)=\\dfrac{2}{2}=1$.",p:"Die innere Ableitung $2x$ nicht vergessen."},
{id:"n03",a:"ana",t:"num",tg:"Kettenregel",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=(2x-3)^{4}$. Berechnen Sie $f'(2)$.",v:8,tol:0.0001,h:"Äußere Ableitung $4z^{3}$, innere Ableitung $2$.",e:"$f'(x)=4\\cdot(2x-3)^{3}\\cdot2=8\\cdot(2x-3)^{3}$. Also $f'(2)=8\\cdot1^{3}=8$.",p:"Beim Einsetzen zuerst die Klammer $2\\cdot2-3=1$ berechnen."},
{id:"n04",a:"ana",t:"num",tg:"Substitution",op:"Berechnen",te:"A",lv:3,q:"Berechnen Sie $\\displaystyle\\int_{0}^{1}x\\cdot e^{x^{2}}\\,dx$ (vier Nachkommastellen).",v:0.8591,tol:0.00006,h:"Substituiere $z=x^{2}$. Dann ist $dz=2x\\,dx$.",e:"Mit $z=x^{2}$ und $x\\,dx=\\dfrac{1}{2}dz$ folgt $\\displaystyle\\int_{0}^{1}x\\cdot e^{x^{2}}\\,dx=\\dfrac{1}{2}\\int_{0}^{1}e^{z}\\,dz=\\dfrac{1}{2}\\cdot(e-1)\\approx0{,}8591$. Die Grenzen bleiben $0$ und $1$, weil $0^{2}=0$ und $1^{2}=1$.",p:"Bei der Substitution müssen die Grenzen mitgerechnet oder am Ende zurücksubstituiert werden.",gg:"`Integral(x exp(x^2), 0, 1)`"},
{id:"n05",a:"ana",t:"num",tg:"Flächeninhalt",op:"Berechnen",te:"A",lv:2,q:"Der Graph von $f(x)=x^{2}-2x$ schließt mit der $x$-Achse eine Fläche ein. Berechnen Sie ihren Inhalt (vier Nachkommastellen).",v:1.3333,tol:0.00006,h:"Nullstellen bestimmen. Zwischen ihnen liegt der Graph unter der $x$-Achse.",e:"$x^{2}-2x=x\\cdot(x-2)=0$ ergibt $x=0$ und $x=2$. Dazwischen ist $f\\leq0$. $\\displaystyle\\int_{0}^{2}(x^{2}-2x)\\,dx=\\left[\\dfrac{x^{3}}{3}-x^{2}\\right]_{0}^{2}=\\dfrac{8}{3}-4=-\\dfrac{4}{3}$. Der Flächeninhalt ist der Betrag: $\\dfrac{4}{3}\\approx1{,}3333$.",p:"Ein negatives Integral ist kein negativer Flächeninhalt. Der Betrag gehört dazu.",g:{k:"fn",x:[-1,3],y:[-1.5,3.5],f:[{e:"x**2-2*x",t:"f",lx:2.7}],a:{f:"x**2-2*x",from:0,to:2},cap:"Graph von $f$, markiert ist die eingeschlossene Fläche"}},
{id:"n06",a:"ana",t:"num",tg:"Fläche zwischen Graphen",op:"Berechnen",te:"B",lv:3,q:"Die Graphen von $f(x)=4-x^{2}$ und $g(x)=x+2$ schließen eine Fläche ein. Berechnen Sie ihren Inhalt (zwei Nachkommastellen).",v:4.5,tol:0.006,h:"Schnittstellen aus $f(x)=g(x)$. Dann $\\displaystyle\\int(f-g)$ über das Intervall dazwischen.",e:"$4-x^{2}=x+2$ ergibt $x^{2}+x-2=0$, also $x=-2$ oder $x=1$. Im Intervall liegt $f$ oberhalb von $g$. $A=\\displaystyle\\int_{-2}^{1}(2-x-x^{2})\\,dx=\\left[2x-\\dfrac{x^{2}}{2}-\\dfrac{x^{3}}{3}\\right]_{-2}^{1}=\\dfrac{7}{6}+\\dfrac{10}{3}=\\dfrac{9}{2}=4{,}5$.",p:"Obere minus untere Funktion. Wer die Reihenfolge vertauscht, bekommt ein negatives Ergebnis.",gg:"`Integral(4 - x^2 - (x + 2), -2, 1)`",g:{k:"fn",x:[-3,2],y:[-1,5],f:[{e:"4-x**2",t:"f",lx:-2.5},{e:"x+2",t:"g",lx:1.6,c:1}],a:{f:"4-x**2",g:"x+2",from:-2,to:1},cap:"Die Graphen von $f$ und $g$ und die eingeschlossene Fläche"}},
{id:"n07",a:"ana",t:"num",tg:"Bestand",op:"Berechnen",te:"B",lv:3,q:"Eine Wanne enthält zu Beginn 20 Liter Wasser. Für $0\\leq t\\leq6$ fließt Wasser mit der Rate $z(t)=-0{,}5t^{2}+3t$ zu ($t$ in Minuten, $z$ in $\\frac{l}{min}$). Berechnen Sie, wie viel Wasser nach 4 Minuten in der Wanne ist (zwei Nachkommastellen).",v:33.33,tol:0.006,u:"Liter",h:"Anfangsbestand plus Integral der Zuflussrate.",e:"$B(4)=20+\\displaystyle\\int_{0}^{4}(-0{,}5t^{2}+3t)\\,dt=20+\\left[-\\dfrac{t^{3}}{6}+\\dfrac{3t^{2}}{2}\\right]_{0}^{4}=20+\\left(-\\dfrac{64}{6}+24\\right)=20+\\dfrac{40}{3}\\approx33{,}33$.",p:"Das Integral allein ist nur die zugeflossene Menge. Den Anfangsbestand von 20 Litern addieren.",gg:"`20 + Integral(-0.5 t^2 + 3 t, 0, 4)`",g:{k:"fn",x:[0,6],y:[0,5],f:[{e:"-0.5*x**2+3*x",t:"z",lx:5}],a:{f:"-0.5*x**2+3*x",from:0,to:4},cap:"Zuflussrate $z$, markiert ist die in den ersten 4 Minuten zugeflossene Menge"}},
{id:"n08",a:"ana",t:"reason",tg:"Funktionsscharen",op:"Begründen",te:"A",lv:2,q:"Gegeben ist die Schar $f_{a}(x)=x^{3}-a\\cdot x$ mit $a<0$. Begründen Sie, dass kein Graph von $f_{a}$ eine Extremstelle hat.",mod:"$f_{a}'(x)=3x^{2}-a$. Wegen $x^{2}\\geq0$ und $-a>0$ gilt $f_{a}'(x)\\geq-a>0$ für alle $x$. Also hat $f_{a}'$ keine Nullstelle. Die notwendige Bedingung $f_{a}'(x)=0$ ist nie erfüllt. Deshalb gibt es keine Extremstelle.",cr:[["Ableitung $f_{a}'(x)=3x^{2}-a$",1],["$f_{a}'(x)>0$ begründet mit $x^{2}\\geq0$ und $-a>0$",1],["Schluss: $f_{a}'(x)=0$ nie erfüllt, also keine Extremstelle",1]],h:"Notwendige Bedingung für Extremstellen: $f'(x)=0$.",p:"Die Vorzeichenbedingung $a<0$ muss in der Begründung vorkommen. Sonst fehlt der entscheidende Schritt."},
{id:"n09",a:"ana",t:"mc",tg:"Ortskurve",op:"Bestimmen",te:"A",lv:3,q:"Für jedes $t>0$ ist $f_{t}(x)=t\\cdot x-x^{2}$ gegeben. Auf welcher Kurve liegen die Hochpunkte $H_{t}$ aller Graphen?",o:["$y=x^{2}$","$y=2x^{2}$","$y=\\dfrac{x^{2}}{2}$","$y=x$"],c:0,h:"Bestimme $H_{t}$ in Abhängigkeit von $t$ und eliminiere dann $t$.",e:"$f_{t}'(x)=t-2x=0$ ergibt $x=\\dfrac{t}{2}$. $y=f_{t}\\left(\\dfrac{t}{2}\\right)=\\dfrac{t^{2}}{2}-\\dfrac{t^{2}}{4}=\\dfrac{t^{2}}{4}$. Aus $t=2x$ folgt $y=\\dfrac{(2x)^{2}}{4}=x^{2}$.",p:"Zum Eliminieren $t$ aus der $x$-Koordinate ausdrücken und in die $y$-Koordinate einsetzen."},
{id:"n10",a:"ana",t:"mc",tg:"Ableitungsgraph lesen",op:"Beurteilen",te:"A",lv:2,q:"Abgebildet ist der Graph der Ableitungsfunktion $f'$ einer Funktion $f$. Welche Aussage über $f$ ist richtig?",o:["$f$ hat bei $x=-1$ einen Hochpunkt und bei $x=3$ einen Tiefpunkt.","$f$ hat bei $x=-1$ einen Tiefpunkt und bei $x=3$ einen Hochpunkt.","$f$ hat bei $x=1$ einen Tiefpunkt.","$f$ hat bei $x=-1$ und $x=3$ Wendestellen."],c:0,h:"Extremstellen von $f$ sind Nullstellen von $f'$ mit Vorzeichenwechsel.",e:"$f'$ hat Nullstellen bei $x=-1$ und $x=3$. Bei $x=-1$ wechselt $f'$ von $+$ nach $-$: Hochpunkt. Bei $x=3$ wechselt $f'$ von $-$ nach $+$: Tiefpunkt. Der Tiefpunkt von $f'$ bei $x=1$ ist eine Wendestelle von $f$.",p:"Der Graph von $f'$ zeigt Vorzeichen, nicht die Funktionswerte von $f$. Nullstellen von $f'$ sind Extremkandidaten von $f$.",g:{k:"fn",x:[-2.5,4.5],y:[-5,5],f:[{e:"x**2-2*x-3",t:"f'",lx:4}],cap:"Graph von $f'$"}},
{id:"n11",a:"ana",t:"num",tg:"Mittelwert",op:"Berechnen",te:"B",lv:3,q:"Die Temperatur an einem Tag wird für $9\\leq t\\leq21$ durch $T(t)=15+8\\cdot\\sin\\left(\\dfrac{\\pi}{12}\\cdot(t-9)\\right)$ beschrieben ($t$ in Stunden, $T$ in $^{\\circ}C$). Berechnen Sie die mittlere Temperatur in diesem Zeitraum (zwei Nachkommastellen).",v:20.09,tol:0.006,u:"°C",h:"Mittelwert $\\dfrac{1}{b-a}\\displaystyle\\int_{a}^{b}T(t)\\,dt$.",e:"$\\bar{T}=\\dfrac{1}{12}\\displaystyle\\int_{9}^{21}\\left(15+8\\sin\\left(\\dfrac{\\pi}{12}(t-9)\\right)\\right)dt=15+\\dfrac{8}{12}\\cdot\\left[-\\dfrac{12}{\\pi}\\cos\\left(\\dfrac{\\pi}{12}(t-9)\\right)\\right]_{9}^{21}=15+\\dfrac{8}{12}\\cdot\\dfrac{24}{\\pi}=15+\\dfrac{16}{\\pi}\\approx20{,}09$.",p:"Den Faktor $\\frac{1}{b-a}=\\frac{1}{12}$ nicht vergessen. Das Integral allein ist keine Temperatur.",gg:"`Integral(15 + 8 sin(pi/12 (t-9)), 9, 21) / 12`",g:{k:"fn",x:[9,21],y:[10,25],f:[{e:"15+8*sin(PI/12*(x-9))",t:"T",lx:19}],hl:[20.09],cap:"Temperaturverlauf, gestrichelt: die mittlere Temperatur"}},
{id:"n12",a:"ana",t:"num",tg:"Umkehrfunktion",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist $f(x)=2e^{x}+1$. Berechnen Sie $f^{-1}(5)$ (vier Nachkommastellen).",v:0.6931,tol:0.00006,h:"Löse $f(x)=5$ nach $x$.",e:"$2e^{x}+1=5$ ergibt $e^{x}=2$, also $x=\\ln(2)\\approx0{,}6931$. Also $f^{-1}(5)=\\ln(2)$.",p:"$f^{-1}(5)$ ist die Stelle $x$ mit $f(x)=5$. Nicht den Kehrwert $\\frac{1}{f(5)}$ bilden."},
{id:"n13",a:"ana",t:"err",tg:"Kettenregel",op:"Beurteilen",te:"A",lv:2,q:"Ein Schüler leitet $f(x)=x\\cdot e^{2x}$ ab. Wo steckt der Fehler?",s:["$u=x$, $v=e^{2x}$","$u'=1$, $v'=e^{2x}$","$f'(x)=u'\\cdot v+u\\cdot v'=e^{2x}+x\\cdot e^{2x}$","Ergebnis: $f'(x)=(1+x)\\cdot e^{2x}$"],b:1,et:"versteh",h:"Prüfe die Ableitung von $e^{2x}$. Was fehlt?",fx:"$v'=2\\cdot e^{2x}$ (innere Ableitung $2$). Damit $f'(x)=e^{2x}+x\\cdot2e^{2x}=(1+2x)\\cdot e^{2x}$.",e:"Schritt 2 ist falsch: Bei $e^{2x}$ fehlt die innere Ableitung $2$ der Kettenregel.",p:"Die Kettenregel steckt oft in der Produktregel. Jede innere Funktion hat eine eigene Ableitung."},
{id:"n14",a:"ana",t:"num",tg:"Extremwertproblem",op:"Bestimmen",te:"B",lv:3,q:"Dem Graphen von $f(x)=6-x^{2}$ ($0\\leq x\\leq\\sqrt{6}$) wird ein Rechteck einbeschrieben. Zwei Seiten liegen auf den Koordinatenachsen, eine Ecke $P(x\\,|\\,f(x))$ liegt auf dem Graphen. Bestimmen Sie den maximalen Flächeninhalt (vier Nachkommastellen).",v:5.6569,tol:0.00006,h:"Zielfunktion $A(x)=x\\cdot f(x)$. Ableiten und Nullstelle suchen.",e:"$A(x)=x\\cdot(6-x^{2})=6x-x^{3}$. $A'(x)=6-3x^{2}=0$ ergibt $x=\\sqrt{2}$. $A''(x)=-6x<0$: Maximum. $A(\\sqrt{2})=6\\sqrt{2}-2\\sqrt{2}=4\\sqrt{2}\\approx5{,}6569$. Die Ränder liefern $A(0)=0$ und $A(\\sqrt{6})=0$.",p:"Die Randwerte prüfen und die zweite Ableitung (oder Vorzeichenwechsel) angeben. Sonst fehlt die Begründung für das Maximum.",gg:"`Löse(Ableitung(x (6 - x^2)) = 0, x)`",g:{k:"fn",x:[-0.3,3],y:[-0.5,7],f:[{e:"6-x**2",t:"f",lx:2.4}],p:[[1.4142,3.9998,"P","ur"]],cap:"Graph von $f$, $P$ ist die Ecke des Rechtecks auf dem Graphen"}},
{id:"n15",a:"ana",t:"num",tg:"Gleichungen lösen",op:"Bestimmen",te:"A",lv:1,q:"Bestimmen Sie die Lösung der Gleichung $e^{2x}=7$ (vier Nachkommastellen).",v:0.973,tol:0.00006,h:"Beide Seiten logarithmieren.",e:"$e^{2x}=7$ ergibt $2x=\\ln(7)$, also $x=\\dfrac{\\ln(7)}{2}\\approx0{,}9730$.",p:"Nach dem Logarithmieren noch durch den Faktor $2$ im Exponenten teilen."},
{id:"n16",a:"ana",t:"num",tg:"Tangente",op:"Bestimmen",te:"B",lv:2,q:"Gegeben ist $f(x)=e^{0{,}5x}$. Die Tangente an den Graphen im Punkt $P(3\\,|\\,f(3))$ schneidet die $x$-Achse in $N(x_{N}\\,|\\,0)$. Bestimmen Sie $x_{N}$.",v:1,tol:0.0001,h:"Tangentengleichung $t(x)=f'(3)\\cdot(x-3)+f(3)$ und $t(x)=0$ setzen.",e:"$f'(x)=0{,}5\\cdot e^{0{,}5x}$, also $f'(3)=0{,}5\\cdot e^{1{,}5}$ und $f(3)=e^{1{,}5}$. $t(x)=0{,}5e^{1{,}5}\\cdot(x-3)+e^{1{,}5}=0$ ergibt $0{,}5\\cdot(x-3)=-1$, also $x=1$. Die Subtangente hat bei $e^{kx}$ immer die Länge $\\frac{1}{k}=2$.",p:"Der gemeinsame Faktor $e^{1{,}5}$ kürzt sich weg. Er muss nicht ausgerechnet werden.",gg:"`Tangente((3, f(3)), f)`",g:{k:"fn",x:[-1,5],y:[-0.5,8],f:[{e:"exp(0.5*x)",t:"f",lx:4.2},{e:"0.5*exp(1.5)*(x-3)+exp(1.5)",t:"t",lx:-0.5,c:1}],p:[[3,4.4817,"P","ul"],[1,0,"N","ur"]],cap:"Graph von $f$ und die Tangente in $P$"}},

{id:"n17",a:"geo",t:"num",tg:"Winkel",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Winkel zwischen den Vektoren $\\vec{a}=\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ und $\\vec{b}=\\begin{pmatrix}2\\\\-1\\\\2\\end{pmatrix}$ (eine Nachkommastelle, in Grad).",v:63.6,tol:0.06,u:"°",h:"$\\cos\\varphi=\\dfrac{\\vec{a}\\cdot\\vec{b}}{|\\vec{a}|\\cdot|\\vec{b}|}$.",e:"$\\vec{a}\\cdot\\vec{b}=2-2+4=4$. $|\\vec{a}|=3$ und $|\\vec{b}|=3$. $\\cos\\varphi=\\dfrac{4}{9}$, also $\\varphi\\approx63{,}6^{\\circ}$.",p:"Den Taschenrechner auf Grad stellen. Beim Winkel zwischen Vektoren steht kein Betrag im Zähler.",gg:"`Winkel((1,2,2),(2,-1,2))`"},
{id:"n18",a:"geo",t:"num",tg:"Vektoren",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie die Länge des Vektors $\\vec{v}=\\begin{pmatrix}2\\\\-3\\\\6\\end{pmatrix}$.",v:7,tol:0.0001,h:"Betrag eines Vektors: Wurzel aus der Summe der Quadrate.",e:"$|\\vec{v}|=\\sqrt{2^{2}+(-3)^{2}+6^{2}}=\\sqrt{4+9+36}=\\sqrt{49}=7$.",p:"Quadrieren macht negative Zahlen positiv: $(-3)^{2}=9$."},
{id:"n19",a:"geo",t:"num",tg:"Abstand Punkt–Gerade",op:"Berechnen",te:"B",lv:3,q:"Gegeben sind die Gerade $g:\\ \\vec{x}=\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}+t\\cdot\\begin{pmatrix}2\\\\1\\\\2\\end{pmatrix}$ und der Punkt $P(3\\,|\\,2\\,|\\,5)$. Berechnen Sie den Abstand von $P$ zu $g$.",v:1,tol:0.0001,u:"LE",h:"Lotfußpunkt $F$ so bestimmen, dass $\\overrightarrow{PF}\\cdot\\vec{u}=0$ gilt, oder mit der Projektion arbeiten.",e:"Aufpunkt $A(1\\,|\\,0\\,|\\,2)$: $\\overrightarrow{AP}=\\begin{pmatrix}2\\\\2\\\\3\\end{pmatrix}$ mit $|\\overrightarrow{AP}|^{2}=17$. Richtung $\\vec{u}=\\begin{pmatrix}2\\\\1\\\\2\\end{pmatrix}$ mit $|\\vec{u}|=3$. $\\overrightarrow{AP}\\cdot\\vec{u}=4+2+6=12$. Länge der Projektion: $\\dfrac{12}{3}=4$. Abstand: $d=\\sqrt{17-4^{2}}=\\sqrt{1}=1$. Alternativ: $t=\\dfrac{12}{9}=\\dfrac{4}{3}$ führt zu $F\\left(\\dfrac{11}{3}\\,|\\,\\dfrac{4}{3}\\,|\\,\\dfrac{14}{3}\\right)$.",p:"Beim Satz des Pythagoras die Projektionslänge verwenden ($\\frac{\\overrightarrow{AP}\\cdot\\vec{u}}{|\\vec{u}|}$), nicht den Parameter $t$.",gg:"`Abstand((3,2,5), Gerade((1,0,2),(3,1,4)))`"},
{id:"n20",a:"geo",t:"num",tg:"Abstand Punkt–Ebene",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Abstand des Ursprungs von der Ebene $E:\\ x_{1}+2x_{2}+2x_{3}=12$.",v:4,tol:0.0001,u:"LE",h:"Hessesche Normalenform: Durch $|\\vec{n}|$ teilen.",e:"$\\vec{n}=\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ mit $|\\vec{n}|=3$. $d=\\dfrac{|0+0+0-12|}{3}=4$.",p:"Betrag im Zähler. Ein negativer Abstand ist nicht möglich."},
{id:"n21",a:"geo",t:"mc",tg:"Lagebeziehungen",op:"Untersuchen",te:"A",lv:2,q:"Gegeben sind $g:\\ \\vec{x}=\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+t\\cdot\\begin{pmatrix}2\\\\-1\\\\4\\end{pmatrix}$ und $h:\\ \\vec{x}=\\begin{pmatrix}3\\\\1\\\\7\\end{pmatrix}+s\\cdot\\begin{pmatrix}-4\\\\2\\\\-8\\end{pmatrix}$. Wie liegen $g$ und $h$ zueinander?",o:["identisch","echt parallel","sie schneiden sich in genau einem Punkt","windschief"],c:0,h:"Vergleiche zuerst die Richtungsvektoren. Dann prüfe, ob ein Aufpunkt auf der anderen Geraden liegt.",e:"$\\begin{pmatrix}-4\\\\2\\\\-8\\end{pmatrix}=-2\\cdot\\begin{pmatrix}2\\\\-1\\\\4\\end{pmatrix}$: Die Richtungsvektoren sind Vielfache, also $g\\parallel h$. Der Aufpunkt $(3\\,|\\,1\\,|\\,7)$ von $h$ liegt auf $g$: Für $t=1$ ergibt sich $\\begin{pmatrix}3\\\\1\\\\7\\end{pmatrix}$. Also sind die Geraden identisch.",p:"Bei parallelen Richtungsvektoren immer eine Punktprobe machen. Sonst verwechselt man „identisch“ mit „echt parallel“."},
{id:"n22",a:"geo",t:"num",tg:"Winkel an Körpern",op:"Berechnen",te:"B",lv:3,q:"Ein Würfel $ABCDEFGH$ hat die Kantenlänge $4$ mit $A(0\\,|\\,0\\,|\\,0)$ und $G(4\\,|\\,4\\,|\\,4)$. Berechnen Sie den Winkel zwischen der Raumdiagonalen $\\overline{AG}$ und der Grundfläche $ABCD$ (zwei Nachkommastellen, in Grad).",v:35.26,tol:0.006,u:"°",h:"Winkel zwischen Gerade und Ebene: Der Normalenvektor der Grundfläche ist $\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$.",e:"$\\overrightarrow{AG}=\\begin{pmatrix}4\\\\4\\\\4\\end{pmatrix}$ und $\\vec{n}=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. $\\sin\\alpha=\\dfrac{|\\overrightarrow{AG}\\cdot\\vec{n}|}{|\\overrightarrow{AG}|\\cdot|\\vec{n}|}=\\dfrac{4}{4\\sqrt{3}}=\\dfrac{1}{\\sqrt{3}}$. Also $\\alpha\\approx35{,}26^{\\circ}$. Kontrolle: $\\tan\\alpha=\\dfrac{4}{4\\sqrt{2}}=\\dfrac{1}{\\sqrt{2}}$.",p:"Winkel zwischen Gerade und Ebene mit dem Sinus berechnen. Mit dem Kosinus erhält man den Winkel zur Normalen ($54{,}74^{\\circ}$).",gg:"`Winkel(Gerade((0,0,0),(4,4,4)), Ebene(x=...))`",g:{k:"solid",V:{A:[0,0,0],B:[4,0,0],C:[4,4,0],D:[0,4,0],E:[0,0,4],F:[4,0,4],G:[4,4,4],H:[0,4,4]},E:[["A","B"],["B","C"],["C","D",1],["D","A",1],["E","F"],["F","G"],["G","H"],["H","E"],["A","E"],["B","F"],["C","G"],["D","H",1],["A","G",0,1]],lab:{A:"dl",B:"dr",C:"dr",D:"ur",E:"ul",F:"ur",G:"ur",H:"ul"},cap:"Würfel mit der Raumdiagonalen $\\overline{AG}$"}},
{id:"n23",a:"geo",t:"num",tg:"Durchstoßpunkt",op:"Bestimmen",te:"B",lv:2,q:"Die Gerade $g:\\ \\vec{x}=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}+t\\cdot\\begin{pmatrix}1\\\\2\\\\-1\\end{pmatrix}$ schneidet die Ebene $E:\\ 2x_{1}-x_{2}+x_{3}=6$ in einem Punkt $S$. Bestimmen Sie die $x_{2}$-Koordinate von $S$.",v:-7,tol:0.0001,h:"Setze die Koordinaten von $g$ in die Ebenengleichung ein und löse nach $t$.",e:"$2\\cdot(1+t)-(1+2t)+(1-t)=6$ ergibt $2-t=6$, also $t=-4$. $S=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}-4\\cdot\\begin{pmatrix}1\\\\2\\\\-1\\end{pmatrix}=\\begin{pmatrix}-3\\\\-7\\\\5\\end{pmatrix}$. Probe in $E$: $-6+7+5=6$. Die $x_{2}$-Koordinate ist $-7$.",p:"Nach dem Lösen für $t$ den Punkt über die Geradengleichung ausrechnen und mit der Ebene die Probe machen.",gg:"`Schneide(Gerade((1,1,1),(2,3,0)), Ebene(2x - y + z = 6))`"},
{id:"n24",a:"geo",t:"num",tg:"Flächeninhalt",op:"Berechnen",te:"B",lv:3,q:"Die Pyramide $ABCS$ hat die Grundfläche $ABC$ mit $A(0\\,|\\,0\\,|\\,0)$, $B(6\\,|\\,0\\,|\\,0)$, $C(0\\,|\\,6\\,|\\,0)$ und die Spitze $S(2\\,|\\,2\\,|\\,6)$. Berechnen Sie das Volumen der Pyramide.",v:36,tol:0.0001,u:"VE",h:"Grundfläche ist ein rechtwinkliges Dreieck in der $x_{1}x_{2}$-Ebene. Die Höhe ist der Abstand von $S$ zu dieser Ebene.",e:"$G=\\dfrac{1}{2}\\cdot6\\cdot6=18$. Die Grundfläche liegt in der Ebene $x_{3}=0$, also ist die Höhe die $x_{3}$-Koordinate von $S$: $h=6$. $V=\\dfrac{1}{3}\\cdot G\\cdot h=\\dfrac{1}{3}\\cdot18\\cdot6=36$.",p:"Faktor $\\frac{1}{3}$ nicht vergessen. Die Höhe ist der Abstand zur Grundfläche, nicht die Länge einer Kante.",g:{k:"solid",V:{A:[0,0,0],B:[6,0,0],C:[0,6,0],S:[2,2,6]},E:[["A","B"],["A","C",1],["B","C"],["A","S",1],["B","S"],["C","S"]],lab:{A:"dl",B:"dr",C:"ur",S:"ul"},ax:[7,7,7],face:["A","B","C"],cap:"Pyramide $ABCS$ mit der Grundfläche in der $x_{1}x_{2}$-Ebene"}},
{id:"n25",a:"geo",t:"reason",tg:"Lagebeziehungen",op:"Begründen",te:"A",lv:2,q:"Gegeben sind $g:\\ \\vec{x}=t\\cdot\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}$ und $h:\\ \\vec{x}=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+s\\cdot\\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}$. Begründen Sie, dass $g$ und $h$ echt parallel sind.",mod:"Es gilt $\\begin{pmatrix}2\\\\4\\\\6\\end{pmatrix}=2\\cdot\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}$. Die Richtungsvektoren sind linear abhängig, also sind $g$ und $h$ parallel oder identisch.\nPunktprobe: Der Aufpunkt $(1\\,|\\,0\\,|\\,0)$ von $h$ liegt auf $g$, wenn $t\\cdot\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ gilt. Aus $t=1$ (erste Zeile) folgt $2t=2\\neq0$ (zweite Zeile). Das ist ein Widerspruch.\nAlso liegt der Aufpunkt nicht auf $g$. Die Geraden sind echt parallel.",cr:[["Richtungsvektoren als Vielfache erkannt: parallel oder identisch",1],["Punktprobe mit dem Aufpunkt durchgeführt",1],["Widerspruch gefunden und auf „echt parallel“ geschlossen",1]],h:"Erst die Richtungsvektoren vergleichen, dann einen Aufpunkt prüfen.",p:"Aus „Richtungsvektoren sind Vielfache“ folgt nur „parallel oder identisch“. Der Unterschied kommt erst durch die Punktprobe."},
{id:"n26",a:"geo",t:"num",tg:"Spiegelung",op:"Bestimmen",te:"A",lv:2,q:"Der Punkt $P(4\\,|\\,-2\\,|\\,3)$ wird am Punkt $Z(1\\,|\\,1\\,|\\,1)$ gespiegelt. Bestimmen Sie die $x_{2}$-Koordinate des Bildpunktes $P'$.",v:4,tol:0.0001,h:"Bei einer Punktspiegelung ist $Z$ der Mittelpunkt der Strecke $PP'$.",e:"$\\overrightarrow{OZ}=\\dfrac{1}{2}\\cdot(\\overrightarrow{OP}+\\overrightarrow{OP'})$ ergibt $\\overrightarrow{OP'}=2\\cdot\\overrightarrow{OZ}-\\overrightarrow{OP}=\\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}-\\begin{pmatrix}4\\\\-2\\\\3\\end{pmatrix}=\\begin{pmatrix}-2\\\\4\\\\-1\\end{pmatrix}$. Die $x_{2}$-Koordinate ist $4$.",p:"Nicht $\\overrightarrow{OP}$ mit $-1$ multiplizieren. Das spiegelt am Ursprung, nicht an $Z$."},

/* ---------- Stochastik ---------- */
{id:"n27",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"B",lv:2,q:"Ein Bus ist mit der Wahrscheinlichkeit $0{,}85$ pünktlich. An 25 Tagen fährt Anna mit dem Bus, die Tage sind unabhängig. Berechnen Sie die Wahrscheinlichkeit, dass der Bus an mindestens 22 Tagen pünktlich ist (vier Nachkommastellen).",v:0.4711,tol:0.00006,h:"$X\\sim B(25;\\,0{,}85)$. „Mindestens 22“ ist $P(X\\geq22)=1-P(X\\leq21)$.",e:"$P(X\\geq22)=1-P(X\\leq21)\\approx1-0{,}5289=0{,}4711$.",p:"„Mindestens 22“ heißt $1-P(X\\leq21)$. Die Grenze 21 und nicht 22 verwenden.",gg:"`1 - Binomial(25, 0.85, 21, true)`"},
{id:"n28",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"B",lv:3,q:"Ein Bauteil ist mit der Wahrscheinlichkeit $0{,}04$ defekt. Bestimmen Sie die kleinste Anzahl $n$ zufällig gewählter Bauteile, damit mit mindestens $90\\,\\%$ Wahrscheinlichkeit mindestens ein defektes dabei ist.",v:57,tol:0.0001,h:"Gegenereignis: kein defektes Bauteil, also $0{,}96^{n}$.",e:"$1-0{,}96^{n}\\geq0{,}9$ ergibt $0{,}96^{n}\\leq0{,}1$. Logarithmieren: $n\\geq\\dfrac{\\ln(0{,}1)}{\\ln(0{,}96)}\\approx56{,}4$. Aufrunden: $n=57$. Probe: $1-0{,}96^{56}\\approx0{,}898<0{,}9$ und $1-0{,}96^{57}\\approx0{,}902$.",p:"Immer aufrunden und die Probe mit $n-1$ machen. Das Zeichen dreht sich beim Teilen durch $\\ln(0{,}96)<0$.",gg:"`Löse(1 - 0.96^n >= 0.9, n)`"},
{id:"n29",a:"sto",t:"num",tg:"Erwartungswert",op:"Berechnen",te:"A",lv:2,q:"Bei einem Glücksrad erhält man mit $50\\,\\%$ nichts, mit $30\\,\\%$ den Betrag $2\\,€$ und mit $20\\,\\%$ den Betrag $10\\,€$. Der Einsatz beträgt $3\\,€$. Berechnen Sie den Erwartungswert des Gewinns (Auszahlung minus Einsatz) pro Spiel.",v:-0.4,tol:0.0001,u:"€",h:"Erwartungswert der Auszahlung bestimmen, dann den Einsatz abziehen.",e:"$E(\\text{Auszahlung})=0\\cdot0{,}5+2\\cdot0{,}3+10\\cdot0{,}2=2{,}6\\,€$. Gewinn: $2{,}6-3=-0{,}4\\,€$. Im Mittel verliert der Spieler $0{,}40\\,€$ pro Spiel.",p:"Den Einsatz nicht vergessen. Ohne ihn erhält man $+2{,}6\\,€$ und damit ein ganz anderes Urteil über das Spiel."},
{id:"n30",a:"sto",t:"num",tg:"Normalverteilung",op:"Berechnen",te:"B",lv:2,q:"Die Körpergröße (in cm) einer Personengruppe ist normalverteilt mit $\\mu=175$ und $\\sigma=7$. Berechnen Sie den Anteil der Personen, die größer als $190\\,cm$ sind (vier Nachkommastellen).",v:0.0161,tol:0.00006,h:"$P(X>190)=1-P(X\\leq190)$.",e:"$P(X>190)=1-P(X\\leq190)=1-\\Phi\\left(\\dfrac{190-175}{7}\\right)=1-\\Phi(2{,}14)\\approx1-0{,}9839=0{,}0161$. Das sind etwa $1{,}6\\,\\%$.",p:"„Größer als“ ist die rechte Seite: $1-P(X\\leq190)$.",gg:"`1 - Normal(175, 7, 190, true)`",g:{k:"norm",mu:175,s:7,shade:[190,null],ticks:[154,161,168,175,182,189,196],cap:"$X\\sim N(175;\\,7^{2})$, markiert ist $P(X>190)$"}},
{id:"n31",a:"sto",t:"num",tg:"Bedingte Wahrscheinlichkeit",op:"Berechnen",te:"A",lv:2,q:"Für zwei Ereignisse gilt $P(A)=0{,}3$, $P(B)=0{,}5$ und $P(A\\cap B)=0{,}2$. Berechnen Sie $P_{B}(A)$.",v:0.4,tol:0.0001,h:"$P_{B}(A)=\\dfrac{P(A\\cap B)}{P(B)}$.",e:"$P_{B}(A)=\\dfrac{0{,}2}{0{,}5}=0{,}4$.",p:"Durch die Wahrscheinlichkeit der Bedingung teilen: Hier steht $B$ unten, nicht $A$."},
{id:"n32",a:"sto",t:"mc",tg:"Histogramme",op:"Beurteilen",te:"A",lv:2,q:"Das Histogramm gehört zu einer binomialverteilten Zufallsgröße $X$ mit $n=10$. Welches $p$ passt am besten?",o:["$p=0{,}3$","$p=0{,}5$","$p=0{,}7$","$p=0{,}1$"],c:0,h:"Der höchste Balken liegt etwa beim Erwartungswert $\\mu=n\\cdot p$.",e:"Der höchste Balken liegt bei $k=3$. Der Erwartungswert ist ungefähr $3$, also $p\\approx\\dfrac{3}{10}=0{,}3$. Für $p=0{,}5$ wäre die Verteilung symmetrisch um $5$, für $p=0{,}7$ läge der Gipfel bei $7$.",p:"Aus der Lage des Gipfels auf $\\mu=n\\cdot p$ schließen. Die Rechtsschiefe passt zu $p<0{,}5$.",g:{k:"bars",n:10,p:0.3,from:0,to:8,hi:[3],cap:"Histogramm von $X$ ($n=10$)"}},
{id:"n33",a:"sto",t:"num",tg:"Normalverteilung",op:"Bestimmen",te:"B",lv:3,q:"Eine Anlage füllt Flaschen mit einer normalverteilten Menge ($\\sigma=2\\,ml$). Es sollen nur $1\\,\\%$ der Flaschen weniger als $250\\,ml$ enthalten. Bestimmen Sie den dafür nötigen Erwartungswert $\\mu$ (zwei Nachkommastellen).",v:254.65,tol:0.006,u:"ml",h:"Quantil der Standardnormalverteilung für $0{,}01$ bestimmen.",e:"$P(X<250)=0{,}01$ bedeutet $\\Phi\\left(\\dfrac{250-\\mu}{2}\\right)=0{,}01$. $\\Phi^{-1}(0{,}01)\\approx-2{,}326$. Also $\\dfrac{250-\\mu}{2}=-2{,}326$ und $\\mu=250+2\\cdot2{,}326\\approx254{,}65\\,ml$.",p:"Das Quantil für $0{,}01$ ist negativ. Beim Umstellen nach $\\mu$ wird addiert, nicht subtrahiert.",gg:"`InversNormal(0, 1, 0.01)`"},
{id:"n34",a:"sto",t:"reason",tg:"Unabhängigkeit",op:"Begründen",te:"A",lv:3,q:"Für zwei Ereignisse gilt $P(A)=0{,}5$, $P(B)=0{,}4$ und $P(A\\cup B)=0{,}7$. Begründen Sie, dass $A$ und $B$ stochastisch unabhängig sind.",mod:"Aus dem Additionssatz $P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$ folgt $P(A\\cap B)=0{,}5+0{,}4-0{,}7=0{,}2$.\nEs gilt $P(A)\\cdot P(B)=0{,}5\\cdot0{,}4=0{,}2=P(A\\cap B)$.\nAlso sind $A$ und $B$ stochastisch unabhängig.",cr:[["Additionssatz angesetzt",1],["$P(A\\cap B)=0{,}2$ berechnet",1],["Kriterium $P(A\\cap B)=P(A)\\cdot P(B)$ geprüft und Schluss formuliert",1]],h:"Erst $P(A\\cap B)$ bestimmen. Dann das Kriterium für Unabhängigkeit prüfen.",p:"Das Kriterium nennen. Nur die Zahl $0{,}2$ zu zeigen reicht nicht."},
{id:"n35",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist binomialverteilt mit $n=12$ und $p=0{,}3$. Berechnen Sie $P(X=3)$ (vier Nachkommastellen).",v:0.2397,tol:0.00006,h:"Formel $P(X=k)=\\dbinom{n}{k}\\cdot p^{k}\\cdot(1-p)^{n-k}$.",e:"$P(X=3)=\\dbinom{12}{3}\\cdot0{,}3^{3}\\cdot0{,}7^{9}=220\\cdot0{,}027\\cdot0{,}040353\\ldots\\approx0{,}2397$.",p:"Die Exponenten müssen zusammen $12$ ergeben: $3+9$.",gg:"`Binomial(12, 0.3, 3, false)`"},
{id:"n36",a:"sto",t:"num",tg:"Pfadregeln",op:"Berechnen",te:"A",lv:1,q:"Eine Urne enthält 3 rote und 2 blaue Kugeln. Es werden zwei Kugeln nacheinander ohne Zurücklegen gezogen. Berechnen Sie die Wahrscheinlichkeit, dass beide rot sind.",v:0.3,tol:0.0001,h:"Pfadregel: Wahrscheinlichkeiten entlang des Pfades multiplizieren. Beim zweiten Zug ändert sich die Anzahl.",e:"$P(RR)=\\dfrac{3}{5}\\cdot\\dfrac{2}{4}=\\dfrac{6}{20}=0{,}3$.",p:"Ohne Zurücklegen sinken Zähler und Nenner um 1 in der zweiten Stufe."}
);
