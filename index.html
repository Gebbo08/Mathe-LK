{id:"a01",a:"ana",t:"mc",tg:"Produktregel",op:"Bestimmen",te:"A",lv:1,q:"Bestimmen Sie die Ableitung von $f(x)=x^{2}\\cdot e^{x}$.",o:["$f'(x)=(2x+x^{2})\\cdot e^{x}$","$f'(x)=2x\\cdot e^{x}$","$f'(x)=x^{2}\\cdot e^{x}$","$f'(x)=(2x-x^{2})\\cdot e^{x}$"],c:0,h:"Produktregel mit $u=x^{2}$ und $v=e^{x}$.",e:"$u'=2x$ und $v'=e^{x}$. Also $f'(x)=2x\\cdot e^{x}+x^{2}\\cdot e^{x}=(2x+x^{2})\\cdot e^{x}$.",p:"Viele rechnen nur $u'\\cdot v'$. Die Produktregel hat zwei Summanden.",gg:"`f(x)=x^2 e^x` eingeben, dann `Ableitung(f)` oder `f'(x)`. Zur Kontrolle mit der Hand rechnen: Im Abitur zählt der Ansatz."},
{id:"a02",a:"ana",t:"mc",tg:"Integral",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie $\\displaystyle\\int_{0}^{1}(2x+1)\\,dx$.",o:["$1$","$2$","$3$","$0{,}5$"],c:1,h:"Erst eine Stammfunktion bilden, dann $F(1)-F(0)$.",e:"$F(x)=x^{2}+x$. $F(1)-F(0)=2-0=2$.",p:"Beim Einsetzen die untere Grenze nicht vergessen."},
{id:"a03",a:"ana",t:"mc",tg:"Wendestellen",op:"Begründen",te:"A",lv:2,q:"Welche Bedingung ist hinreichend dafür, dass $x_0$ eine Wendestelle von $f$ ist?",o:["$f'(x_0)=0$ und $f''(x_0)\\neq0$","$f''(x_0)=0$ und $f'''(x_0)\\neq0$","$f(x_0)=0$ und $f'(x_0)\\neq0$","$f''(x_0)>0$"],c:1,h:"Wendestelle heißt: Die Krümmung wechselt. Das hat mit $f''$ zu tun.",e:"Notwendig ist $f''(x_0)=0$. Hinreichend ist zusätzlich $f'''(x_0)\\neq0$ (oder ein Vorzeichenwechsel von $f''$). Die erste Antwort beschreibt eine Extremstelle.",p:"Notwendig und hinreichend nicht verwechseln."},
{id:"a04",a:"ana",t:"mc",tg:"Sinusfunktion",op:"Bestimmen",te:"A",lv:1,q:"Welche kleinste positive Periode hat $g(x)=\\sin(2x)+1$?",o:["$\\pi$","$2\\pi$","$\\dfrac{\\pi}{2}$","$4\\pi$"],c:0,h:"Bei $\\sin(b\\cdot x)$ ist die Periode $\\dfrac{2\\pi}{b}$.",e:"Hier ist $b=2$, also $\\dfrac{2\\pi}{2}=\\pi$. Das „$+1$“ verschiebt nur nach oben.",p:""},
{id:"a05",a:"ana",t:"mc",tg:"Logarithmus",op:"Bestimmen",te:"A",lv:1,q:"Bestimmen Sie den maximalen Definitionsbereich von $h(x)=\\ln(x-2)$.",o:["$x>2$","$x\\geq2$","$x>0$","$x\\neq2$"],c:0,h:"Das Argument des Logarithmus muss positiv sein.",e:"$x-2>0$ ergibt $x>2$, also $D=\\,]2;\\infty[$.",p:"$x\\geq2$ ist falsch: $\\ln(0)$ ist nicht definiert."},
{id:"a06",a:"ana",t:"num",tg:"Produktregel",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie $f'(0)$ für $f(x)=(x+1)\\cdot e^{2x}$.",v:3,tol:0.0001,h:"Produktregel, und bei $e^{2x}$ die Kettenregel: $(e^{2x})'=2\\cdot e^{2x}$.",e:"$f'(x)=e^{2x}+(x+1)\\cdot2\\cdot e^{2x}$. Bei $x=0$: $f'(0)=1+1\\cdot2\\cdot1=3$.",p:"Innere Ableitung 2 vergessen: Man erhält 2 statt 3."},
{id:"a07",a:"ana",t:"num",tg:"Kettenregel",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie $g'(1)$ für $g(x)=(2x+1)^{3}$.",v:54,tol:0.0001,h:"Äußere Ableitung mal innere Ableitung.",e:"$g'(x)=3\\cdot(2x+1)^{2}\\cdot2=6\\cdot(2x+1)^{2}$. Bei $x=1$: $6\\cdot9=54$.",p:"Die innere Ableitung 2 gehört dazu. Ohne sie erhält man 27."},
{id:"a08",a:"ana",t:"num",tg:"Integral",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie $\\displaystyle\\int_{1}^{e}\\frac{1}{x}\\,dx$.",v:1,tol:0.0001,h:"Welche Funktion hat $\\frac{1}{x}$ als Ableitung?",e:"$F(x)=\\ln(x)$. $F(e)-F(1)=1-0=1$.",p:""},
{id:"a09",a:"ana",t:"num",tg:"Integral",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie $\\displaystyle\\int_{0}^{\\pi/2}3\\cos(x)\\,dx$.",v:3,tol:0.0001,h:"Eine Stammfunktion von $\\cos(x)$ ist $\\sin(x)$.",e:"$F(x)=3\\sin(x)$. $F(\\frac{\\pi}{2})-F(0)=3\\cdot1-0=3$.",p:"Bogenmaß: $\\sin(\\frac{\\pi}{2})=1$. Der Rechner muss auf Bogenmaß stehen."},
{id:"a10",a:"ana",t:"mc",tg:"Steckbriefaufgabe",op:"Angeben",te:"A",lv:2,q:"Der Graph von $f(x)=ax^{3}+bx^{2}+cx+d$ hat im Punkt $H(0\\,|\\,2)$ einen Hochpunkt. Welche Bedingungen gehören dazu?",o:["$f(0)=2$ und $f'(0)=0$","$f(0)=2$ und $f''(0)=0$","$f'(0)=2$ und $f(0)=0$","$f(2)=0$ und $f'(2)=0$"],c:0,h:"Ein Punkt $(x\\,|\\,y)$ liefert $f(x)=y$. Ein Extrempunkt liefert zusätzlich $f'(x)=0$.",e:"Der Punkt liegt auf dem Graphen: $f(0)=2$. Hochpunkt heißt waagerechte Tangente: $f'(0)=0$. Die Art (Hochpunkt) prüft man danach mit $f''(0)<0$.",p:"Pro Information eine Gleichung. Aufschreiben, welche Eigenschaft welche Gleichung liefert."},
{id:"a11",a:"ana",t:"mc",tg:"Transformationen",op:"Bestimmen",te:"A",lv:2,q:"Welchen Wertebereich hat $g(x)=3\\sin\\big(2(x-1)\\big)+4$?",o:["$[1;7]$","$[-3;3]$","$[4;7]$","$[2;8]$"],c:0,h:"Amplitude 3, Mittellinie $y=4$.",e:"$\\sin$ liegt zwischen $-1$ und $1$. Mit Faktor 3 und Verschiebung um 4 ergibt sich $[4-3;\\,4+3]=[1;7]$.",p:""},
{id:"a12",a:"ana",t:"num",tg:"Sinusfunktion",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie die kleinste positive Stelle, an der $f(x)=2\\sin\\!\\big(\\frac{\\pi}{2}x\\big)+1$ den Wert $3$ annimmt.",v:1,tol:0.0001,h:"Löse $2\\sin(\\dots)+1=3$ nach $\\sin(\\dots)$ auf. Wann ist $\\sin$ gleich 1?",e:"$2\\sin(\\frac{\\pi}{2}x)=2$ ergibt $\\sin(\\frac{\\pi}{2}x)=1$. Die kleinste positive Lösung ist $\\frac{\\pi}{2}x=\\frac{\\pi}{2}$, also $x=1$.",p:"Alle Lösungen nennen, wenn danach gefragt ist, nicht nur die erste."},
{id:"a13",a:"ana",t:"num",tg:"Extremwertproblem",op:"Bestimmen",te:"A",lv:2,q:"Ein Rechteck hat den Umfang $20\\,\\text{m}$. Bestimmen Sie den größtmöglichen Flächeninhalt.",v:25,tol:0.0001,u:"m²",h:"Zielfunktion $A(a)=a\\cdot(10-a)$ aus der Nebenbedingung $2a+2b=20$.",e:"$A(a)=10a-a^{2}$. $A'(a)=10-2a=0$ ergibt $a=5$. $A''=-2<0$, also Maximum. $A(5)=25$.",p:"Zielfunktion, Nebenbedingung, Definitionsbereich, Art des Extremums: Jeder Schritt bringt Punkte."},
{id:"a14",a:"ana",t:"err",tg:"Produktregel",op:"Beurteilen",te:"A",lv:2,q:"Eine Schülerin leitet $f(x)=x^{2}\\cdot\\ln(x)$ ab. Wo steckt der Fehler?",s:["$u=x^{2}$, $v=\\ln(x)$","$u'=2x$, $v'=\\frac{1}{x}$","$f'(x)=u'\\cdot v'=2x\\cdot\\frac{1}{x}=2$","Ergebnis: $f'(x)=2$"],b:2,et:"versteh",h:"Schau auf die Produktregel: Wie sieht die Formel aus?",fx:"$f'(x)=u'\\cdot v+u\\cdot v'=2x\\cdot\\ln(x)+x^{2}\\cdot\\frac{1}{x}=2x\\cdot\\ln(x)+x$.",e:"Schritt 3 ist falsch: Die Ableitung eines Produkts ist nicht das Produkt der Ableitungen.",p:""},
{id:"a15",a:"ana",t:"err",tg:"Integral",op:"Beurteilen",te:"A",lv:2,q:"Ein Schüler berechnet $\\displaystyle\\int_{0}^{1}e^{2x}\\,dx$. Wo steckt der Fehler?",s:["Stammfunktion: $F(x)=e^{2x}$","$F(1)-F(0)=e^{2}-1$","Ergebnis: $\\approx6{,}39$"],b:0,et:"versteh",h:"Leite die vermeintliche Stammfunktion zur Probe ab.",fx:"$F(x)=\\frac{1}{2}e^{2x}$. Dann ist $F(1)-F(0)=\\frac{1}{2}(e^{2}-1)\\approx3{,}19$.",e:"Die Ableitung von $e^{2x}$ ist $2e^{2x}$, nicht $e^{2x}$. Rückwärts fehlt der Faktor $\\frac{1}{2}$ (Kettenregel rückwärts).",p:"Die Probe durch Ableiten fängt solche Fehler ab."},
{id:"a16",a:"ana",t:"reason",tg:"Extremstellen",op:"Begründen",te:"A",lv:2,q:"Begründen Sie, dass $f(x)=x^{3}+x$ keine Extremstellen besitzt.",mod:"$f'(x)=3x^{2}+1$. Wegen $x^{2}\\geq0$ gilt $f'(x)\\geq1>0$ für alle $x$. Also hat $f'$ keine Nullstelle. Eine Extremstelle braucht $f'(x)=0$. Deshalb gibt es keine Extremstellen ($f$ ist sogar streng monoton steigend).",cr:[["Ableitung $f'(x)=3x^{2}+1$ korrekt",1],["$f'(x)>0$ für alle $x$ begründet ($x^{2}\\geq0$)",1],["Schluss: keine Nullstelle von $f'$, also keine Extremstelle",1]],h:"Notwendige Bedingung für Extremstellen: $f'(x)=0$.",p:"„Begründen“ verlangt ganze Sätze mit Fachbegriffen."},
{id:"a17",a:"ana",t:"reason",tg:"Integral",op:"Begründen",te:"A",lv:2,q:"Begründen Sie ohne Rechnung, dass $\\displaystyle\\int_{-2}^{2}x^{3}\\,dx=0$ gilt.",mod:"Der Graph von $f(x)=x^{3}$ ist punktsymmetrisch zum Ursprung ($f(-x)=-f(x)$). Die Grenzen $-2$ und $2$ liegen symmetrisch zum Ursprung. Die Flächenstücke links und rechts sind gleich groß, haben aber verschiedene Vorzeichen (orientierte Flächen). Sie heben sich auf, das Integral ist 0.",cr:[["Punktsymmetrie von $x^{3}$ genannt ($f(-x)=-f(x)$)",1],["Symmetrische Integrationsgrenzen beachtet",1],["Orientierte Flächen heben sich auf",1]],h:"Denk an Symmetrie des Graphen und an orientierte Flächen.",p:"",g:{k:"fn",x:[-2.6,2.6],y:[-9,9],f:[{e:"x**3",t:"f",lx:2}],a:[{i:0,from:-2,to:0,neg:true},{i:0,from:0,to:2}],cap:"Graph von $f(x)=x^{3}$"}},
{id:"a18",a:"ana",t:"match",tg:"Funktionseigenschaften",op:"Zuordnen",te:"A",lv:1,q:"Ordnen Sie jedem Funktionsterm die passende Eigenschaft zu.",L:["$f(x)=e^{-x}$","$f(x)=\\ln(x)$","$f(x)=\\sqrt{x}$","$f(x)=x^{3}-x$"],R:["$D=\\,]0;\\infty[$, Wertebereich $\\mathbb{R}$","streng monoton fallend, Wertebereich $]0;\\infty[$","$D=[0;\\infty[$, Wertebereich $[0;\\infty[$","punktsymmetrisch zum Ursprung, drei Nullstellen"],m:[1,0,2,3],h:"Überleg dir bei jeder Funktion Definitionsbereich und Verlauf.",e:"$e^{-x}$ fällt und bleibt positiv. $\\ln(x)$ gibt es nur für $x>0$ und nimmt alle reellen Werte an. $\\sqrt{x}$ startet bei 0. $x^{3}-x=x(x-1)(x+1)$ hat drei Nullstellen und ist ungerade, also punktsymmetrisch.",p:""},
{id:"a19",a:"ana",t:"num",tg:"Integral",op:"Berechnen",te:"B",lv:2,q:"Berechnen Sie $\\displaystyle\\int_{0}^{2}e^{-x^{2}}\\,dx$ (vier Nachkommastellen). Dafür gibt es keine elementare Stammfunktion.",v:0.8821,tol:0.0005,h:"Eine Stammfunktion gibt es nicht. Das Integral wird numerisch bestimmt.",e:"Das Integral hat den Wert $\\approx0{,}8821$. Eine Stammfunktion lässt sich nicht aus bekannten Funktionen zusammensetzen. Deshalb rechnet man numerisch.",p:"Im Abitur den Ansatz aufschreiben: $\\int_{0}^{2}e^{-x^{2}}dx\\approx0{,}8821$.",gg:"CAS-Zeile: `Integral(e^(-x^2), 0, 2)`. Mit dem Pfeil-Symbol (≈) bestätigen, um eine Dezimalzahl zu erhalten.",g:{k:"fn",x:[-2.5,3],y:[-0.2,1.2],f:[{e:"exp(-(x**2))",t:"f",lx:1.1}],a:{i:0,from:0,to:2},cap:"$f(x)=e^{-x^{2}}$ mit der Fläche von $0$ bis $2$"}},
{id:"a20",a:"ana",t:"num",tg:"Gleichungen lösen",op:"Bestimmen",te:"B",lv:2,q:"Bestimmen Sie die kleinere der beiden Lösungen von $e^{x}=3x$ (drei Nachkommastellen).",v:0.619,tol:0.0006,h:"Löse die Gleichung numerisch, oder lass dir beide Graphen zeichnen und schneiden.",e:"Die Gleichung hat zwei Lösungen: $x\\approx0{,}619$ und $x\\approx1{,}512$.",p:"Prüfen, ob es mehrere Lösungen gibt. Der Graph hilft.",gg:"CAS-Zeile: `Löse(e^x = 3x)` liefert oft nur eine Formel. Mit dem ≈-Symbol bekommst du Dezimalzahlen. Findet das CAS nichts, hilft `NLöse(e^x = 3x, x = 0.5)` mit einem Startwert nahe der Lösung.",g:{k:"fn",x:[-1,3],y:[-1,9],f:[{e:"exp(x)",t:"e^x",lx:2.2},{e:"3*x",t:"3x",lx:2.5,c:1}],p:[[0.619,1.857],[1.512,4.536]],cap:"Die Graphen von $y=e^{x}$ und $y=3x$ schneiden sich zweimal."}},
{id:"a21",a:"ana",t:"num",tg:"Bestand",op:"Berechnen",te:"B",lv:2,q:"Ein Behälter wird mit der Zuflussrate $r(t)=20\\cdot e^{-0{,}1t}$ gefüllt ($t$ in Minuten, $r$ in Liter pro Minute). Berechnen Sie die Wassermenge in den ersten 10 Minuten.",v:126.4,tol:0.1,u:"Liter",h:"Die Menge ist das Integral der Rate.",e:"$\\displaystyle\\int_{0}^{10}20\\cdot e^{-0{,}1t}\\,dt=200\\cdot(1-e^{-1})\\approx126{,}4$ Liter.",p:"Einheit im Antwortsatz nennen.",gg:"`Integral(20 e^(-0.1 t), 0, 10)` (Variable im Term muss zur Integrationsvariable passen; im CAS gern `x` statt `t` verwenden: `Integral(20 e^(-0.1 x), 0, 10)`).",g:{k:"fn",x:[0,12],y:[0,22],f:[{e:"20*exp(-0.1*x)",t:"r",lx:9}],a:{i:0,from:0,to:10},cap:"Zuflussrate $r(t)$ in l/min, Fläche = zugeflossene Menge"}},
{id:"a22",a:"ana",t:"num",tg:"Extremstellen",op:"Bestimmen",te:"B",lv:2,q:"Gegeben ist $f(x)=x\\cdot e^{-0{,}5x}$. Bestimmen Sie die $y$-Koordinate des Hochpunkts (vier Nachkommastellen).",v:0.7358,tol:0.0005,h:"$f'(x)=0$ lösen, dann in $f$ einsetzen.",e:"$f'(x)=e^{-0{,}5x}\\cdot(1-0{,}5x)=0$ ergibt $x=2$. $f(2)=2\\cdot e^{-1}\\approx0{,}7358$.",p:"Koordinaten als Punkt angeben: $H(2\\,|\\,0{,}7358)$.",gg:"`f(x)=x e^(-0.5x)`, dann `Extremum(f)` (im Prüfungsmodus kann das gesperrt sein). Sicherer: `Löse(f'(x)=0)` und danach `f(2)` berechnen.",g:{k:"fn",x:[-1,9],y:[-0.5,1],f:[{e:"x*exp(-0.5*x)",t:"f",lx:7}],cap:"Graph von $f(x)=x\\cdot e^{-0{,}5x}$"}},
{id:"a23",a:"ana",t:"num",tg:"Produktregel",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie $f'(e)$ für $f(x)=x\\cdot\\ln(x)$.",v:2,tol:0.0001,h:"Produktregel mit $u=x$ und $v=\\ln(x)$.",e:"$f'(x)=1\\cdot\\ln(x)+x\\cdot\\frac{1}{x}=\\ln(x)+1$. $f'(e)=1+1=2$.",p:""},
{id:"a24",a:"ana",t:"num",tg:"Funktionsscharen",op:"Bestimmen",te:"A",lv:2,q:"Gegeben ist $f_k(x)=x^{3}-k\\cdot x$ mit $k>0$. Für welchen Wert von $k$ hat $f_k$ an der Stelle $x=1$ eine Extremstelle?",v:3,tol:0.0001,h:"Notwendige Bedingung: $f_k'(1)=0$.",e:"$f_k'(x)=3x^{2}-k$. $f_k'(1)=3-k=0$ ergibt $k=3$.",p:"Beim Scharparameter wie bei einer Zahl rechnen: $k$ bleibt stehen."},
{id:"a25",a:"ana",t:"num",tg:"Tangente",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den $y$-Achsenabschnitt der Tangente an den Graphen von $f(x)=x^{2}$ an der Stelle $x=3$.",v:-9,tol:0.0001,h:"Tangente: $y=f(3)+f'(3)\\cdot(x-3)$.",e:"$f(3)=9$, $f'(3)=6$. $t(x)=9+6(x-3)=6x-9$. Der $y$-Achsenabschnitt ist $-9$.",p:"",g:{k:"fn",x:[-1,5],y:[-10,16],f:[{e:"x**2",t:"f",lx:4},{e:"6*x-9",t:"t",lx:4.3,c:1,d:true}],p:[[3,9,"P(3 | 9)","ul"]],cap:"Parabel und Tangente im Punkt $P$"}},
{id:"a26",a:"ana",t:"mc",tg:"Hauptsatz",op:"Angeben",te:"A",lv:1,q:"Es sei $J(x)=\\displaystyle\\int_{0}^{x}f(t)\\,dt$. Was gilt nach dem Hauptsatz der Differential- und Integralrechnung für $J'(x)$?",o:["$J'(x)=f(x)$","$J'(x)=F(x)$","$J'(x)=f'(x)$","$J'(x)=J(x)$"],c:0,h:"Eine Integralfunktion abzuleiten bringt den Integranden zurück.",e:"Die Ableitung einer Integralfunktion ist der Integrand: $J'(x)=f(x)$.",p:""},
{id:"a27",a:"ana",t:"num",tg:"Logarithmus",op:"Berechnen",te:"A",lv:1,q:"Lösen Sie $2\\ln(x)=6$. Geben Sie $x$ auf zwei Nachkommastellen an.",v:20.09,tol:0.01,h:"Erst durch 2 teilen, dann $e$ hoch beide Seiten.",e:"$\\ln(x)=3$ ergibt $x=e^{3}\\approx20{,}09$.",p:"Im Pflichtteil darf der exakte Wert $e^{3}$ stehen bleiben."},
{id:"a28",a:"ana",t:"mc",tg:"Sinusfunktion",op:"Bestimmen",te:"A",lv:2,q:"Welche Funktion hat die Amplitude 2, die Periode 4, die Mittellinie $y=1$, und es gilt $f(0)=1$ (an dieser Stelle steigend)?",o:["$f(x)=2\\sin\\!\\big(\\frac{\\pi}{2}x\\big)+1$","$f(x)=2\\sin(4x)+1$","$f(x)=4\\sin\\!\\big(\\frac{\\pi}{2}x\\big)+2$","$f(x)=2\\sin(\\pi x)+1$"],c:0,h:"Periode $=\\dfrac{2\\pi}{b}$. Rechne $b$ aus.",e:"Periode 4 heißt $\\frac{2\\pi}{b}=4$, also $b=\\frac{\\pi}{2}$. Amplitude 2 und Mittellinie 1 ergeben $2\\sin(\\frac{\\pi}{2}x)+1$. Die anderen Terme haben die Periode $\\frac{\\pi}{2}$, Amplitude 4 oder Periode 2.",p:""},
{id:"a29",a:"ana",t:"num",tg:"Flächeninhalt",op:"Berechnen",te:"A",lv:2,q:"Die Parabel $y=x^{2}$ und die Gerade $y=4$ schließen eine Fläche ein. Berechnen Sie den Inhalt (zwei Nachkommastellen).",v:10.67,tol:0.01,u:"FE",h:"Schnittstellen bestimmen, dann $\\int(\\text{obere}-\\text{untere})$.",e:"Schnittstellen $x=\\pm2$. $A=\\displaystyle\\int_{-2}^{2}(4-x^{2})\\,dx=\\Big[4x-\\frac{x^{3}}{3}\\Big]_{-2}^{2}=\\frac{32}{3}\\approx10{,}67$.",p:"Erst die Schnittstellen, dann das Integral. Obere Funktion minus untere Funktion.",g:{k:"fn",x:[-3,3],y:[-1,6],f:[{e:"x**2",t:"y = x^2",lx:2.1},{e:"4",c:1}],a:{f:"4",g:"x**2",from:-2,to:2},cap:"Die Fläche zwischen Parabel und Gerade"}},
/* --- neu: Analysis mit Grafik --- */
{id:"a30",a:"ana",t:"mc",tg:"Ableitungsgraph lesen",op:"Bestimmen",te:"A",lv:2,q:"Abgebildet ist der Graph der **Ableitung** $f'$ einer Funktion $f$. Bestimmen Sie die Stelle, an der $f$ einen Hochpunkt hat.",o:["$x=-1$","$x=2$","$x=0{,}5$","$x=-1$ und $x=2$"],c:0,h:"Ein Hochpunkt von $f$ braucht eine Nullstelle von $f'$ mit Vorzeichenwechsel von $+$ nach $-$.",e:"Bei $x=-1$ wechselt $f'$ von $+$ nach $-$: Hochpunkt. Bei $x=2$ wechselt $f'$ von $-$ nach $+$: Tiefpunkt. Bei $x=0{,}5$ hat $f'$ ein Minimum, also hat $f$ dort eine Wendestelle.",p:"Nullstelle von $f'$ allein reicht nicht. Der Vorzeichenwechsel entscheidet über Hoch- oder Tiefpunkt.",g:{k:"fn",x:[-3,4],y:[-2,4],f:[{e:"0.5*(x+1)*(x-2)",t:"f′",lx:3.2}],p:[[-1,0],[2,0]],cap:"Graph von $f'$"}},
{id:"a31",a:"ana",t:"num",tg:"Flächeninhalt",op:"Berechnen",te:"A",lv:3,q:"Der Graph von $f(x)=x^{3}-4x$ schließt mit der $x$-Achse zwei Flächenstücke ein. Berechnen Sie den **Gesamt**flächeninhalt.",v:8,tol:0.0001,u:"FE",h:"Nullstellen bestimmen. Die Flächenstücke liegen auf verschiedenen Seiten der $x$-Achse. Nutze die Symmetrie.",e:"$f(x)=x(x-2)(x+2)$ hat die Nullstellen $-2,\\,0,\\,2$. Wegen der Punktsymmetrie gilt $A=2\\cdot\\Big|\\displaystyle\\int_{0}^{2}(x^{3}-4x)\\,dx\\Big|=2\\cdot\\Big|\\Big[\\frac{x^{4}}{4}-2x^{2}\\Big]_{0}^{2}\\Big|=2\\cdot|4-8|=8$.",p:"$\\int_{-2}^{2}f(x)\\,dx$ ergibt 0, weil sich die Flächen aufheben. Teilintervalle bilden oder den Betrag integrieren.",gg:"`Integral(abs(x^3-4x), -2, 2)` liefert direkt 8. Die Nullstellen findest du mit `Löse(x^3-4x=0)`.",g:{k:"fn",x:[-2.8,2.8],y:[-4,4],f:[{e:"x**3-4*x",t:"f",lx:2.4}],a:[{i:0,from:-2,to:0},{i:0,from:0,to:2,neg:true}],cap:"Die beiden Flächenstücke zwischen $f$ und der $x$-Achse"}},
{id:"a32",a:"ana",t:"num",tg:"Fläche zwischen Graphen",op:"Berechnen",te:"A",lv:2,q:"Die Graphen von $f(x)=x^{2}$ und $g(x)=x+2$ schließen eine Fläche ein. Berechnen Sie ihren Inhalt.",v:4.5,tol:0.001,u:"FE",h:"Schnittstellen aus $x^{2}=x+2$, dann $\\int(g-f)$.",e:"$x^{2}=x+2$ ergibt $x_1=-1$ und $x_2=2$. $A=\\displaystyle\\int_{-1}^{2}(x+2-x^{2})\\,dx=\\Big[\\frac{x^{2}}{2}+2x-\\frac{x^{3}}{3}\\Big]_{-1}^{2}=\\frac{9}{2}$.",p:"Erst die Schnittstellen lösen und aufschreiben. Dann obere minus untere Funktion.",gg:"`Löse(x^2 = x + 2)` gibt die Grenzen. Dann `Integral(abs(x+2-x^2), -1, 2)`.",g:{k:"fn",x:[-2.5,3.5],y:[-1,7],f:[{e:"x**2",t:"f",lx:2.4},{e:"x+2",t:"g",lx:3,c:1}],a:{f:"x+2",g:"x**2",from:-1,to:2},cap:"Graphen von $f$ und $g$"}},
{id:"a33",a:"ana",t:"mc",tg:"Sinusfunktion",op:"Bestimmen",te:"A",lv:3,q:"Der abgebildete Graph gehört zu einer Funktion der Form $f(x)=a\\cdot\\sin\\big(b\\,(x-c)\\big)+d$. Welcher Term passt?",o:["$f(x)=1{,}5\\sin\\!\\big(\\frac{\\pi}{2}(x-1)\\big)+2$","$f(x)=1{,}5\\sin\\!\\big(\\frac{\\pi}{2}x\\big)+2$","$f(x)=3\\sin\\!\\big(\\frac{\\pi}{2}(x-1)\\big)+2$","$f(x)=1{,}5\\sin\\!\\big(2(x-1)\\big)+2$"],c:0,h:"Lies ab: Maximum und Minimum geben $a$ und $d$. Die Periode gibt $b$. Wo steigt der Graph durch die Mittellinie?",e:"Maximum 3,5 und Minimum 0,5: $d=2$, $a=1{,}5$. Die Periode ist 4, also $b=\\frac{2\\pi}{4}=\\frac{\\pi}{2}$. Der Graph steigt bei $x=1$ durch die Mittellinie, also $c=1$.",p:"Die Verschiebung $c$ steht in der Klammer mit Minus: $(x-c)$.",g:{k:"fn",x:[-1,7],y:[-0.5,4],f:[{e:"1.5*sin(pi/2*(x-1))+2",t:"f",lx:6.2}],hl:[2],cap:"Graph von $f$ mit der Mittellinie (gestrichelt)"}},
{id:"a34",a:"ana",t:"num",tg:"Tangente",op:"Berechnen",te:"A",lv:3,q:"Die Tangente $t$ an den Graphen von $f(x)=\\ln(x)$ im Punkt $P(2\\,|\\,\\ln 2)$ schneidet die $x$-Achse. Berechnen Sie die Stelle dieses Schnittpunkts (vier Nachkommastellen).",v:0.6137,tol:0.0006,h:"$f'(x)=\\frac{1}{x}$, also $m=f'(2)=\\frac{1}{2}$. Tangente: $t(x)=\\ln 2+\\frac{1}{2}(x-2)$. Dann $t(x)=0$ lösen.",e:"$t(x)=\\ln 2+\\frac{1}{2}(x-2)=0$ ergibt $x-2=-2\\ln 2$, also $x=2-2\\ln 2\\approx0{,}6137$.",p:"Erst die Tangentengleichung aufstellen, dann gleich null setzen.",gg:"Mit Tangente-Befehl (im Prüfungsmodus oft gesperrt): `Tangente(2, ln(x))`. Sicherer: `Löse(ln(2) + 1/2 (x-2) = 0)`.",g:{k:"fn",x:[-0.5,4.5],y:[-2.5,2],f:[{e:"log(x)",t:"f",lx:4},{e:"log(2)+0.5*(x-2)",t:"t",lx:3.6,c:1,d:true}],p:[[2,0.693,"P","ul"]],cap:"Graph von $f$ mit der Tangente $t$ in $P$"}},
{id:"a35",a:"ana",t:"num",tg:"Wendestellen",op:"Bestimmen",te:"A",lv:2,q:"Bestimmen Sie die $y$-Koordinate des Wendepunkts von $f(x)=x^{3}-6x^{2}+9x$.",v:2,tol:0.0001,h:"$f''(x)=0$ lösen, dann in $f$ einsetzen. Prüfe mit $f'''$.",e:"$f'(x)=3x^{2}-12x+9$, $f''(x)=6x-12$. $f''(x)=0$ ergibt $x=2$. $f'''(x)=6\\neq0$. $f(2)=8-24+18=2$. Der Wendepunkt ist $W(2\\,|\\,2)$.",p:"Hinreichende Bedingung nennen ($f'''(x_0)\\neq0$). Die $y$-Koordinate mit $f$ berechnen, nicht mit $f''$.",g:{k:"fn",x:[-0.6,4.6],y:[-2,5.5],f:[{e:"x**3-6*x**2+9*x",t:"f",lx:4.2}],cap:"Graph von $f$"}},
{id:"a36",a:"ana",t:"num",tg:"Funktionsscharen",op:"Bestimmen",te:"A",lv:3,q:"Gegeben ist die Schar $f_k(x)=x\\cdot e^{-kx}$ mit $k>0$. Bestimmen Sie $k$ so, dass der Hochpunkt bei $x=0{,}5$ liegt.",v:2,tol:0.0001,h:"Produktregel und Kettenregel für $f_k'$. Dann $f_k'(x)=0$ nach $x$ lösen.",e:"$f_k'(x)=e^{-kx}-kx\\cdot e^{-kx}=e^{-kx}\\cdot(1-kx)$. Wegen $e^{-kx}>0$ folgt $1-kx=0$, also $x=\\frac{1}{k}$. Mit $\\frac{1}{k}=0{,}5$ ergibt sich $k=2$.",p:"$e^{-kx}>0$ begründen, bevor du es weglässt.",gg:"CAS: `f(x)=x e^(-k x)`, `Löse(f'(x)=0, x)` gibt $x=1/k$. Beachte: Bei `f'(x)` wird nach $x$ abgeleitet, $k$ bleibt Konstante.",g:{k:"fn",x:[0,5],y:[-0.05,0.8],f:[{e:"x*exp(-0.5*x)",t:"k = 0,5",lx:3.4,c:0},{e:"x*exp(-1*x)",t:"k = 1",lx:2.2,c:1},{e:"x*exp(-2*x)",t:"k = 2",lx:1.2,c:2}],cap:"Drei Kurven der Schar für $k=0{,}5$, $1$ und $2$"}},
{id:"a37",a:"ana",t:"num",tg:"Mittelwert",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Mittelwert der Funktion $f(x)=x^{2}$ auf dem Intervall $[0;3]$.",v:3,tol:0.0001,h:"Mittelwert $=\\dfrac{1}{b-a}\\displaystyle\\int_{a}^{b}f(x)\\,dx$.",e:"$\\bar f=\\dfrac{1}{3-0}\\displaystyle\\int_{0}^{3}x^{2}\\,dx=\\dfrac{1}{3}\\Big[\\dfrac{x^{3}}{3}\\Big]_{0}^{3}=\\dfrac{1}{3}\\cdot9=3$.",p:"Durch die Länge des Intervalls teilen, nicht nur integrieren.",g:{k:"fn",x:[-0.5,3.5],y:[-1,10],f:[{e:"x**2",t:"f",lx:3.1}],a:{i:0,from:0,to:3},cap:"Fläche unter $f$ auf $[0;3]$"}},
{id:"a38",a:"ana",t:"num",tg:"Rationale Potenzen",op:"Berechnen",te:"A",lv:2,q:"Der Graph von $f(x)=\\sqrt{x}$, die $x$-Achse und die Gerade $x=4$ schließen eine Fläche ein. Berechnen Sie ihren Inhalt (zwei Nachkommastellen).",v:5.33,tol:0.01,u:"FE",h:"Schreibe $\\sqrt{x}=x^{1/2}$. Dann bilde die Stammfunktion mit der Potenzregel.",e:"$F(x)=\\frac{2}{3}x^{3/2}$. $A=F(4)-F(0)=\\frac{2}{3}\\cdot8=\\frac{16}{3}\\approx5{,}33$.",p:"Wurzel als Potenz schreiben. Der Exponent wird beim Integrieren um 1 größer.",g:{k:"fn",x:[-0.5,5],y:[-0.5,2.6],f:[{e:"sqrt(x)",t:"f",lx:4.4}],a:{i:0,from:0,to:4},cap:"Graph von $f(x)=\\sqrt{x}$"}},
{id:"a39",a:"ana",t:"num",tg:"Extremwertproblem",op:"Bestimmen",te:"B",lv:3,q:"Dem Graphen von $f(x)=4-x^{2}$ für $0\\leq x\\leq2$ wird ein Rechteck einbeschrieben (Ecken $O(0\\,|\\,0)$ und $P(u\\,|\\,f(u))$). Bestimmen Sie den maximalen Flächeninhalt (vier Nachkommastellen).",v:3.0792,tol:0.002,u:"FE",h:"Zielfunktion $A(u)=u\\cdot f(u)$. Maximum über $A'(u)=0$.",e:"$A(u)=u\\cdot(4-u^{2})=4u-u^{3}$. $A'(u)=4-3u^{2}=0$ ergibt $u=\\frac{2}{\\sqrt{3}}\\approx1{,}1547$. $A''(u)=-6u<0$: Maximum. $A\\approx3{,}0792$.",p:"Definitionsbereich $0\\leq u\\leq2$ und Art des Extremums angeben. Auch die Randwerte prüfen: $A(0)=A(2)=0$.",gg:"Zielfunktion `A(u)=u (4-u^2)` definieren, dann `Löse(A'(u)=0)` und `A(2/sqrt(3))`.",g:{k:"fn",x:[-0.6,2.6],y:[-0.5,4.6],f:[{e:"4-x**2",t:"f",lx:-0.1}],r:[[0,0,1,3]],cap:"Ein mögliches Rechteck für $u=1$"}},
{id:"a40",a:"ana",t:"num",tg:"Steckbriefaufgabe",op:"Bestimmen",te:"B",lv:3,q:"Der Graph einer ganzrationalen Funktion dritten Grades $f(x)=ax^{3}+bx^{2}+cx+d$ hat den Hochpunkt $H(0\\,|\\,0)$ und den Tiefpunkt $T(2\\,|\\,-4)$ (siehe Skizze). Bestimmen Sie den Koeffizienten $b$.",v:-3,tol:0.0001,h:"Vier Unbekannte, also vier Bedingungen: Jeder Extrempunkt liefert zwei Gleichungen.",e:"$f(0)=0$ ergibt $d=0$. $f'(0)=0$ ergibt $c=0$. $f(2)=8a+4b=-4$ und $f'(2)=12a+4b=0$. Subtraktion: $4a=4$, also $a=1$ und $b=-3$.",p:"Die Bedingungen mit $f'(x)=3ax^{2}+2bx+c$ aufschreiben, bevor du das Gleichungssystem löst.",gg:"`f(x)=a x^3+b x^2+c x+d`, dann `Löse({f(0)=0, f'(0)=0, f(2)=-4, f'(2)=0}, {a,b,c,d})`. Alle vier Gleichungen und die Variablen in geschweiften Klammern.",g:{k:"fn",x:[-1.5,3.5],y:[-5,3],f:[{e:"x**3-3*x**2",t:"f",lx:3.1}],p:[[0,0,"H","ul"],[2,-4,"T","ur"]],cap:"Skizze des Graphen von $f$"}},
{id:"a41",a:"ana",t:"num",tg:"Logarithmus",op:"Bestimmen",te:"A",lv:2,q:"Bestimmen Sie die Nullstelle von $f(x)=2\\ln(x)-1$ (vier Nachkommastellen).",v:1.6487,tol:0.0006,h:"$2\\ln(x)=1$. Löse nach $x$ auf.",e:"$\\ln(x)=\\frac{1}{2}$ ergibt $x=e^{1/2}=\\sqrt{e}\\approx1{,}6487$.",p:"Den Definitionsbereich $x>0$ prüfen.",g:{k:"fn",x:[-0.5,4.5],y:[-4,2.5],f:[{e:"2*log(x)-1",t:"f",lx:4}],cap:"Graph von $f$"}},
{id:"a42",a:"ana",t:"num",tg:"Wendestellen",op:"Bestimmen",te:"A",lv:3,q:"Bestimmen Sie die positive Wendestelle von $f(x)=e^{-x^{2}}$ (vier Nachkommastellen).",v:0.7071,tol:0.0006,h:"Zweimal ableiten (Kettenregel, dann Produktregel). Dann $f''(x)=0$.",e:"$f'(x)=-2x\\cdot e^{-x^{2}}$. $f''(x)=(4x^{2}-2)\\cdot e^{-x^{2}}$. Wegen $e^{-x^{2}}>0$ gilt $4x^{2}-2=0$, also $x=\\pm\\frac{1}{\\sqrt{2}}\\approx\\pm0{,}7071$.",p:"$f''$ nicht vorschnell $=0$ setzen: Erst $e^{-x^{2}}>0$ begründen.",g:{k:"fn",x:[-3,3],y:[-0.2,1.2],f:[{e:"exp(-(x**2))",t:"f",lx:1.6}],cap:"Die Glockenkurve $f(x)=e^{-x^{2}}$"}},
{id:"a43",a:"ana",t:"mc",tg:"Asymptoten",op:"Bestimmen",te:"A",lv:2,q:"Der Graph gehört zu $f(x)=2e^{-x}+1$. Welche waagerechte Asymptote hat er für $x\\to\\infty$?",o:["$y=1$","$y=0$","$y=2$","$y=3$"],c:0,h:"Was passiert mit $e^{-x}$ für $x\\to\\infty$?",e:"$e^{-x}\\to0$ für $x\\to\\infty$, also $f(x)\\to1$. Die Asymptote ist $y=1$.",p:"Den Grenzwert kurz begründen: $e^{-x}\\to0$.",g:{k:"fn",x:[-2,4],y:[0,6],f:[{e:"2*exp(-x)+1",t:"f",lx:-1.3}],cap:"Graph von $f$"}},
{id:"a44",a:"ana",t:"num",tg:"Bestand",op:"Berechnen",te:"A",lv:2,q:"Die Zuflussrate in einen Tank beträgt $r(t)=-0{,}25t^{2}+2t$ ($t$ in Minuten, $r$ in Litern pro Minute, $0\\leq t\\leq8$). Berechnen Sie, wie viele Liter in den ersten 8 Minuten zufließen (zwei Nachkommastellen).",v:21.33,tol:0.02,u:"Liter",h:"Die zugeflossene Menge ist das Integral der Rate.",e:"$\\displaystyle\\int_{0}^{8}(-0{,}25t^{2}+2t)\\,dt=\\Big[-\\frac{t^{3}}{12}+t^{2}\\Big]_{0}^{8}=-\\frac{512}{12}+64=\\frac{64}{3}\\approx21{,}33$ Liter.",p:"Im Antwortsatz Einheit und Bedeutung nennen.",g:{k:"fn",x:[-1,9],y:[-1,5],f:[{e:"-0.25*x**2+2*x",t:"r",lx:7.2}],a:{i:0,from:0,to:8},cap:"Zuflussrate $r(t)$, die Fläche ist die zugeflossene Menge"}},

/* ---------- Geometrie ---------- */
{id:"g01",a:"geo",t:"mc",tg:"Abstand Punkt–Ebene",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie den Abstand von $P(2\\,|\\,0\\,|\\,0)$ zur Ebene $E:\\ x_1+2x_2+2x_3=5$.",o:["$1$","$3$","$\\frac{1}{3}$","$\\frac{7}{3}$"],c:0,h:"Setze $P$ links ein, ziehe 5 ab, teile durch $|\\vec n|$.",e:"$d=\\dfrac{|2+0+0-5|}{\\sqrt{1+4+4}}=\\dfrac{3}{3}=1$.",p:"Häufiger Fehler: die rechte Seite „$-5$“ vergessen."},
{id:"g02",a:"geo",t:"mc",tg:"Skalarprodukt",op:"Begründen",te:"A",lv:1,q:"Es seien $\\vec a=\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ und $\\vec b=\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}$. Was gilt?",o:["$\\vec a$ und $\\vec b$ sind parallel","$\\vec a$ und $\\vec b$ sind orthogonal","$\\vec a$ und $\\vec b$ sind gleich lang","Der Winkel beträgt $45^\\circ$"],c:1,h:"Berechne $\\vec a\\cdot\\vec b$.",e:"$\\vec a\\cdot\\vec b=1\\cdot2+2\\cdot(-1)+2\\cdot0=0$. Skalarprodukt null heißt orthogonal.",p:""},
{id:"g03",a:"geo",t:"mc",tg:"Geraden",op:"Bestimmen",te:"A",lv:1,q:"Gegeben ist $g:\\ \\vec x=\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}+r\\cdot\\begin{pmatrix}2\\\\1\\\\-1\\end{pmatrix}$. Welcher Punkt liegt auf $g$?",o:["$(3\\,|\\,2\\,|\\,1)$","$(5\\,|\\,2\\,|\\,0)$","$(5\\,|\\,1\\,|\\,0)$","$(4\\,|\\,2\\,|\\,0)$"],c:1,h:"Ein Punkt liegt auf $g$, wenn ein einziges $r$ in allen drei Zeilen passt.",e:"Für $r=2$ ergibt sich $(1+4\\,|\\,0+2\\,|\\,2-2)=(5\\,|\\,2\\,|\\,0)$.",p:""},
{id:"g04",a:"geo",t:"mc",tg:"Ebenen",op:"Angeben",te:"A",lv:1,q:"Geben Sie einen Normalenvektor von $E:\\ 3x_1-x_2+4x_3=7$ an.",o:["$\\begin{pmatrix}3\\\\-1\\\\4\\end{pmatrix}$","$\\begin{pmatrix}3\\\\1\\\\4\\end{pmatrix}$","$\\begin{pmatrix}7\\\\3\\\\-1\\end{pmatrix}$","$\\begin{pmatrix}-3\\\\-1\\\\4\\end{pmatrix}$"],c:0,h:"Die Koeffizienten der Koordinatenform lesen.",e:"Die Koeffizienten vor $x_1,x_2,x_3$ bilden einen Normalenvektor: $\\vec n=\\begin{pmatrix}3\\\\-1\\\\4\\end{pmatrix}$.",p:""},
{id:"g05",a:"geo",t:"mc",tg:"Lagebeziehungen",op:"Begründen",te:"A",lv:2,q:"Eine Gerade $g$ hat den Richtungsvektor $\\vec u$, die Ebene $E$ den Normalenvektor $\\vec n$. Wann ist $g$ echt parallel zu $E$?",o:["$\\vec u\\cdot\\vec n=0$ und ein Punkt von $g$ liegt nicht in $E$","$\\vec u\\cdot\\vec n\\neq0$","$\\vec u=\\vec n$","$\\vec u$ und $\\vec n$ sind parallel zueinander"],c:0,h:"Parallel heißt: Die Richtung liegt in der Ebene, steht also senkrecht auf $\\vec n$.",e:"$\\vec u\\perp\\vec n$ bedeutet, dass $g$ in Richtung der Ebene verläuft. Liegt ein Punkt von $g$ in $E$, liegt $g$ ganz in $E$. Sonst ist $g$ echt parallel.",p:"Nach $\\vec u\\cdot\\vec n=0$ immer noch einen Punkt prüfen."},
{id:"g06",a:"geo",t:"num",tg:"Abstand Punkt–Ebene",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Abstand von $Q(3\\,|\\,1\\,|\\,-2)$ zur Ebene $E:\\ 2x_1-2x_2+x_3=1$. (Ein Bruch wie $\\frac{1}{3}$ ist erlaubt.)",v:0.3333,tol:0.005,h:"Einsetzen, rechte Seite abziehen, durch $|\\vec n|$ teilen.",e:"$2\\cdot3-2\\cdot1+(-2)=2$. Dann $2-1=1$. $|\\vec n|=\\sqrt{4+4+1}=3$. Also $d=\\frac{1}{3}$.",p:"Formel mit Zwischenschritten aufschreiben."},
{id:"g07",a:"geo",t:"num",tg:"Winkel",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Winkel $\\varphi$ zwischen $\\vec a=\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}$ und $\\vec b=\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}$ in Grad.",v:60,tol:0.5,u:"°",h:"$\\cos\\varphi=\\dfrac{\\vec a\\cdot\\vec b}{|\\vec a|\\cdot|\\vec b|}$.",e:"$\\vec a\\cdot\\vec b=1$. $|\\vec a|=|\\vec b|=\\sqrt{2}$. $\\cos\\varphi=\\frac{1}{2}$, also $\\varphi=60^\\circ$.",p:"",gg:"`u=(1,0,1)`, `v=(0,1,1)`, dann `Winkel(u,v)`. Im CAS kommt das Ergebnis im Bogenmaß (π/3). Umrechnen mit `Winkel(u,v)*180/π`. Wenn `Winkel` gesperrt ist: `arccos(Skalarprodukt(u,v)/(Länge(u) Länge(v)))`."},
{id:"g08",a:"geo",t:"num",tg:"Schnittwinkel",op:"Berechnen",te:"A",lv:2,q:"Eine Gerade hat den Richtungsvektor $\\vec u=\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}$. Berechnen Sie ihren Schnittwinkel mit der $x_1x_2$-Ebene ($E:\\ x_3=0$) in Grad.",v:45,tol:0.5,u:"°",h:"Bei Gerade und Ebene: $\\sin\\alpha=\\dfrac{|\\vec u\\cdot\\vec n|}{|\\vec u|\\cdot|\\vec n|}$.",e:"$\\vec n=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. $\\sin\\alpha=\\frac{1}{\\sqrt{2}}$, also $\\alpha=45^\\circ$.",p:"Gerade–Ebene: $\\sin\\alpha$, nicht $\\cos\\alpha$."},
{id:"g09",a:"geo",t:"num",tg:"Schnittpunkt",op:"Bestimmen",te:"A",lv:2,q:"Gegeben sind $g:\\ \\vec x=\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}+r\\cdot\\begin{pmatrix}2\\\\1\\\\-1\\end{pmatrix}$ und $E:\\ x_1+x_2+x_3=6$. Bestimmen Sie die $x_1$-Koordinate des Schnittpunkts.",v:4,tol:0.0001,h:"Setze die Koordinaten von $g$ in die Ebenengleichung ein.",e:"$(1+2r)+r+(2-r)=3+2r=6$ ergibt $r=1{,}5$. $S(4\\,|\\,1{,}5\\,|\\,0{,}5)$. Also $x_1=4$.",p:"Den Parameter $r$ auch zurück in die Geradengleichung einsetzen.",gg:"`Schnittpunkt(Ebene, Gerade)` im Algebra-Fenster, oder im CAS: `Löse(1+2r + r + 2-r = 6, r)` und dann $r$ in die Gerade einsetzen."},
{id:"g10",a:"geo",t:"mc",tg:"Ebenen",op:"Bestimmen",te:"A",lv:2,q:"Die Ebene $E$ enthält die Punkte $A(1\\,|\\,0\\,|\\,0)$, $B(0\\,|\\,2\\,|\\,0)$ und $C(0\\,|\\,0\\,|\\,3)$. Welche Koordinatengleichung passt?",o:["$6x_1+3x_2+2x_3=6$","$x_1+2x_2+3x_3=6$","$3x_1+2x_2+x_3=6$","$6x_1+3x_2+2x_3=1$"],c:0,h:"Probe: Setze $A$, $B$ und $C$ in die Gleichungen ein.",e:"Achsenabschnitte 1, 2, 3 ergeben $\\frac{x_1}{1}+\\frac{x_2}{2}+\\frac{x_3}{3}=1$. Mit 6 multipliziert: $6x_1+3x_2+2x_3=6$.",p:"Die Punktprobe ist der schnellste Weg."},
{id:"g11",a:"geo",t:"num",tg:"Abstand Ebenen",op:"Berechnen",te:"A",lv:2,q:"Berechnen Sie den Abstand der parallelen Ebenen $E_1:\\ x_1+2x_2+2x_3=3$ und $E_2:\\ x_1+2x_2+2x_3=12$.",v:3,tol:0.0001,h:"Nimm einen Punkt von $E_1$ und berechne seinen Abstand zu $E_2$. Oder: Differenz der rechten Seiten durch $|\\vec n|$.",e:"$|\\vec n|=3$. $d=\\dfrac{|12-3|}{3}=3$.",p:""},
{id:"g12",a:"geo",t:"mc",tg:"Lagebeziehungen",op:"Untersuchen",te:"A",lv:2,q:"Gegeben sind $g:\\ \\vec x=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}$ und $h:\\ \\vec x=\\begin{pmatrix}0\\\\1\\\\2\\end{pmatrix}+s\\cdot\\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}$. Wie liegen $g$ und $h$?",o:["identisch","echt parallel","windschief","sie schneiden sich in einem Punkt"],c:1,h:"Vergleiche zuerst die Richtungsvektoren.",e:"$\\begin{pmatrix}2\\\\2\\\\2\\end{pmatrix}=2\\cdot\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}$: Die Richtungen sind parallel. Der Aufpunkt $(1\\,|\\,0\\,|\\,0)$ liegt nicht auf $h$ (aus $2s=1$ folgt $x_2=2\\neq0$). Also echt parallel.",p:"Bei parallelen Richtungen noch prüfen, ob die Geraden identisch sind."},
{id:"g13",a:"geo",t:"mc",tg:"Lagebeziehungen",op:"Untersuchen",te:"A",lv:2,q:"Gegeben sind $g:\\ \\vec x=r\\cdot\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ und $h:\\ \\vec x=\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}+s\\cdot\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. Wie liegen $g$ und $h$?",o:["windschief","echt parallel","identisch","sie schneiden sich"],c:0,h:"Sind die Richtungen parallel? Gibt es einen gemeinsamen Punkt?",e:"Die Richtungen $\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ und $\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$ sind nicht parallel. Gleichsetzen: $\\begin{pmatrix}r\\\\0\\\\0\\end{pmatrix}=\\begin{pmatrix}0\\\\1\\\\s\\end{pmatrix}$ liefert $0=1$, also keinen Schnittpunkt. Die Geraden sind windschief.",p:""},
{id:"g14",a:"geo",t:"num",tg:"Flächeninhalt",op:"Berechnen",te:"A",lv:3,q:"Berechnen Sie den Flächeninhalt des Dreiecks mit $A(1\\,|\\,0\\,|\\,0)$, $B(0\\,|\\,2\\,|\\,0)$, $C(0\\,|\\,0\\,|\\,2)$ (drei Nachkommastellen).",v:2.449,tol:0.002,u:"FE",h:"Winkel bei $A$ mit dem Skalarprodukt, dann $A_\\Delta=\\frac{1}{2}\\cdot|\\overrightarrow{AB}|\\cdot|\\overrightarrow{AC}|\\cdot\\sin\\varphi$.",e:"$\\overrightarrow{AB}=\\begin{pmatrix}-1\\\\2\\\\0\\end{pmatrix}$, $\\overrightarrow{AC}=\\begin{pmatrix}-1\\\\0\\\\2\\end{pmatrix}$. $\\overrightarrow{AB}\\cdot\\overrightarrow{AC}=1$, $|\\overrightarrow{AB}|=|\\overrightarrow{AC}|=\\sqrt{5}$. $\\cos\\varphi=\\frac{1}{5}$, $\\sin\\varphi=\\frac{\\sqrt{24}}{5}$. $A_\\Delta=\\frac{1}{2}\\cdot5\\cdot\\frac{\\sqrt{24}}{5}=\\sqrt{6}\\approx2{,}449$.",p:"Faktor $\\frac{1}{2}$ beim Dreieck nicht vergessen. $\\sin\\varphi=\\sqrt{1-\\cos^{2}\\varphi}$."},
{id:"g15",a:"geo",t:"err",tg:"Abstand Punkt–Ebene",op:"Beurteilen",te:"A",lv:2,q:"Berechnet werden soll der Abstand von $P(1\\,|\\,1\\,|\\,1)$ zur Ebene $E:\\ 2x_1+x_2+2x_3=4$. Wo steckt der Fehler?",s:["$d=\\dfrac{|2\\cdot1+1\\cdot1+2\\cdot1-4|}{|\\vec n|}$","Zähler: $|5-4|=1$","Nenner: $|\\vec n|=\\sqrt{2^{2}+1^{2}+2}=\\sqrt{7}$","Ergebnis: $d=\\frac{1}{\\sqrt{7}}\\approx0{,}38$"],b:2,et:"rechen",h:"Prüfe jeden Summanden unter der Wurzel.",fx:"$|\\vec n|=\\sqrt{4+1+4}=3$, also $d=\\frac{1}{3}$.",e:"Die letzte Komponente 2 muss quadriert werden: $2^{2}=4$. Rechenfehler beim Betrag des Normalenvektors.",p:""},
{id:"g16",a:"geo",t:"err",tg:"Ebenen",op:"Beurteilen",te:"A",lv:2,q:"Gegeben ist $E:\\ \\vec x=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+s\\cdot\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}$. Ein Schüler bestimmt die Koordinatenform. Wo steckt der Fehler?",s:["Richtungsvektoren $\\vec u=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}$ und $\\vec v=\\begin{pmatrix}0\\\\1\\\\0\\end{pmatrix}$","Normalenvektor: $\\vec n=\\vec u+\\vec v=\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}$","Ansatz: $x_1+x_2=c$","Aufpunkt $(0\\,|\\,0\\,|\\,1)$ einsetzen: $c=0$"],b:1,et:"versteh",h:"Ein Normalenvektor muss zu beiden Richtungsvektoren senkrecht sein. Stimmt das für $\\vec u+\\vec v$?",fx:"Gesucht ist $\\vec n$ mit $\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$. Das liefert $\\vec n=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. Mit dem Aufpunkt: $E:\\ x_3=1$.",e:"Die Summe zweier Vektoren ist nicht senkrecht zu beiden. Einen Normalenvektor bestimmt man mit einem LGS ($\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$).",p:""},
{id:"g17",a:"geo",t:"reason",tg:"Lagebeziehungen",op:"Begründen",te:"A",lv:3,q:"Begründen Sie, dass $g:\\ \\vec x=\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+r\\cdot\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}$ echt parallel zu $E:\\ x_1+2x_2=7$ verläuft.",mod:"Normalenvektor von $E$: $\\vec n=\\begin{pmatrix}1\\\\2\\\\0\\end{pmatrix}$. Richtungsvektor von $g$: $\\vec u=\\begin{pmatrix}2\\\\-1\\\\0\\end{pmatrix}$. $\\vec u\\cdot\\vec n=2-2+0=0$, also verläuft $g$ parallel zu $E$ oder liegt in $E$. Aufpunkt einsetzen: $1+2\\cdot2=5\\neq7$. Der Aufpunkt liegt nicht in $E$, also liegt $g$ nicht in $E$. Damit ist $g$ echt parallel zu $E$.",cr:[["$\\vec u\\cdot\\vec n=0$ berechnet",1],["Folgerung: parallel oder in $E$",1],["Aufpunkt in $E$ eingesetzt ($5\\neq7$)",1],["Schluss: echt parallel",1]],h:"Zwei Schritte: Richtung prüfen und danach einen Punkt prüfen.",p:"Viele zeigen nur $\\vec u\\cdot\\vec n=0$ und vergessen den Aufpunkt."},
{id:"g18",a:"geo",t:"match",tg:"Methoden",op:"Zuordnen",te:"A",lv:1,q:"Ordnen Sie jeder Aufgabe den passenden Rechenweg zu.",L:["Abstand Punkt–Ebene","Winkel zwischen zwei Vektoren","Schnittpunkt Gerade–Ebene","Orthogonalität prüfen"],R:["Skalarprodukt gleich 0 prüfen","Geradengleichung in die Ebenengleichung einsetzen und $r$ bestimmen","Formel mit Betrag des Normalenvektors (Hesse)","$\\cos\\varphi=\\dfrac{\\vec a\\cdot\\vec b}{|\\vec a|\\cdot|\\vec b|}$"],m:[2,3,1,0],h:"Welche Formel gehört zu welcher Größe?",e:"Abstand: Hesse’sche Formel. Winkel: $\\cos\\varphi$ mit Skalarprodukt. Schnittpunkt: einsetzen. Orthogonal: Skalarprodukt 0.",p:""},
{id:"g19",a:"geo",t:"num",tg:"LGS",op:"Bestimmen",te:"A",lv:2,q:"Lösen Sie das LGS: I $x+y+z=6$, II $2x-y+z=3$, III $x+2y-z=2$. Geben Sie $z$ an.",v:3,tol:0.0001,h:"Löse I nach $z$ auf und setze in II und III ein.",e:"$z=6-x-y$. In II: $x-2y=-3$. In III: $2x+3y=8$. Daraus $y=2$, $x=1$, $z=3$. Probe in II und III stimmt.",p:"Die Probe in allen Gleichungen bringt Sicherheit.",gg:"CAS: `Löse({x+y+z=6, 2x-y+z=3, x+2y-z=2}, {x,y,z})`. Alternativ als Matrix: `m1:={{1,1,1,6},{2,-1,1,3},{1,2,-1,2}}`, dann `Treppennormalform(m1)`. In der letzten Spalte stehen die Lösungen."},
{id:"g20",a:"geo",t:"num",tg:"Schnittwinkel",op:"Berechnen",te:"B",lv:2,q:"Berechnen Sie den Schnittwinkel der Ebenen $E_1:\\ 2x_1+x_2-2x_3=5$ und $E_2:\\ x_3=0$ in Grad (zwei Nachkommastellen).",v:48.19,tol:0.05,u:"°",h:"$\\cos\\varphi=\\dfrac{|\\vec n_1\\cdot\\vec n_2|}{|\\vec n_1|\\cdot|\\vec n_2|}$.",e:"$\\vec n_1=\\begin{pmatrix}2\\\\1\\\\-2\\end{pmatrix}$, $|\\vec n_1|=3$. $\\vec n_2=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. $\\cos\\varphi=\\frac{2}{3}$, also $\\varphi\\approx48{,}19^\\circ$.",p:"Betrag im Zähler: Der Schnittwinkel liegt zwischen $0^\\circ$ und $90^\\circ$.",gg:"Die Formel selbst aufschreiben, dann rechnen: `arccos(Betrag(Skalarprodukt(n1,n2)) / (Länge(n1) Länge(n2)))`. Ergebnis im CAS in Bogenmaß: mit `*180/π` umrechnen. Der Befehl `Winkel` liefert nicht automatisch den spitzen Winkel."},
{id:"g21",a:"geo",t:"num",tg:"Abstand Punkt–Gerade",op:"Berechnen",te:"B",lv:3,q:"Berechnen Sie den Abstand von $P(2\\,|\\,0\\,|\\,0)$ zur Geraden $g:\\ \\vec x=r\\cdot\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}$ (drei Nachkommastellen).",v:1.414,tol:0.002,h:"Lotfußpunkt $F=r\\cdot\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}$ mit $\\overrightarrow{PF}\\cdot\\vec u=0$.",e:"$\\overrightarrow{PF}\\cdot\\vec u=0$ ergibt $(r-2)+r=0$, also $r=1$ und $F(1\\,|\\,1\\,|\\,0)$. $|\\overrightarrow{PF}|=\\sqrt{1+1}=\\sqrt{2}\\approx1{,}414$.",p:"",gg:"Orthogonalität per CAS: `Löse(Skalarprodukt((r,r,0)-(2,0,0),(1,1,0))=0, r)`, dann `Länge((r,r,0)-(2,0,0))` mit dem Wert für $r$. Alternativ den kleinsten Abstand mit `Min(Länge(...), 0, 3)` suchen."},
{id:"g22",a:"geo",t:"num",tg:"Skalarprodukt",op:"Bestimmen",te:"A",lv:1,q:"Bestimmen Sie $k$ so, dass $\\vec a=\\begin{pmatrix}k\\\\2\\\\1\\end{pmatrix}$ und $\\vec b=\\begin{pmatrix}2\\\\1\\\\-4\\end{pmatrix}$ orthogonal sind.",v:1,tol:0.0001,h:"$\\vec a\\cdot\\vec b=0$ setzen.",e:"$2k+2-4=0$ ergibt $k=1$.",p:""},
{id:"g23",a:"geo",t:"mc",tg:"Lotfußpunkt",op:"Beschreiben",te:"A",lv:2,q:"Wie bestimmt man den Lotfußpunkt eines Punktes $P$ auf eine Ebene $E$?",o:["Lotgerade durch $P$ mit Richtung $\\vec n$ aufstellen und mit $E$ schneiden","Gerade durch $P$ mit beliebigem Richtungsvektor in $E$ schneiden","$P$ in die Ebenengleichung einsetzen","Den Normalenvektor mit dem Ortsvektor von $P$ multiplizieren"],c:0,h:"Das Lot steht senkrecht auf $E$. Welche Richtung hat es?",e:"Die Lotgerade hat die Richtung des Normalenvektors. Ihr Schnittpunkt mit $E$ ist der Lotfußpunkt.",p:""},
{id:"g24",a:"geo",t:"num",tg:"Vektoren",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie die Länge des Vektors $\\vec v=\\begin{pmatrix}2\\\\-3\\\\6\\end{pmatrix}$.",v:7,tol:0.0001,h:"Betrag: Wurzel aus der Summe der Quadrate.",e:"$|\\vec v|=\\sqrt{4+9+36}=\\sqrt{49}=7$.",p:"",gg:"`v=(2,-3,6)` (Kleinbuchstabe: Spaltenvektor), dann `Länge(v)`."},
/* --- neu: Geometrie mit Grafik --- */
{id:"g25",a:"geo",t:"num",tg:"Vektoren",op:"Berechnen",te:"A",lv:2,q:"Die Skizze zeigt einen Quader mit $O(0\\,|\\,0\\,|\\,0)$, $A(4\\,|\\,0\\,|\\,0)$, $C(0\\,|\\,3\\,|\\,0)$ und $D(0\\,|\\,0\\,|\\,2)$. Berechnen Sie die Länge der Raumdiagonalen $\\overline{OF}$ (drei Nachkommastellen).",v:5.385,tol:0.002,u:"LE",h:"Bestimme zuerst die Koordinaten von $F$. Dann den Vektor $\\overrightarrow{OF}$ und seinen Betrag.",e:"$F(4\\,|\\,3\\,|\\,2)$. $\\overrightarrow{OF}=\\begin{pmatrix}4\\\\3\\\\2\\end{pmatrix}$. $|\\overrightarrow{OF}|=\\sqrt{16+9+4}=\\sqrt{29}\\approx5{,}385$.",p:"Erst die Koordinaten aller benötigten Punkte aus der Skizze lesen und notieren.",g:{k:"solid",V:{O:[0,0,0],A:[4,0,0],B:[4,3,0],C:[0,3,0],D:[0,0,2],E:[4,0,2],F:[4,3,2],G:[0,3,2]},E:[["O","A",1],["O","C",1],["O","D",1],["A","B"],["B","C"],["D","E"],["E","F"],["F","G"],["G","D"],["A","E"],["B","F"],["C","G"],["O","F",1,1]],lab:{O:"dr",A:"dl",B:"dr",C:"dr",D:"ul",E:"ul",F:"ur",G:"ur"},cap:"Quader im Koordinatensystem, die Diagonale $\\overline{OF}$ ist rot"}},
{id:"g26",a:"geo",t:"num",tg:"Winkel an Körpern",op:"Berechnen",te:"A",lv:3,q:"Die Grundfläche der Pyramide ist das Quadrat $ABCD$ mit $A(0\\,|\\,0\\,|\\,0)$, $B(4\\,|\\,0\\,|\\,0)$, $C(4\\,|\\,4\\,|\\,0)$, $D(0\\,|\\,4\\,|\\,0)$. Die Spitze ist $S(2\\,|\\,2\\,|\\,3)$. Berechnen Sie den Winkel zwischen der Kante $AS$ und der Grundfläche in Grad (zwei Nachkommastellen).",v:46.69,tol:0.05,u:"°",h:"Gerade–Ebene: Richtungsvektor $\\overrightarrow{AS}$ und Normalenvektor der Grundfläche $\\vec n=\\begin{pmatrix}0\\\\0\\\\1\\end{pmatrix}$. Dann $\\sin\\alpha=\\dfrac{|\\vec u\\cdot\\vec n|}{|\\vec u|\\cdot|\\vec n|}$.",e:"$\\overrightarrow{AS}=\\begin{pmatrix}2\\\\2\\\\3\\end{pmatrix}$, $|\\overrightarrow{AS}|=\\sqrt{17}$. $\\sin\\alpha=\\dfrac{3}{\\sqrt{17}}\\approx0{,}7276$, also $\\alpha\\approx46{,}69^\\circ$.",p:"Gerade–Ebene: $\\sin\\alpha$ verwenden, nicht $\\cos\\alpha$.",g:{k:"solid",V:{A:[0,0,0],B:[4,0,0],C:[4,4,0],D:[0,4,0],S:[2,2,3]},E:[["A","B",1],["A","D",1],["B","C"],["C","D"],["A","S",1,1],["B","S"],["C","S"],["D","S"]],lab:{A:"ul",B:"dl",C:"dr",D:"dr",S:"ur"},cap:"Pyramide mit quadratischer Grundfläche, die Kante $AS$ ist rot"}},
{id:"g27",a:"geo",t:"num",tg:"Spiegelung",op:"Bestimmen",te:"A",lv:3,q:"Der Punkt $P(1\\,|\\,2\\,|\\,3)$ wird an der Ebene $E:\\ x_1+x_2+x_3=3$ gespiegelt. Bestimmen Sie die $x_3$-Koordinate des Spiegelpunkts $P'$.",v:1,tol:0.0001,h:"Lotgerade durch $P$ mit $\\vec n$ als Richtung. Lotfußpunkt $F$ bestimmen. Dann $\\overrightarrow{OP'}=\\overrightarrow{OP}+2\\cdot\\overrightarrow{PF}$.",e:"Lotgerade: $\\vec x=\\begin{pmatrix}1\\\\2\\\\3\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}$. In $E$: $6+3r=3$, also $r=-1$. $F(0\\,|\\,1\\,|\\,2)$. $P'=P+2\\cdot\\overrightarrow{PF}=(-1\\,|\\,0\\,|\\,1)$. Also $x_3=1$.",p:"Der Spiegelpunkt liegt doppelt so weit vom Start entfernt wie der Lotfußpunkt, nicht auf dem Lotfußpunkt.",gg:"`Löse(1+r + 2+r + 3+r = 3, r)` und dann `(1,2,3)+2*(-1)*(1,1,1)`."},
{id:"g28",a:"geo",t:"mc",tg:"Ebenen",op:"Bestimmen",te:"A",lv:3,q:"Gegeben ist $E:\\ \\vec x=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+r\\cdot\\begin{pmatrix}0\\\\1\\\\1\\end{pmatrix}+s\\cdot\\begin{pmatrix}1\\\\0\\\\2\\end{pmatrix}$. Welche Koordinatengleichung gehört zu $E$?",o:["$2x_1+x_2-x_3=2$","$2x_1-x_2+x_3=2$","$x_1+x_2+2x_3=1$","$-2x_1-x_2+x_3=2$"],c:0,h:"Normalenvektor aus $\\vec n\\cdot\\vec u=0$ und $\\vec n\\cdot\\vec v=0$. Danach den Aufpunkt einsetzen.",e:"$n_2+n_3=0$ und $n_1+2n_3=0$. Mit $n_3=-1$: $n_2=1$, $n_1=2$, also $\\vec n=\\begin{pmatrix}2\\\\1\\\\-1\\end{pmatrix}$. Aufpunkt $(1\\,|\\,0\\,|\\,0)$: $2\\cdot1=2$. Also $E:\\ 2x_1+x_2-x_3=2$.",p:"Probe mit allen drei Punkten ($A$ und $A+\\vec u$, $A+\\vec v$) macht Vorzeichenfehler sichtbar.",gg:"`Löse({n2+n3=0, n1+2 n3=0}, {n1,n2})` mit `n3=-1` oder frei lassen. Prüfen kann man mit `Ersetze(...)`."},
{id:"g29",a:"geo",t:"num",tg:"Winkel",op:"Berechnen",te:"A",lv:2,q:"Gegeben ist das Dreieck $ABC$ mit $A(0\\,|\\,0\\,|\\,0)$, $B(2\\,|\\,1\\,|\\,2)$ und $C(1\\,|\\,2\\,|\\,2)$. Berechnen Sie den Winkel bei $A$ in Grad (zwei Nachkommastellen).",v:27.27,tol:0.05,u:"°",h:"Winkel zwischen $\\overrightarrow{AB}$ und $\\overrightarrow{AC}$.",e:"$\\overrightarrow{AB}\\cdot\\overrightarrow{AC}=2+2+4=8$. $|\\overrightarrow{AB}|=|\\overrightarrow{AC}|=3$. $\\cos\\varphi=\\frac{8}{9}$, also $\\varphi\\approx27{,}27^\\circ$.",p:"Beide Vektoren vom **gleichen** Eckpunkt $A$ aus bilden.",g:{k:"solid",V:{A:[0,0,0],B:[2,1,2],C:[1,2,2]},E:[["A","B"],["A","C"],["B","C"]],ax:[3,3,3],lab:{A:"dr",B:"ur",C:"ur"},cap:"Dreieck $ABC$ im Koordinatensystem"}},
{id:"g30",a:"geo",t:"num",tg:"Durchstoßpunkt",op:"Bestimmen",te:"A",lv:2,q:"Die Gerade $g$ durch $A(2\\,|\\,1\\,|\\,3)$ und $B(4\\,|\\,2\\,|\\,1)$ durchstößt die $x_1x_2$-Ebene im Spurpunkt $S$. Bestimmen Sie die $x_1$-Koordinate von $S$.",v:5,tol:0.0001,h:"Richtungsvektor $\\overrightarrow{AB}$. Die $x_1x_2$-Ebene hat die Gleichung $x_3=0$.",e:"$\\overrightarrow{AB}=\\begin{pmatrix}2\\\\1\\\\-2\\end{pmatrix}$. $g:\\ \\vec x=\\begin{pmatrix}2\\\\1\\\\3\\end{pmatrix}+r\\cdot\\begin{pmatrix}2\\\\1\\\\-2\\end{pmatrix}$. $x_3=3-2r=0$ ergibt $r=1{,}5$. $S(5\\,|\\,2{,}5\\,|\\,0)$.",p:"Nur die Zeile für $x_3$ lösen. Danach $r$ in die anderen Zeilen einsetzen.",gg:"`Gerade((2,1,3),(4,2,1))` oder `Schnittpunkt(Gerade, Ebene)` mit der Ebene `x3=0`. Im CAS: `Löse(3-2r=0, r)`."},
{id:"g31",a:"geo",t:"num",tg:"Lagebeziehungen",op:"Bestimmen",te:"A",lv:3,q:"Gegeben sind $g:\\ \\vec x=\\begin{pmatrix}1\\\\0\\\\0\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\a\\\\1\\end{pmatrix}$ und $E:\\ x_1+x_2+x_3=5$. Bestimmen Sie $a$ so, dass $g$ parallel zu $E$ verläuft.",v:-2,tol:0.0001,h:"Parallel: $\\vec u\\cdot\\vec n=0$.",e:"$\\vec n=\\begin{pmatrix}1\\\\1\\\\1\\end{pmatrix}$. $\\vec u\\cdot\\vec n=1+a+1=0$ ergibt $a=-2$. Der Aufpunkt $(1\\,|\\,0\\,|\\,0)$ erfüllt $1\\neq5$, also ist $g$ echt parallel.",p:"Danach noch den Aufpunkt prüfen: echt parallel oder in $E$?"},
{id:"g32",a:"geo",t:"reason",tg:"Dreiecke",op:"Zeigen",te:"A",lv:2,q:"Zeigen Sie, dass das Dreieck mit $A(1\\,|\\,0\\,|\\,0)$, $B(0\\,|\\,1\\,|\\,0)$ und $C(0\\,|\\,0\\,|\\,1)$ gleichseitig ist.",mod:"$\\overrightarrow{AB}=\\begin{pmatrix}-1\\\\1\\\\0\\end{pmatrix}$, $\\overrightarrow{AC}=\\begin{pmatrix}-1\\\\0\\\\1\\end{pmatrix}$, $\\overrightarrow{BC}=\\begin{pmatrix}0\\\\-1\\\\1\\end{pmatrix}$.\n$|\\overrightarrow{AB}|=\\sqrt{2}$, $|\\overrightarrow{AC}|=\\sqrt{2}$, $|\\overrightarrow{BC}|=\\sqrt{2}$.\nAlle drei Seiten sind gleich lang, das Dreieck ist gleichseitig.",cr:[["Die drei Seitenvektoren richtig aufgestellt",1],["Alle drei Längen berechnet ($\\sqrt{2}$)",1],["Schluss: gleiche Längen, also gleichseitig",1]],h:"Alle drei Seitenlängen bestimmen, nicht nur zwei.",p:"„Zeigen“ verlangt, dass alle drei Längen berechnet und verglichen werden.",g:{k:"solid",V:{A:[1,0,0],B:[0,1,0],C:[0,0,1]},E:[["A","B"],["A","C"],["B","C"]],ax:[1.6,1.6,1.6],lab:{A:"dl",B:"dr",C:"ur"},cap:"Das Dreieck $ABC$ liegt in der Ebene $x_1+x_2+x_3=1$"}},
{id:"g33",a:"geo",t:"num",tg:"Geraden",op:"Bestimmen",te:"A",lv:2,q:"Auf der Geraden $g:\\ \\vec x=r\\cdot\\begin{pmatrix}1\\\\2\\\\2\\end{pmatrix}$ liegt ein Punkt $P$ mit $r>0$, der vom Ursprung den Abstand 6 hat. Bestimmen Sie die $x_1$-Koordinate von $P$.",v:2,tol:0.0001,h:"$|\\overrightarrow{OP}|=r\\cdot|\\vec u|$.",e:"$|\\vec u|=\\sqrt{1+4+4}=3$. $r\\cdot3=6$ ergibt $r=2$. $P(2\\,|\\,4\\,|\\,4)$, also $x_1=2$.",p:""},
{id:"g34",a:"geo",t:"num",tg:"Lagebeziehungen",op:"Bestimmen",te:"A",lv:3,q:"Die Geraden $g:\\ \\vec x=\\begin{pmatrix}1\\\\1\\\\0\\end{pmatrix}+r\\cdot\\begin{pmatrix}1\\\\0\\\\1\\end{pmatrix}$ und $h:\\ \\vec x=\\begin{pmatrix}0\\\\3\\\\2\\end{pmatrix}+s\\cdot\\begin{pmatrix}3\\\\-2\\\\0\\end{pmatrix}$ schneiden sich. Bestimmen Sie die $x_3$-Koordinate des Schnittpunkts.",v:2,tol:0.0001,h:"Gleichsetzen ergibt drei Gleichungen mit zwei Unbekannten $r$ und $s$.",e:"I: $1+r=3s$, II: $1=3-2s$, III: $r=2$. Aus II: $s=1$. Aus III: $r=2$. Probe in I: $3=3$. Schnittpunkt $S(3\\,|\\,1\\,|\\,2)$, also $x_3=2$.",p:"Probe mit der dritten Gleichung zeigt, dass es wirklich einen Schnittpunkt gibt.",gg:"`Schnittpunkt(g, h)` mit `g=Gerade((1,1,0),(1,0,1))` und `h=Gerade((0,3,2),(3,-2,0))`. Im CAS: `Löse({1+r=3s, 1=3-2s, r=2}, {r,s})`. Ergibt `{}`, schneiden sie sich nicht."},
{id:"g35",a:"geo",t:"num",tg:"Ebene aus drei Punkten",op:"Berechnen",te:"B",lv:3,q:"Die Ebene $E$ enthält $A(1\\,|\\,0\\,|\\,0)$, $B(0\\,|\\,1\\,|\\,0)$ und $C(0\\,|\\,0\\,|\\,2)$. Berechnen Sie den Abstand des Ursprungs von $E$ (vier Nachkommastellen).",v:0.6667,tol:0.001,u:"LE",h:"Erst $E$ als Koordinatengleichung bestimmen (Achsenabschnitte oder LGS), dann den Abstand mit $|\\vec n|$.",e:"Achsenabschnitte 1, 1, 2: $x_1+x_2+\\frac{x_3}{2}=1$, also $E:\\ 2x_1+2x_2+x_3=2$. $|\\vec n|=3$. $d=\\dfrac{|0-2|}{3}=\\dfrac{2}{3}\\approx0{,}6667$.",p:"Probe mit allen drei Punkten. Das Vorzeichen im Zähler egal, der Betrag zählt.",gg:"Ansatz `E: a x + b y + c z = 1`. `Löse({a=1, b=1, 2c=1}, {a,b,c})` liefert die Koeffizienten. Der Befehl `Ebene(A,B,C)` zeigt zur Kontrolle die Gleichung, ist im Prüfungsmodus aber möglicherweise gesperrt."},

/* ---------- Stochastik ---------- */
{id:"s01",a:"sto",t:"mc",tg:"Binomialverteilung",op:"Bestimmen",te:"A",lv:1,q:"$X$ ist binomialverteilt mit $n=50$ und $p=0{,}2$. Bestimmen Sie den Erwartungswert.",o:["$10$","$5$","$40$","$7{,}5$"],c:0,h:"$\\mu=n\\cdot p$.",e:"$\\mu=50\\cdot0{,}2=10$.",p:""},
{id:"s02",a:"sto",t:"mc",tg:"Binomialverteilung",op:"Angeben",te:"A",lv:2,q:"$X$ ist binomialverteilt mit $n=5$ und $p=0{,}1$. Welcher Term gibt $P(X\\geq1)$ an?",o:["$1-0{,}9^{5}$","$0{,}1^{5}$","$5\\cdot0{,}1$","$1-0{,}1^{5}$"],c:0,h:"Gegenereignis von „mindestens ein Treffer“.",e:"$P(X\\geq1)=1-P(X=0)=1-0{,}9^{5}$.",p:""},
{id:"s03",a:"sto",t:"mc",tg:"Bedingte Wahrscheinlichkeit",op:"Bestimmen",te:"A",lv:1,q:"Es gilt $P(A)=0{,}4$ und $P(A\\cap B)=0{,}1$. Bestimmen Sie $P_A(B)$.",o:["$0{,}25$","$0{,}04$","$0{,}5$","$0{,}1$"],c:0,h:"$P_A(B)=\\dfrac{P(A\\cap B)}{P(A)}$.",e:"$\\dfrac{0{,}1}{0{,}4}=0{,}25$.",p:"Durch das richtige Ereignis teilen: Die Bedingung steht unten."},
{id:"s04",a:"sto",t:"mc",tg:"Normalverteilung",op:"Angeben",te:"A",lv:1,q:"$X$ ist normalverteilt mit $\\mu=100$ und $\\sigma=10$. Welcher Wert passt etwa zu $P(90\\leq X\\leq110)$?",o:["$68\\,\\%$","$95\\,\\%$","$50\\,\\%$","$34\\,\\%$"],c:0,h:"Das Intervall ist $\\mu\\pm\\sigma$.",e:"Nach der $\\sigma$-Regel liegen etwa $68\\,\\%$ der Werte im Intervall $\\mu\\pm\\sigma$.",p:""},
{id:"s05",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"A",lv:1,q:"$X$ ist binomialverteilt mit $n=100$ und $p=0{,}5$. Berechnen Sie die Standardabweichung $\\sigma$.",v:5,tol:0.0001,h:"$\\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}$.",e:"$\\sigma=\\sqrt{100\\cdot0{,}5\\cdot0{,}5}=\\sqrt{25}=5$.",p:""},
{id:"s06",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist binomialverteilt mit $n=5$ und $p=0{,}4$. Berechnen Sie $P(X=2)$ (vier Nachkommastellen).",v:0.3456,tol:0.0002,h:"$P(X=k)=\\dbinom{n}{k}\\cdot p^{k}\\cdot(1-p)^{n-k}$.",e:"$P(X=2)=\\dbinom{5}{2}\\cdot0{,}4^{2}\\cdot0{,}6^{3}=10\\cdot0{,}16\\cdot0{,}216=0{,}3456$.",p:"Binomialkoeffizient $\\binom{5}{2}=10$ nicht vergessen.",gg:"`Binomial(5, 0.4, 2, false)` liefert $P(X=2)$. Zur Kontrolle: `nCr(5,2) * 0.4^2 * 0.6^3`."},
{id:"s07",a:"sto",t:"num",tg:"Binomialverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist binomialverteilt mit $n=10$ und $p=0{,}1$. Berechnen Sie $P(X\\leq1)$ (vier Nachkommastellen).",v:0.7361,tol:0.0002,h:"$P(X=0)+P(X=1)$, oder die kumulierte Verteilung im Hilfsmittel.",e:"$0{,}9^{10}+10\\cdot0{,}1\\cdot0{,}9^{9}\\approx0{,}3487+0{,}3874=0{,}7361$.",p:"",gg:"`Binomial(10, 0.1, 1, true)` liefert die kumulierte Wahrscheinlichkeit $P(X\\leq1)$."},
{id:"s08",a:"sto",t:"num",tg:"Mehrstufige Zufallsexperimente",op:"Berechnen",te:"A",lv:1,q:"Es gilt $P(A)=0{,}3$, $P(B)=0{,}5$ und $P(A\\cap B)=0{,}2$. Berechnen Sie $P(A\\cup B)$.",v:0.6,tol:0.0001,h:"Additionssatz: $P(A\\cup B)=P(A)+P(B)-P(A\\cap B)$.",e:"$0{,}3+0{,}5-0{,}2=0{,}6$.",p:""},
{id:"s09",a:"sto",t:"num",tg:"Pfadregeln",op:"Berechnen",te:"A",lv:1,q:"Eine Urne enthält 3 rote und 2 blaue Kugeln. Es wird zweimal ohne Zurücklegen gezogen. Berechnen Sie die Wahrscheinlichkeit für zwei rote Kugeln.",v:0.3,tol:0.0001,h:"Zweiter Zug: Es sind nur noch 4 Kugeln in der Urne.",e:"$P=\\dfrac{3}{5}\\cdot\\dfrac{2}{4}=\\dfrac{6}{20}=0{,}3$.",p:"Beim Ziehen ohne Zurücklegen ändern sich Nenner und Zähler."},
{id:"s10",a:"sto",t:"num",tg:"Bedingte Wahrscheinlichkeit",op:"Berechnen",te:"A",lv:2,q:"$2\\,\\%$ einer Gruppe sind krank. Der Test ist bei Kranken zu $90\\,\\%$ positiv und bei Gesunden zu $5\\,\\%$ positiv. Berechnen Sie die Wahrscheinlichkeit, dass ein zufällig ausgewählter Mensch positiv getestet wird.",v:0.067,tol:0.0005,h:"Zeichne ein Baumdiagramm. Addiere die Pfade zu „positiv“.",e:"$P(\\text{positiv})=0{,}02\\cdot0{,}9+0{,}98\\cdot0{,}05=0{,}018+0{,}049=0{,}067$.",p:"Beide Pfade berücksichtigen (krank und gesund).",g:{k:"tree",L1:[["K",0.02],["Ḡ",0.98]],L2:[[["+",0.9],["−",0.1]],[["+",0.05],["−",0.95]]],cap:"K = krank, Ḡ = gesund, + = positiv getestet"}},
{id:"s11",a:"sto",t:"num",tg:"Bedingte Wahrscheinlichkeit",op:"Berechnen",te:"B",lv:3,q:"Gleiche Situation wie zuvor ($2\\,\\%$ krank, $90\\,\\%$ positiv bei Kranken, $5\\,\\%$ positiv bei Gesunden). Eine Person ist positiv getestet. Berechnen Sie die Wahrscheinlichkeit, dass sie krank ist (drei Nachkommastellen).",v:0.269,tol:0.002,h:"$P_{+}(K)=\\dfrac{P(K\\cap +)}{P(+)}$.",e:"$\\dfrac{0{,}018}{0{,}067}\\approx0{,}269$. Nur etwa $27\\,\\%$ der positiv Getesteten sind krank, weil Gesunde viel häufiger sind.",p:"Die Bedingung steht hinter dem senkrechten Strich. Nicht mit $P_K(+)=0{,}9$ verwechseln."},
{id:"s12",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:1,q:"Eine Zufallsgröße $X$ nimmt die Werte 0, 1, 2 mit den Wahrscheinlichkeiten $0{,}5$; $0{,}3$; $0{,}2$ an. Berechnen Sie den Erwartungswert.",v:0.7,tol:0.0001,h:"$E(X)=\\sum x_i\\cdot P(x_i)$.",e:"$E(X)=0\\cdot0{,}5+1\\cdot0{,}3+2\\cdot0{,}2=0{,}7$.",p:"",g:{k:"bars",v:[[0,0.5],[1,0.3],[2,0.2]],cap:"Wahrscheinlichkeitsverteilung von $X$"}},
{id:"s13",a:"sto",t:"num",tg:"Kenngrößen",op:"Berechnen",te:"A",lv:2,q:"Gleiche Verteilung (Werte 0, 1, 2 mit $0{,}5$; $0{,}3$; $0{,}2$; $E(X)=0{,}7$). Berechnen Sie die Varianz $\\mathrm{Var}(X)$.",v:0.61,tol:0.0001,h:"$\\mathrm{Var}(X)=\\sum(x_i-\\mu)^{2}\\cdot P(x_i)$, oder $E(X^{2})-\\mu^{2}$.",e:"$E(X^{2})=0+0{,}3+0{,}8=1{,}1$. $\\mathrm{Var}(X)=1{,}1-0{,}49=0{,}61$.",p:""},
{id:"s14",a:"sto",t:"mc",tg:"Kenngrößen",op:"Beurteilen",te:"A",lv:2,q:"Ein Glücksrad zahlt 5 € mit Wahrscheinlichkeit $0{,}2$, zahlt 1 € mit Wahrscheinlichkeit $0{,}5$ und zahlt sonst nichts. Der Einsatz beträgt 1,50 €. Beurteilen Sie: Ist das Spiel fair?",o:["Ja, der Erwartungswert des Gewinns ist 0 €","Nein, der Erwartungswert des Gewinns ist +0,50 €","Nein, der Erwartungswert des Gewinns ist −0,50 €","Nein, der Erwartungswert des Gewinns ist −1,50 €"],c:0,h:"Erwartete Auszahlung minus Einsatz.",e:"$E(\\text{Auszahlung})=5\\cdot0{,}2+1\\cdot0{,}5=1{,}5$. Minus Einsatz 1,5 ergibt 0. Das Spiel ist fair.",p:"Gewinn $=$ Auszahlung $-$ Einsatz. Nicht die Auszahlung allein betrachten."},
{id:"s15",a:"sto",t:"num",tg:"Normalverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist normalverteilt mit $\\mu=100$ und $\\sigma=10$. Berechnen Sie $P(X\\leq115)$ (vier Nachkommastellen).",v:0.9332,tol:0.0003,h:"Im Hilfsmittel die Normalverteilung mit $\\mu=100$, $\\sigma=10$ und $x=115$ verwenden.",e:"115 liegt $1{,}5\\sigma$ über $\\mu$. $\\Phi(1{,}5)\\approx0{,}9332$.",p:"Ansatz notieren: $P(X\\leq115)$ mit $\\mu=100$ und $\\sigma=10$.",gg:"`Normal(100, 10, 115, true)` liefert $P(X\\leq115)$. Mit `false` bekommst du dagegen den Wert der Dichtefunktion, nicht eine Wahrscheinlichkeit."},
{id:"s16",a:"sto",t:"num",tg:"Normalverteilung",op:"Berechnen",te:"B",lv:2,q:"$X$ ist normalverteilt mit $\\mu=100$ und $\\sigma=10$. Berechnen Sie $P(90\\leq X\\leq120)$ (vier Nachkommastellen).",v:0.8186,tol:0.0003,h:"$P(a\\leq X\\leq b)=F(b)-F(a)$.",e:"$\\Phi(2)-\\Phi(-1)\\approx0{,}9772-0{,}1587=0{,}8186$.",p:"",gg:"`Normal(100,10,120,true) - Normal(100,10,90,true)`.",g:{k:"norm",mu:100,s:10,shade:[90,120],ticks:[70,80,90,100,110,120,130],cap:"$X\\sim N(100;\\,10^{2})$, markiert ist $P(90\\leq X\\leq120)$"}},
{id:"s17",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"B",lv:3,q:"$X$ ist binomialverteilt mit $n=20$ und $p=0{,}3$. Bestimmen Sie die kleinste Zahl $k$ mit $P(X\\leq k)\\geq0{,}95$.",v:9,tol:0.0001,h:"Tabelle der kumulierten Verteilung erzeugen und die erste Stelle über $0{,}95$ suchen.",e:"$P(X\\leq8)\\approx0{,}887$ und $P(X\\leq9)\\approx0{,}952$. Die kleinste Zahl ist $k=9$.",p:"Beide Nachbarwerte nennen, damit man sieht, warum 9 gilt.",gg:"Direkt: `InversBinomial(20, 0.3, 0.95)` liefert die kleinste ganze Zahl $k$ mit $P(X\\leq k)\\geq0{,}95$. Zur Kontrolle `Binomial(20, 0.3, 8, true)` und `Binomial(20, 0.3, 9, true)`."},
{id:"s18",a:"sto",t:"mc",tg:"Histogramme",op:"Begründen",te:"A",lv:1,q:"Für welche Trefferwahrscheinlichkeit $p$ ist das Histogramm einer Binomialverteilung $B(n;p)$ symmetrisch?",o:["$p=0{,}5$","$p=0{,}1$","$p=0{,}25$","für jedes $p$"],c:0,h:"Symmetrie heißt: Treffer und Nichttreffer sind gleich wahrscheinlich.",e:"Bei $p=0{,}5$ gilt $P(X=k)=P(X=n-k)$. Bei anderen $p$ ist das Histogramm schief.",p:"",g:{k:"bars",n:12,p:0.5,cap:"Histogramm von $B(12;\\,0{,}5)$"}},
{id:"s19",a:"sto",t:"err",tg:"Binomialverteilung",op:"Beurteilen",te:"A",lv:2,q:"$X$ ist binomialverteilt mit $n=100$ und $p=0{,}5$. Ein Schüler bestimmt das Intervall $\\mu\\pm\\sigma$. Wo steckt der Fehler?",s:["$\\mu=n\\cdot p=50$","$\\sigma=\\sqrt{n\\cdot p}=\\sqrt{50}\\approx7{,}07$","Intervall: $[50-7{,}07;\\,50+7{,}07]=[42{,}93;\\,57{,}07]$"],b:1,et:"versteh",h:"Schau dir die Formel für $\\sigma$ genau an.",fx:"$\\sigma=\\sqrt{n\\cdot p\\cdot(1-p)}=\\sqrt{25}=5$. Das Intervall ist $[45;\\,55]$.",e:"In der Formel fehlt der Faktor $(1-p)$. Es handelt sich um einen Formelfehler, nicht um einen Rechenfehler.",p:""},
{id:"s20",a:"sto",t:"err",tg:"Pfadregeln",op:"Beurteilen",te:"A",lv:2,q:"Eine Urne enthält 4 rote und 6 blaue Kugeln. Es wird zweimal ohne Zurücklegen gezogen. Gesucht ist $P(\\text{erst rot, dann blau})$. Wo steckt der Fehler?",s:["$P(\\text{rot im 1. Zug})=\\frac{4}{10}$","$P(\\text{blau im 2. Zug}\\mid\\text{rot})=\\frac{6}{10}$","$P=\\frac{4}{10}\\cdot\\frac{6}{10}=0{,}24$"],b:1,et:"versteh",h:"Wie viele Kugeln sind nach dem ersten Zug noch in der Urne?",fx:"$P(\\text{blau}\\mid\\text{rot})=\\frac{6}{9}$. Also $P=\\frac{4}{10}\\cdot\\frac{6}{9}=\\frac{4}{15}\\approx0{,}267$.",e:"Nach dem ersten Zug sind nur noch 9 Kugeln übrig. Der zweite Faktor ist $\\frac{6}{9}$, nicht $\\frac{6}{10}$.",p:""},
{id:"s21",a:"sto",t:"reason",tg:"Binomialverteilung",op:"Begründen",te:"A",lv:3,q:"Begründen Sie, dass die Wahrscheinlichkeitsverteilung einer binomialverteilten Zufallsgröße mit $p=0{,}5$ symmetrisch ist.",mod:"Für $p=0{,}5$ gilt $P(X=k)=\\dbinom{n}{k}\\cdot0{,}5^{k}\\cdot0{,}5^{n-k}=\\dbinom{n}{k}\\cdot0{,}5^{n}$. Wegen $\\dbinom{n}{k}=\\dbinom{n}{n-k}$ folgt $P(X=k)=P(X=n-k)$. Die Verteilung ist symmetrisch zu $\\frac{n}{2}$.",cr:[["$P(X=k)=\\binom{n}{k}\\cdot0{,}5^{n}$ aufgestellt",1],["$\\binom{n}{k}=\\binom{n}{n-k}$ benutzt",1],["Schluss: $P(X=k)=P(X=n-k)$, also symmetrisch",1]],h:"Beide Potenzen von $0{,}5$ lassen sich zusammenfassen.",p:""},
{id:"s22",a:"sto",t:"reason",tg:"Unabhängigkeit",op:"Beurteilen",te:"A",lv:2,q:"Beurteilen Sie die Aussage: „Die Ereignisse $A$ und $B$ mit $P(A)=0{,}5$, $P(B)=0{,}4$ und $P(A\\cap B)=0{,}2$ sind stochastisch unabhängig.“",mod:"Unabhängig heißt $P(A\\cap B)=P(A)\\cdot P(B)$. Hier gilt $P(A)\\cdot P(B)=0{,}5\\cdot0{,}4=0{,}2=P(A\\cap B)$. Die Bedingung ist erfüllt. Die Aussage ist richtig.",cr:[["Definition der Unabhängigkeit genannt",1],["Produkt $0{,}5\\cdot0{,}4=0{,}2$ berechnet",1],["Urteil: Aussage ist richtig, mit Bezug auf die Rechnung",1]],h:"Es gibt eine Produktbedingung.",p:"„Beurteilen“ verlangt ein klares Urteil und die Begründung dazu."},
{id:"s23",a:"sto",t:"match",tg:"Binomialverteilung",op:"Zuordnen",te:"A",lv:1,q:"$X$ ist binomialverteilt mit $n=10$ und $p=0{,}3$. Ordnen Sie jedem Ereignis den passenden Term zu.",L:["höchstens 2 Treffer","genau 2 Treffer","mindestens 3 Treffer","kein Treffer"],R:["$P(X=0)$","$P(X\\leq2)$","$1-P(X\\leq2)$","$P(X=2)$"],m:[1,3,2,0],h:"Höchstens, mindestens, genau: Welches Zeichen gehört dazu?",e:"Höchstens 2 heißt $P(X\\leq2)$. Genau 2 heißt $P(X=2)$. Mindestens 3 ist das Gegenereignis von höchstens 2. Kein Treffer ist $P(X=0)$.",p:""},
{id:"s24",a:"sto",t:"num",tg:"Binomialkoeffizient",op:"Berechnen",te:"A",lv:1,q:"Berechnen Sie den Binomialkoeffizienten $\\dbinom{6}{2}$.",v:15,tol:0.0001,h:"$\\dbinom{n}{k}=\\dfrac{n!}{k!\\cdot(n-k)!}$.",e:"$\\dbinom{6}{2}=\\dfrac{6\\cdot5}{2\\cdot1}=15$.",p:"",gg:"`nCr(6, 2)`."},
{id:"s25",a:"sto",t:"num",tg:"Binomialverteilung",op:"Bestimmen",te:"B",lv:3,q:"Wie oft muss man einen Würfel mindestens werfen, damit mit mindestens $90\\,\\%$ Wahrscheinlichkeit mindestens eine 6 fällt?",v:13,tol:0.0001,h:"$1-\\big(\\frac{5}{6}\\big)^{n}\\geq0{,}9$. Beim Auflösen nach $n$ mit dem Logarithmus dreht sich ein Relationszeichen.",e:"$\\big(\\frac{5}{6}\\big)^{n}\\leq0{,}1$ ergibt $n\\geq\\dfrac{\\ln(0{,}1)}{\\ln(5/6)}\\approx12{,}63$. Also $n=13$.",p:"$\\ln\\!\\big(\\frac{5}{6}\\big)$ ist negativ: Relationszeichen drehen und am Ende aufrunden.",gg:"Zum Prüfen: `InversBinomialMinimumVersuche(0.1, 1/6, 0)` liefert das kleinste $n$ mit $P(X\\leq0)\\leq0{,}1$. Das ist genau die Aufgabe, denn $P(X\\geq1)\\geq0{,}9\\Leftrightarrow P(X\\leq0)\\leq0{,}1$."},
{id:"s26",a:"sto",t:"mc",tg:"Normalverteilung",op:"Beschreiben",te:"A",lv:1,q:"$\\mu$ bleibt gleich, $\\sigma$ wird größer. Wie verändert sich der Graph der Dichtefunktion einer Normalverteilung?",o:["Er wird flacher und breiter, das Maximum bleibt bei $\\mu$","Er wird höher und schmaler","Er wird nach rechts verschoben","Er bleibt unverändert"],c:0,h:"Die Gesamtfläche unter der Kurve bleibt 1.",e:"Größeres $\\sigma$ bedeutet mehr Streuung: flacher und breiter. Das Maximum liegt immer bei $\\mu$.",p:"",g:{k:"norm",mu:50,s:5,c2:{mu:50,s:10},t1:"σ klein",t2:"σ groß",ticks:[30,40,50,60,70],cap:"Zwei Dichtefunktionen mit gleichem $\\mu$"}},
{id:"s27",a:"sto",t:"num",tg:"σ-Regeln",op:"Bestimmen",te:"A",lv:2,q:"$X$ ist binomialverteilt mit $n=400$ und $p=0{,}5$. Bestimmen Sie die obere Grenze des $2\\sigma$-Intervalls um $\\mu$.",v:220,tol:0.0001,h:"Erst $\\mu$ und $\\sigma$ bestimmen.",e:"$\\mu=200$, $\\sigma=\\sqrt{400\\cdot0{,}5\\cdot0{,}5}=10$. Obere Grenze: $200+2\\cdot10=220$.",p:""},
